# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Dragon CSS milestone 1: regular CSS proven against Chrome on a Linux lane"
  slug: "milestone-1"
  kind: existing_plan # specific | open_ended | existing_plan | recovery | audit
  tranche: "Profiles, TypeScript compiler to resolved native properties (boxes, flex, colour, basic text), Chrome capture harness, Linux Taffy lane, side-by-side report; iOS simulator lane is the next milestone."
  status: active # active | blocked | done
  oracle:
    signal: "pnpm test green: at least 100 box and flex fixtures pass compile -> Taffy -> Chrome comparison at 1 device pixel; report generated; exact profile entries each name a passing fixture"
    cadence: "after each Worker package and at final audit"
    final_proof: "Final audit maps the oracle to test output, the report artifact and profile entries"
  intake:
    original_request: "Make a new project dragon / dragon css: regular CSS, tested really well across platforms, as much CSS as possible."
    interpreted_outcome: "A first working slice that compiles regular CSS to style tables and proves layout parity with Chrome automatically."
    input_shape: existing_plan # vague | specific | existing_plan | recovery | audit
    audience: unknown
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: test # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "Oracle met and audited."
    likely_misfire: "Claiming support without passing tests, building iOS before the Linux proof, letting screenshots or AI decide, narrowing fixtures to pass."
    blind_spots_considered: []
    existing_plan_facts:
      - "Plan and evidence: docs/research (T025 direction, T018 design, testing-plan.md, css-support.md, draft profile)."
      - "Owner: separate project named Dragon CSS, npm package dragon (1.0.0-alpha prereleases), Markless first consumer."
      - "Build time in TypeScript with yuku; thin Swift/Kotlin runtime; Taffy for layout pending measurement."
      - "Owner 2026-09-26: agents must work well with it, like StyleX (locality, predictable merging, typed errors)."
      - "Owner 2026-09-26: compile straight to native properties (generated Swift using platform mechanisms); only the layout engine is an on-device library."
      - "Owner 2026-09-26: DX goal is that people focus on one platform and it just works on the other; find the pitfalls to avoid."
      - "Owner 2026-09-26: Dragon needs semantic analysis of CSS itself (symbols, references, typed values, variable graph, cascade, join with the element tree); the compiler is built on it."
      - "Owner 2026-09-26: the dragon npm package needs a defined API surface; primary audience assumed to be framework and tool authors (import { x } from \"dragon\")."
      - "Owner-approved design principles 2026-09-26 (goal.md): resolve every style per reachable state at build time; generate parity tests per component state; compiler owns platform choices (text runs, inherited text styles, borders, shadows, z-index, hover); web output compiled from the same result when a native target is configured; fonts declared once and checked; platform defaults (safe-area root, keyboard avoidance, 100vh)."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  # missing and bundled_not_installed use PM fallback; unknown requires one exact-role attempt before fallback.
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/milestone-1/"
    command: "node /Users/jacksm5pro/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/milestone-1"

