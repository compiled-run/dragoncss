  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/milestone-2/"
    command: "node /Users/jacksm5pro/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/milestone-2"

