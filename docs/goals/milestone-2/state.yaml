tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Deep research: native layout engine strategy. Compare (a) the TypeScript engine mechanically translated to Swift and Kotlin (and C or others later), (b) one Dragon-owned core in Rust with a C ABI (iOS static lib, Android JNI, WASM for web tests), (c) one Dragon-owned core in Zig (same shape; yuku is the owner's Zig project), (d) the TypeScript engine running on device in an embedded JS engine (JavaScriptCore, Hermes, QuickJS), (e) any other credible option. Answer the owner's question directly: what can stay TypeScript, what cannot, and is Rust or Zig worth it."
    inputs:
      - "docs/decisions.md (Layout engine, decisions 6-11), docs/api.md 4.1-4.4, docs/research/platform-playbook.md, packages/layout (engine source rules and size), notes of milestone-1 T001, T022, T023"
    constraints:
      - "Read-only except docs/goals/milestone-2/notes/T001-engine-strategy.md and /tmp scratch. Measurements allowed under /tmp (for example: engine source size, a tiny translation or cross-compile probe) with no repo changes and no installs outside /tmp."
      - "Score each option on: drift impossibility (can the native engines disagree with the reference?), parity across iOS, Android, macOS, web tests and future targets, toolchain weight for contributors and CI, binary size and startup, runtime speed on device, integer 1/64 px determinism, debuggability, fit with owner decisions (own engines, TS build time, pure sync compiler), and cost to reach milestone-2 parity."
      - "Cite sources with URL and access date; say what was run versus read. Flag anything that needs an owner decision."
    expected_output:
      - "Option table with evidence and a recommended strategy"
      - "Plain answer: what stays TypeScript, what cannot, Rust/Zig worth it or not and why"
    receipt:
      result: done
      harness: claude-code
      summary: "Recommend option (a): the TS engine stays the only hand-written engine, and a Dragon-owned translator generates Swift and Kotlin from a checked TS subset. Every target must reproduce all 258 vectors and a shared differential fuzz corpus. The Swift translation of units.ts matched 320,000/320,000 values. C, Zig and Rust cores also matched, but a Rust or Zig core is either a hand port (drift) or replaces the TS reference (reverses a decision). It still needs Swift and Kotlin for helpers and text callbacks, and adds NDK, JNI and FFI glue. Embedded JS passes 258/258 in JSC but is about 8x slower than V8 and asymmetric, because Android has no built-in engine. Kotlin is unmeasured (no JDK). Seven owner decisions are listed."
      evidence:
        - notes/T001-engine-strategy.md
        - "RAN: packages/layout/src has 16 files and 2,950 lines (flex.ts 779, validate.ts 363, block.ts 320, units.ts 252); 258 vectors, 17 MB; 1,134 test lines"
        - "RAN: construct census: 116 type aliases, 47 arrows, 7 Map, 15 spreads, 12 throw, 1 RegExp (validate.ts); Math limited to fround/trunc/floor/ceil/round"
        - "RAN: 320,000 seeded edge-heavy cases generated from build/units.js across 16 functions"
        - "RAN: Swift 6.4 translation of units.ts: 320,000 pass, 0 fail; also compiled for arm64-apple-ios15.0-simulator (with a sysroot warning, not run in a simulator)"
        - "RAN: C, Zig 0.16 and Rust 1.98 C-ABI cores all 320,000/0; Zig wasm (2,048 B) and Rust wasm32-wasip1 (3,725 B) 320,000/0 in Node 24"
        - "RAN: C with -ffast-math fails 2,520 cases; a planted missing fround fails 1,609 cases, so the corpus catches translation slips"
      note: notes/T001-engine-strategy.md
  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Deep research: native device lanes at parity. For iOS (UIKit, simulator on this Mac) and Android (Views, emulator on arm64 macOS): how to host generated code in a test app, dump frames and applied property values after layout settles, bundle Ahem, pin simulator/emulator images, run headless from pnpm test, and keep CI-friendly. Include what each needs installed, what the owner must install for Android (JDK, SDK, emulator image) and exact commands, text-engine hooks for Dragon-owned line boxes (TextKit, StaticLayout/LineHeightSpan), and native paint evidence for promoting paint rows."
    inputs:
      - "docs/research/testing-plan.md (layers 3+), platform-playbook.md, notes/T014-ios-playbook.md and T015-android-playbook.md (milestone-1 notes), docs/decisions.md 6-14"
    constraints:
      - "Read-only except docs/goals/milestone-2/notes/T002-device-lanes.md and /tmp scratch. May run xcrun simctl and xcodebuild probes in /tmp (no repo changes). Do not install Android tooling."
      - "Treat iOS and Android symmetrically: same lanes, same dump schema, same tolerances; call out any place one platform would get weaker proof and how to avoid it."
    expected_output:
      - "Lane design per platform with a shared dump schema"
      - "Owner install list for Android with commands"
      - "Risks and what cannot be proven where"
    receipt:
      result: done
      harness: claude-code
      summary: "Ran real iOS probes: a Swift package XCTest and a minimal UIKit app on the iPhone 17 simulator (iOS 26.5). Boot 6 s, cold build and test 12 s, warm 2 s. They dumped fractional frames, exact TextKit 1 half-leading line boxes and numeric pixels. Main finding: Chrome's layout changes at a real DPR; Playwright's deviceScaleFactor alone hides it. Both lanes therefore need new Chrome captures and engine vectors at DPR 2 and 3, plus 2.625 as an Android extra. Proposed: one dragon.native-dump/1 schema, one pixel-snap rule, and paint evidence only from compositor captures (layer.render is wrong for shadows). Android install: JDK 17, cmdline tools, about 3 GB. Android CI runs on ubuntu with KVM, because macOS arm64 runners lack nested virtualisation."
      evidence:
        - notes/T002-device-lanes.md
        - "Ran: xcodebuild test of a Swift package on the iPhone 17 simulator (iOS 26.5). Measured boot 6 s, cold build and test 12 s, warm 2 s, 8 s when xcodebuild boots the simulator itself. Test body 22 ms. Output: scale=3, frames read back unsnapped (152.33)."
        - "Ran: TEST_RUNNER_DRAGON_OUT made the simulator test write its JSON dump directly to a path on the Mac (/tmp/m2t002/dump.json)."
        - "Ran: the TextKit 1 NSLayoutManagerDelegate per-line hook with Ahem 10 at line-height 15 gave lines at y=0/15/30 with baselines 10.5/25.5/40.5, which is exact CSS half-leading. Ahem registered through CTFontManagerRegisterFontsForURL (ascender 8, descender -2)."
        - "Ran: minimal UIKit app built with swiftc, run with simctl launch --console-pty. drawHierarchy(afterScreenUpdates:) pixels equal the simctl screenshot pixels exactly, shadow pixel included (181). layer.render gives 246, so it cannot be used as paint evidence."
        - "Ran: Chrome 145.0.7632.6 with --force-device-scale-factor 3: a 0.5px border computes to 0.333333px and an inline-block of Ahem is 10.66667 tall. At 2.625 a line height is 12.95238. With Playwright deviceScaleFactor only, the numbers are identical to DPR 1. All 258 committed captures are at DPR 1."
      note: notes/T002-device-lanes.md
