# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Dragon CSS milestone 2: native targets at parity (iOS and Android, same proof on every platform)"
  slug: "milestone-2"
  kind: existing_plan # specific | open_ended | existing_plan | recovery | audit
  tranche: "Research and decide the native engine strategy, then build it so every native target gets the same proof pipeline: a layout engine that reproduces the shared vectors, generated native code from the one compiled result, a device lane comparing native frames and applied values with Chrome, and profile rows promoted only by passing native cases. iOS runs on the local simulator; Android at the same bar once its toolchain exists."
  status: active # active | blocked | done; execution continues in docs/goals/milestone-2-proof (T001-T010), this board holds history and its T999 audit
  oracle:
    signal: "pnpm test green, plus: (1) every native layout engine (iOS, Android) reproduces 100% of the shared layout vectors bit for bit; (2) the iOS simulator lane and the Android emulator lane each run the full milestone-1 corpus through generated native code and match Chrome at 1 device px, with applied-value dumps equal to the expected dumps; (3) a lane-parity check proves every configured native target has the same lanes and coverage (no target has fewer cases, fewer lanes or weaker tolerances); (4) iOS and Android profile rows become exact only through passing native cases."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final audit maps each oracle clause to test output, native lane reports and profile rows per platform; any platform lane blocked on owner tooling is reported as not met, never counted as passing."
  intake:
    original_request: "Prep milestone 2. Deep research pass and figure it out. Scope-wise I want to support iOS, Android, etc. We're on a Mac so the iOS simulator is fine, but I don't want 'web and iOS work but Android sucks'. Is there a reason we don't use Rust or Zig to be able to simulate, or is that not worth it? What can we do in TypeScript vs not?"
    interpreted_outcome: "Dragon proves CSS on real native platforms with equal rigour on iOS and Android (and a model that extends to macOS and other targets), built on an engine strategy chosen by evidence, including an honest answer to TypeScript vs Rust vs Zig."
    input_shape: existing_plan # vague | specific | existing_plan | recovery | audit
    audience: "owner; then framework authors (Markless first)"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: test # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "Oracle clauses 1-4 met for iOS and Android and audited."
    likely_misfire: "Shipping an iOS lane and calling Android 'later' (the exact outcome the owner rejected); hand-porting the engine per platform so engines drift; picking Rust/Zig or TypeScript by preference instead of evidence; claiming native support from Chrome-only proof; letting the easier platform get more fixtures or looser checks."
    blind_spots_considered:
      - "No Android toolchain on this Mac (no JDK, Kotlin, Android SDK or emulator); Android lanes need an owner install."
      - "Native text engines measure glyphs themselves; Dragon owns the line box (decision 7), so text parity is the hardest part on both platforms."
      - "Engine strategy choices (TS translated to Swift/Kotlin, one Dragon-owned Rust or Zig core with C ABI, or an embedded JS engine) trade drift risk, toolchain weight, binary size and speed; the owner rejected third-party engines, not native languages as such."
      - "The web build must stay synchronous pure TypeScript for the compiler (api.md 4.4); an engine language change must not break that."
      - "Milestone-1 fixtures use Ahem; native lanes need the same font bundled on device."
    existing_plan_facts:
      - "Milestone 1 done (docs/goals/milestone-1, T041): Dragon TypeScript layout engine packages/layout, 258 shared vectors, 116 layout fixtures, Chrome 145 macOS reference, 221 iOS paint/overflow rows at caveat pending a native paint lane."
      - "Owner decisions (docs/decisions.md): Dragon owns its layout engine (no Taffy or other third-party engine); the TypeScript engine is the reference that native versions must reproduce exactly on shared vectors; compile straight to native properties with generated code; the only on-device library is layout; every target is a backend; minimum iOS 15, Android 10 (API 29), macOS 13; first platform iOS then Android (decision 11, now superseded in spirit by the owner's 2026-09-27 parity requirement)."
      - "Owner 2026-09-27: iOS, Android 'etc.' at parity; no second-class platform. Owner asks for a researched answer on Rust or Zig versus TypeScript."
      - "Tooling: Xcode 27.0, iOS 26.5 simulator runtime, iPhone 17 simulators available (licence accepted 2026-09-27). No Android or JVM tooling installed."
      - "Deferred candidates: custom properties/var()/@layer (Tailwind path, notes in milestone-1 T034), first real Linux run (owner approval), T005 diagnostics recommendations beyond S5."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

