      - 'Owner 2026-09-28: selection and editing of custom-drawn text: Dragon builds it, with native feel (answer shown in the screenshot; not yet recorded in decisions.md).'
      - 'Env: JAVA_HOME=/opt/homebrew/opt/openjdk@17 ANDROID_HOME=/opt/homebrew/share/android-commandlinetools DRAGON_WPT_DIR=/Users/jacksm5pro/dev/open-source/dragon/vendor/wpt.'
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 8
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  parallel_lanes:
    - active_task is the PM's focus; tasks listed under dispatched run concurrently in their own worktrees.
    - Only the integrator (T002 and successors) merges into master; lanes commit on their own branches.
    - Only one task at a time may boot simulators or emulators; the PM grants a device lease.
    - 'inline.ts and text.ts are serial: P4, engine-linebreak, P5, V, INL1, TXT1.'
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
