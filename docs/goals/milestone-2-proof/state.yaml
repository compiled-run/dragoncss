    proof_type: test
    completion_proof: Checkpoints 1-3 met on iOS and Android and audited by T999.
    likely_misfire: Parallel lanes collide on shared files or hand-merge generated files; one platform lags and becomes later; a HarfBuzz mismatch is tolerated; the north star is 'verified' by screenshot
      judgement instead of numeric lanes.
    blind_spots_considered:
