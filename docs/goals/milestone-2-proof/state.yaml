    original_request: setup a new /goal and continue this work. Also maximum parallelization please.
    interpreted_outcome: Resume the rate-limited milestone-2 work (integrator merges, TXT1-0 HarfBuzz gate, P5 device lanes with the pixel check) and drive it through the three owner checkpoints, running every lane that is disjoint in parallel.
    input_shape: recovery
    audience: owner; then framework authors (Markless first)
    authority: requested
    proof_type: test
    completion_proof: Checkpoints 1-3 met on iOS and Android and audited by T999.
    likely_misfire: Parallel lanes collide on shared files or hand-merge generated files; one platform lags and becomes later; a HarfBuzz mismatch is tolerated; the north star is 'verified' by screenshot judgement instead of numeric lanes.
    blind_spots_considered:
      - The /tmp/dragon-int integration worktree is mid-merge of feat-block-elements (conflicts resolved, regeneration half done; the previous Worker was running regen.sh with UA capture).
      - The /tmp/dragon-hb worktree has vendor/harfbuzz staged but no shim, build or gate yet.
      - The P5 stop needs the owner's decisions.md edits on master (T015 §3.3 and §5).
      - The simulators and emulators are one shared machine resource; device-lane runs must not overlap.
      - The north star depends on many roadmap packages; FORM-a is pulled forward per coverage-roadmap.md.
    existing_plan_facts:
      - T015 (milestone-2 notes/T015-p4-review-p5-plan.md) approved P4 and specified P5 (§4) with merge must-fixes M1 and M2 (§2), board changes (§5) and a revised P6 and P7.
