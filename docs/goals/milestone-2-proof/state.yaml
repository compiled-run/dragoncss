      - 'Text plan (docs/research/text-plan-summary.md): serial on inline.ts and text.ts: P4, engine-linebreak, P5, V1/V2, INL1, TXT1a-d, TXT2. TXT1-0 and TXT1-C are parallel-safe because they write new files only.'
