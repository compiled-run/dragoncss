# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Milestone 2 proof: HarfBuzz gate, wave-1 integration, P5 device lanes, north star on device"
  slug: "milestone-2-proof"
  kind: recovery # specific | open_ended | existing_plan | recovery | audit
  tranche: "Continuous: run parallel lanes (PM docs, integrator, TXT1-0, TXT1-C, value model, P5, north star) in disjoint worktrees, merging serially through the integrator, until all three checkpoints pass on iOS and Android."
  status: active # active | blocked | done
  oracle:
    signal: "pnpm test green on master, plus (1) the TXT1-0 gate: WASM HarfBuzz plus the Zig shim equals Chrome LU widths on 620/620 spike paragraphs, and the iOS xcframework and Android .so build; (2) P5: all five device lanes (iOS 2 and 3; Android 2, 2.625 and 3) pass layout-vectors-device, device-frames, device-applied, device-lines and device-pixels over every master fixture, with derived counts and the raster plant caught; (3) the music-player north star runs end to end on the iPhone simulator and the Android emulator, and matches Chrome frames, applied values and pixels under the P5 lane rules."
    cadence: "after each Worker package merges, and at final audit"
    final_proof: "T999 maps each checkpoint to test output and lane reports per platform; a lane blocked on owner tooling is not met."
  intake:
    original_request: "setup a new /goal and continue this work. Also maximum parallelization please."
    interpreted_outcome: "Resume the rate-limited milestone-2 work (integrator merges, TXT1-0 HarfBuzz gate, P5 device lanes with the pixel check) and drive it through the three owner checkpoints, running every lane that is disjoint in parallel."
    input_shape: recovery # vague | specific | existing_plan | recovery | audit
    audience: "owner; then framework authors (Markless first)"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: test # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "Checkpoints 1-3 met on iOS and Android and audited by T999."
    likely_misfire: "Parallel lanes collide on shared files or hand-merge generated files; one platform lags and becomes later; a HarfBuzz mismatch is tolerated; the north star is 'verified' by screenshot judgement instead of numeric lanes."
    blind_spots_considered:
      - "The /tmp/dragon-int integration worktree is mid-merge of feat-block-elements (conflicts resolved, regeneration half done; the previous Worker was running regen.sh with UA capture)."
      - "The /tmp/dragon-hb worktree has vendor/harfbuzz staged but no shim, build or gate yet."
      - "The P5 stop needs the owner's decisions.md edits on master (T015 §3.3 and §5)."
      - "The simulators and emulators are one shared machine resource; device-lane runs must not overlap."
      - "The north star depends on many roadmap packages; FORM-a is pulled forward per coverage-roadmap.md."
    existing_plan_facts:
      - "T015 (milestone-2 notes/T015-p4-review-p5-plan.md) approved P4 and specified P5 (§4) with merge must-fixes M1 and M2 (§2), board changes (§5) and a revised P6 and P7."
      - "Merge order: feat-block-elements (in progress), feat-cascade-var, feat-units, wpt-breadth, engine-linebreak, then t014-p4-backends with M1 and M2. Generated files are regenerated at merge."
      - "Text plan (docs/research/text-plan-summary.md): serial on inline.ts and text.ts: P4, engine-linebreak, P5, V1/V2, INL1, TXT1a-d, TXT2. TXT1-0 and TXT1-C are parallel-safe because they write new files only."
      - "HarfBuzz pinned at fa2908bf16d2ccd6623f4d575455fea72a1a722b; the shim is dragon_hb.zig built by zig build (Zig 0.16 installed) to WASM, an iOS xcframework and the Android .so; Chrome's advance function is trunc(float(float(units*size/upem))*65536)."
      - "Owner 2026-09-28: selection and editing of custom-drawn text: Dragon builds it, with native feel (answer shown in the screenshot; not yet recorded in decisions.md)."
      - "Env: JAVA_HOME=/opt/homebrew/opt/openjdk@17 ANDROID_HOME=/opt/homebrew/share/android-commandlinetools DRAGON_WPT_DIR=/Users/jacksm5pro/dev/open-source/dragon/vendor/wpt."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 4 # owner asked for maximum parallelization; each writer has its own worktree and disjoint scope (see lanes)
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  parallel_lanes:
    - "active_task is the PM's focus; tasks listed under dispatched run concurrently in their own worktrees."
    - "Only the integrator (T002 and successors) merges into master; lanes commit on their own branches."
    - "Only one task at a time may boot simulators or emulators; the PM grants a device lease."
    - "inline.ts and text.ts are serial: P4, engine-linebreak, P5, V, INL1, TXT1."
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

