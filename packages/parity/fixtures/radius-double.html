<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; align-items: flex-start; width: 380px; padding: 10px; column-gap: 12px; row-gap: 12px; background-color: #fbfaf4; }
.d { width: 90px; height: 60px; background-color: #f2d04c; border: 9px double #2a3b8f; border-radius: 20px; }
.wide { border-width: 15px; border-radius: 30px; }
.thin { border-width: 1px; border-radius: 10px; }
.three { border-width: 3px; border-radius: 12px; }
.circle { width: 70px; height: 70px; border-width: 12px; border-radius: 50%; background-color: #ffffff; }
.ellipse { width: 120px; height: 50px; border-width: 8px; border-radius: 60px / 25px; }
.corners { border-width: 10px; border-radius: 30px 4px 18px 0 / 20px 10px 30px 0; }
.clip { overflow: hidden; border-width: 12px; border-radius: 24px; }
.kid { width: 200px; height: 30px; background-color: #27ae60; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="base" class="d"></div>
<div data-dragon-id="wide" class="d wide"></div>
<div data-dragon-id="thin" class="d thin"></div>
<div data-dragon-id="three" class="d three"></div>
<div data-dragon-id="circle" class="d circle"></div>
<div data-dragon-id="ellipse" class="d ellipse"></div>
<div data-dragon-id="corners" class="d corners"></div>
<div data-dragon-id="clip" class="d clip"><div data-dragon-id="kid" class="kid"></div></div>
</div>
</body>
</html>
