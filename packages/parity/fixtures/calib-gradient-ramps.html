<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.r { width: 400px; height: 14px; }
.dark { background: linear-gradient(to right, #000, #101010); }
.dark2 { background: linear-gradient(to right, #000408, #081018); }
.colour { background: linear-gradient(to right, rgb(40, 80, 160), rgb(200, 120, 30) 50%, rgb(20, 200, 90)); }
.alpha { background: linear-gradient(to right, rgba(255, 0, 0, 0), rgba(255, 0, 0, 0.5)) #fff; }
.vert { width: 400px; height: 120px; background: linear-gradient(170deg, #020406, #0c1014 60%, #203040); }
.rad { width: 400px; height: 60px; background: radial-gradient(ellipse at 60% 40%, #1a1a1a, #060606); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="dark" class="r dark"></div>
<div data-dragon-id="dark2" class="r dark2"></div>
<div data-dragon-id="colour" class="r colour"></div>
<div data-dragon-id="alpha" class="r alpha"></div>
<div data-dragon-id="vert" class="vert"></div>
<div data-dragon-id="rad" class="rad"></div>
</body>
</html>
