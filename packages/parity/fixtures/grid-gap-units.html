.m { grid-template-columns: 20px 20px; grid-template-rows: 6px 6px; gap: normal; }
.fl { display: flex; align-items: flex-start; margin-bottom: 2px; }
.n { font-size: 10px; grid-template-columns: auto auto; column-gap: 1.2em; row-gap: calc(1em - 4px); }
.n > div { width: 20px; }
.s { width: 10px; height: 6px; }
.p { font-size: 15px; grid-template-columns: repeat(2, 20px); grid-auto-rows: auto; row-gap: 0.4em; column-gap: 0.4rem; }
