.k { mask-image: initial; mask-repeat: inherit; -webkit-mask-composite: unset; }
.m { mask: initial; }
.i { mask-size: inherit; -webkit-mask-position: inherit; }
.row { display: flex; width: 180px; }
</style>
</head>
