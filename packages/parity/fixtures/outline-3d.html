<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; column-gap: 34px; row-gap: 34px; padding: 22px; background-color: rgb(236, 240, 244); color: rgb(90, 20, 140); }
.b { width: 56px; height: 40px; background-color: rgb(240, 200, 80); }
.g1 { outline: 8px groove rgb(200, 60, 60); }
.g2 { outline: 6px groove rgb(20, 40, 60); outline-offset: 3px; }
.g3 { outline: 1px groove rgb(30, 150, 60); outline-offset: 2px; }
.r1 { outline: 8px ridge rgb(255, 255, 255); }
.r2 { outline: 7px ridge rgb(0, 0, 0); outline-offset: -3px; }
.i1 { outline: 5px inset rgb(30, 150, 60); }
.i2 { outline: 6px inset rgb(0, 0, 0); outline-offset: 2px; }
.i3 { outline: 4.5px inset rgb(60, 90, 50); outline-offset: 1.4px; }
.u1 { outline: 5px outset rgb(255, 255, 255); }
.u2 { outline: 6px outset currentcolor; outline-offset: 2px; }
.u3 { border: 3px solid rgb(100, 120, 140); outline: 5px outset rgb(100, 120, 140); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="g1" class="b g1"></div>
<div data-dragon-id="g2" class="b g2"></div>
<div data-dragon-id="g3" class="b g3"></div>
<div data-dragon-id="r1" class="b r1"></div>
<div data-dragon-id="r2" class="b r2"></div>
<div data-dragon-id="i1" class="b i1"></div>
<div data-dragon-id="i2" class="b i2"></div>
<div data-dragon-id="i3" class="b i3"></div>
<div data-dragon-id="u1" class="b u1"></div>
<div data-dragon-id="u2" class="b u2"></div>
<div data-dragon-id="u3" class="b u3"></div>
</div>
</body>
</html>
