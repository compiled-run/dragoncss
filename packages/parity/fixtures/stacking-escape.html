<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { height: 260px; background-color: rgb(235, 245, 235); }
.row { position: relative; height: 110px; }
.clip { width: 60px; height: 40px; overflow: hidden; background-color: rgb(80, 80, 80); }
.d { position: absolute; inset-inline-start: 40px; top: 30px; width: 60px; height: 40px; z-index: 3; background-color: rgb(230, 60, 60); }
.l { width: 100px; height: 40px; background-color: rgb(60, 120, 230); }
.nav { display: flex; height: 40px; background-color: rgb(30, 30, 50); }
.title { width: 100px; }
.lb { position: relative; z-index: 40; width: 60px; height: 30px; background-color: rgb(255, 255, 255); }
.ov1 { position: absolute; inset-inline-start: 80px; top: 115px; width: 120px; height: 60px; z-index: 20; background-color: rgb(5, 6, 8); }
.ov2 { position: absolute; inset-inline-start: 90px; top: 120px; width: 60px; height: 100px; z-index: 30; background-color: rgb(150, 30, 150); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="row" class="row"><div data-dragon-id="e-clip" class="clip"><div data-dragon-id="e-d" class="d"></div></div><div data-dragon-id="e-l" class="l"></div></div>
<div data-dragon-id="nav" class="nav"><div data-dragon-id="title" class="title"></div><div data-dragon-id="e-lb" class="lb"></div></div>
<div data-dragon-id="e-ov1" class="ov1"></div>
<div data-dragon-id="e-ov2" class="ov2"></div>
</div>
</body>
</html>
