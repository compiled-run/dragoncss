<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.shell { position: relative; margin: 20px; width: 240px; height: 200px; background-color: #24292f; overflow: hidden; }
.video { position: absolute; left: 50%; top: 50%; width: 36%; height: 50px; background-color: #cf222e; transform: translate(-50%, -50%); }
.record { position: absolute; left: 20px; top: 20px; width: 120px; height: 120px; background-color: #57606a; transform: translateX(-18%) rotate(8deg); }
.marker { position: absolute; left: 50%; top: 50%; width: 28%; height: 8px; background-color: #ffffff; transform-origin: 0 50%; }
.one { transform: rotate(28deg) translateX(22%); }
.two { width: 18%; background-color: #fff8c5; transform: rotate(142deg) translateX(34%); }
.dot { position: absolute; left: 50%; top: 50%; width: 10%; height: 12px; background-color: #1a7f37; transform: translate(-50%, -50%); }
.button { margin: 0 20px; width: 60px; height: 30px; background-color: #0969da; transform: scale(1.08); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="shell" class="shell"><div data-dragon-id="record" class="record"><div data-dragon-id="one" class="marker one"></div><div data-dragon-id="two" class="marker two"></div><div data-dragon-id="dot" class="dot"></div></div><div data-dragon-id="video" class="video"></div></div>
<div data-dragon-id="button" class="button"></div>
</body>
</html>
