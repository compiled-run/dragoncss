<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; line-height: 1; }
.a { width: 12ch; height: 3ex; background-color: #e8d36a; }
.b { font-size: 13px; width: 7ch; padding: 1ex 2ch 1cap 0.5ch; margin: 1ex 0 -0.5ex 2ch; border: 1px solid #1a1a2e; background-color: #9ad0ec; }
.c { font-size: 20px; width: 50%; min-width: 3ch; max-width: 9.5ch; height: 1.3ex; margin-top: 0.7cap; background-color: #c7e9b0; }
.d { display: flex; flex-wrap: wrap; width: 30ch; column-gap: 1.5ch; row-gap: 1ex; padding-inline-start: 1ch; background-color: #f3c4fb; }
.d > div { flex: 0 0 6ch; height: 2cap; background-color: #3a86ff; }
.d > .big { font-size: 17px; flex-basis: 3.5ch; }
.e { position: relative; top: 1ex; left: -1.5ch; width: 8ch; height: 1cap; background-color: #ff595e; }
.f { position: relative; height: 5ex; width: 20ch; background-color: #ffca3a; }
.g { position: absolute; right: 2ch; bottom: 1cap; width: 3ch; height: 1ex; font-size: 16px; background-color: #8ac926; }
.h { display: grid; grid-template-columns: 40px 40px; column-gap: 1ch; row-gap: 0.7ex; font-size: 13px; }
.h > div { height: 1ex; background-color: #6a4c93; }
.v { --w: 4ch; width: var(--w); height: 1ex; background-color: #1982c4; }
.v2 { font-size: 15px; }
.t { width: 9ch; padding: 0.3ex 0.3ch; font-size: 13px; background-color: #e0e0e0; }
.i { padding-left: 1ch; margin-right: 0.5ex; font-size: 16px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="a">XX XX</div>
<div data-dragon-id="b" class="b">XXX XX XXXX X</div>
<div data-dragon-id="c" class="c"></div>
<div data-dragon-id="d" class="d"><div data-dragon-id="d1"></div><div data-dragon-id="d2" class="big"></div><div data-dragon-id="d3"></div><div data-dragon-id="d4"></div></div>
<div data-dragon-id="e" class="e"></div>
<div data-dragon-id="f" class="f"><div data-dragon-id="g" class="g"></div></div>
<div data-dragon-id="h" class="h"><div data-dragon-id="h1"></div><div data-dragon-id="h2"></div><div data-dragon-id="h3"></div></div>
<div data-dragon-id="v" class="v"></div>
<div data-dragon-id="v2" class="v v2"></div>
