<!DOCTYPE html>

<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.g { display: grid; width: 160px; grid-template-columns: repeat(4, auto); justify-content: start; column-gap: 2px; margin-bottom: 4px; align-items: baseline; }
.f13 { font-size: 13px; }
.f17 { font-size: 17px; }
.f20 { font-size: 20px; }
.f25 { font-size: 25px; }
.pb7 { padding-bottom: 7px; }
.pt15 { padding-top: 15px; }
.mt { margin-top: 3.5px; }
.mb { margin-bottom: 4px; }
.mpct { margin-top: 10%; }
.bt { border-top: 3px solid; }
.box { width: 10px; height: 30px; }
.box2 { width: 12px; height: 17.5px; }
.half { width: 10px; height: 50%; }
.minhalf { width: 10px; min-height: 50%; }
.fixed { grid-template-rows: 50px; }
.fixed2 { grid-template-rows: 40px 30px; row-gap: 3px; }
.flexrow { height: 40px; grid-template-rows: 1fr; }
.span2 { grid-row: span 2; }
.col2 { grid-column: 2; }
.ai-start { align-items: start; }
.as-base { align-self: baseline; }
.as-first { align-self: first baseline; }
.as-start { align-self: start; }
.as-end { align-self: end; }
.as-stretch { align-self: stretch; }
.am { margin-top: auto; }
.inner { display: grid; grid-template-columns: auto auto; align-items: baseline; padding-top: 5px; }
.innerflex { display: flex; align-items: baseline; padding-top: 2px; }
.fx { display: flex; align-items: baseline; width: 200px; margin-bottom: 4px; }
.fg { display: grid; grid-template-columns: auto auto; }
.pt20 { padding-top: 20px; }
.clip { overflow: hidden; height: 6px; }
.pgap { grid-template-rows: auto auto; row-gap: 10%; }
.dist { height: 90px; grid-template-rows: auto auto; align-content: space-between; }
</style>
</head>
