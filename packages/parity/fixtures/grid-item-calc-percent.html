<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.g { display: grid; margin-bottom: 3px; background-color: #eee; }
.au { width: 200px; grid-template-columns: auto auto auto; justify-content: start; }
.fx { width: 160px; grid-template-columns: 80px 80px; grid-template-rows: 40px; }
.fr { width: 160px; grid-template-columns: 1fr 1fr; }
.pc { padding-left: calc(10% + 4px); padding-top: calc(5% + 1px); }
.mc { margin-left: calc(10% + 3px); margin-bottom: calc(5% - 1px); }
.mp { margin-right: 10%; }
.wc { width: calc(50% - 4px); }
.mnc { min-width: calc(25% + 10px); }
.mxc { max-width: calc(50% - 10px); }
.mnp { min-width: 30%; }
.mxp { max-width: 40%; }
.hc { height: calc(50% + 2px); }
.mnhc { min-height: calc(25% + 3px); }
.mxhc { max-height: calc(50% - 5px); }
.mxhp { max-height: 30%; }
.t { height: 30px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="g au"><div data-dragon-id="a1" class="pc">XX</div><div data-dragon-id="a2" class="mc">XX</div><div data-dragon-id="a3" class="mp">XX</div></div>
<div data-dragon-id="b" class="g fr"><div data-dragon-id="b1" class="pc">XX</div><div data-dragon-id="b2" class="mc mp">X</div><div data-dragon-id="b3" class="wc">X</div><div data-dragon-id="b4" class="mnc">X</div></div>
<div data-dragon-id="c" class="g au"><div data-dragon-id="c1" class="wc">XX</div><div data-dragon-id="c2" class="mnc">X</div><div data-dragon-id="c3" class="mxc">XXXX XX</div></div>
<div data-dragon-id="d" class="g fx"><div data-dragon-id="d1" class="mxc">XXXXXX XXX</div><div data-dragon-id="d2" class="mnp mxp">XXXXXXXX</div></div>
<div data-dragon-id="e" class="g au"><div data-dragon-id="e1" class="mnp">X</div><div data-dragon-id="e2" class="mxp">XXX XXX</div></div>
<div data-dragon-id="f" class="g fx"><div data-dragon-id="f1" class="hc"></div><div data-dragon-id="f2" class="mnhc">X</div></div>
<div data-dragon-id="h" class="g fx"><div data-dragon-id="h1" class="mxhc"><div data-dragon-id="h1a" class="t"></div></div><div data-dragon-id="h2" class="mxhp"><div data-dragon-id="h2a" class="t"></div></div></div>
<div data-dragon-id="k" class="g au"><div data-dragon-id="k1" class="hc">X</div><div data-dragon-id="k2" class="mnhc mxhc">X</div></div>
</body>
</html>
