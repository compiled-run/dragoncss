<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; column-gap: 34px; row-gap: 34px; padding: 22px; background-color: rgb(236, 240, 244); }
.b { width: 52px; height: 40px; background-color: rgb(40, 90, 200); }
.r1 { border-radius: 10px; outline: 3px solid rgb(200, 0, 200); outline-offset: 2px; }
.r2 { border-radius: 12px; outline: 9px double rgb(20, 160, 60); outline-offset: 1px; }
.r3 { border-radius: 50%; outline: 7.5px double rgb(230, 120, 0); }
.r4 { border-radius: 16px 4px; border: 3px solid rgb(0, 0, 0); outline: 4px solid rgb(220, 30, 30); outline-offset: -5px; }
.r5 { border-radius: 20px / 8px; outline: 2px solid rgb(0, 120, 120); outline-offset: 5px; }
.r6 { border-top-left-radius: 18px; outline: 5px solid rgb(120, 0, 160); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="r1" class="b r1"></div>
<div data-dragon-id="r2" class="b r2"></div>
<div data-dragon-id="r3" class="b r3"></div>
<div data-dragon-id="r4" class="b r4"></div>
<div data-dragon-id="r5" class="b r5"></div>
<div data-dragon-id="r6" class="b r6"></div>
</div>
</body>
</html>
