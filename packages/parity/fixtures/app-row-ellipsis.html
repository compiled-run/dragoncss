<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
/* A settings row (examples/real-pages): an ellipsised label beside its value in a flex row. Left to right only, as Dragon truncates. */
body { margin: 0; font-family: Ahem; font-size: 10px; }
.row { display: flex; align-items: center; gap: 8px; width: 160px; }
.label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.value { flex: none; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row"><div data-dragon-id="label" class="label">Notifications and sounds</div><div data-dragon-id="value" class="value">On</div></div>
</body>
</html>
