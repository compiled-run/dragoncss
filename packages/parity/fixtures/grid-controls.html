<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.g { display: grid; grid-template-columns: 80px 1fr auto; gap: 4px 6px; width: 300px; padding: 2px; }
.f { display: grid; gap: 3px; width: 200px; margin-top: 6px; }
button { font: inherit; margin: 0; padding: 2px 6px; border: 2px solid #036; background-color: #cdf; }
input { font: inherit; margin: 0; padding: 3px 4px; border: 1px solid #333; background-color: #fff; }
select { font: inherit; margin: 0; padding: 2px 4px; border: 1px solid #333; background-color: #fff; color: #000; }
.w { width: 100%; }
.s { width: 70px; min-width: 0; }
.c { justify-self: center; }
.e { align-self: end; }
.n { display: grid; grid-template-columns: auto auto; width: 60px; margin-top: 6px; }
.h { width: 50%; }
.m { max-width: 80%; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="g" class="g">
<button data-dragon-id="b1" type="button">XX</button>
<button data-dragon-id="b2" type="button" class="c">XXX</button>
<button data-dragon-id="b3" type="button" class="e">X</button>
<input data-dragon-id="t1" readonly="" value="XX">
<input data-dragon-id="t2" readonly="" class="w" value="XXXX">
<select data-dragon-id="s1" class="s"><option data-dragon-id="s1-o0">XX</option></select>
</div>
<div data-dragon-id="f" class="f">
<input data-dragon-id="t3" readonly="" class="w" value="XX">
<select data-dragon-id="s2" class="s"><option data-dragon-id="s2-o0">XXX</option></select>
<button data-dragon-id="b4" type="button">XX</button>
</div>
<div data-dragon-id="n" class="n">
<button data-dragon-id="b5" type="button" class="w">XXXXXX</button>
<input data-dragon-id="t4" readonly="" class="h" value="XX">
<button data-dragon-id="b6" type="button" class="m">XXXXXXXX</button>
<select data-dragon-id="s3" class="s w"><option data-dragon-id="s3-o0">XX</option></select>
</div>
</body>
</html>
