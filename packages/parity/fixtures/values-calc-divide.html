<head>

.e { width: calc(max(41.1%, 1px) / 7); height: 5px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="c" class="c"><div data-dragon-id="a" class="a"></div><div data-dragon-id="b" class="b"></div><div data-dragon-id="d" class="d"></div><div data-dragon-id="e" class="e"></div></div>
<div data-dragon-id="a2" class="a"></div><div data-dragon-id="b2" class="b"></div>
</body>
</html>
