.st { width: stretch; height: 4px; margin: 0 15px 0 25px; padding: 0 4px; border: 2px solid; }
.wf { width: -webkit-fill-available; height: 4px; margin-left: 30px; }
.sa { width: stretch; height: 4px; margin: 0 auto; }
.sb { width: stretch; height: 4px; box-sizing: border-box; padding: 0 9px; margin-right: 11px; }
.xs { width: 500px; max-width: stretch; height: 4px; margin-left: 20px; }
.ns { width: 10px; min-width: -webkit-fill-available; height: 4px; padding-right: 6px; }
.ov { overflow: hidden; width: stretch; height: 4px; margin-right: 40px; }
.fit { width: fit-content; border: 1px solid; }
.wmn { width: -webkit-min-content; border: 1px solid; }
.wmx { width: -webkit-max-content; }
.wfc { width: -webkit-fit-content; padding-left: 3px; }
.xwm { max-width: -webkit-min-content; }
.nwx { width: 5px; min-width: -webkit-max-content; }
