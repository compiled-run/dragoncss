<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; column-gap: 24px; row-gap: 24px; padding: 16px; background-color: rgb(255, 255, 255); }
.deco { width: 64px; height: 40px; padding: 6px; background-color: rgb(255, 0, 0); border: 4px solid rgb(200, 0, 0); border-radius: 10px; visibility: hidden; }
.kid { width: 24px; height: 16px; background-color: rgb(0, 0, 255); visibility: visible; }
.clip { width: 48px; height: 32px; overflow: hidden; background-color: rgb(255, 0, 0); border: 3px solid rgb(200, 0, 0); visibility: hidden; }
.over { width: 80px; height: 20px; margin-left: 8px; background-color: rgb(0, 150, 150); visibility: visible; }
.round-clip { width: 48px; height: 48px; overflow: hidden; border-radius: 16px; background-color: rgb(255, 0, 0); visibility: collapse; }
.fill { width: 64px; height: 64px; background-color: rgb(250, 160, 40); visibility: visible; }
.pad { width: 48px; height: 40px; padding: 4px; background-color: rgb(255, 0, 0); border: 2px solid rgb(200, 0, 0); visibility: collapse; }
.pad-kid { width: 24px; height: 16px; background-color: rgb(0, 120, 0); visibility: visible; }
.pad-hidden-kid { width: 24px; height: 8px; background-color: rgb(255, 0, 0); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="hid-deco" class="deco"><div data-dragon-id="kid-deco" class="kid"></div></div>
<div data-dragon-id="hid-clip" class="clip"><div data-dragon-id="kid-over" class="over"></div></div>
<div data-dragon-id="hid-round" class="round-clip"><div data-dragon-id="kid-fill" class="fill"></div></div>
<div data-dragon-id="hid-pad" class="pad"><div data-dragon-id="kid-pad" class="pad-kid"></div><div data-dragon-id="hid-pad-kid" class="pad-hidden-kid"></div></div>
</div>
</body>
</html>
