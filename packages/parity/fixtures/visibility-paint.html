<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; column-gap: 24px; row-gap: 24px; padding: 16px; background-color: rgb(255, 255, 255); }
.deco { width: 64px; height: 40px; padding: 6px; background-color: rgb(255, 0, 0); border: 4px solid rgb(200, 0, 0); border-radius: 10px; box-shadow: 0 0 0 10px rgb(255, 0, 0), inset 2px 2px 0 rgb(120, 0, 0); outline: 3px solid rgb(255, 0, 0); outline-offset: 2px; visibility: hidden; }
.kid { width: 24px; height: 16px; background-color: rgb(0, 0, 255); visibility: visible; }
.shadowed { width: 24px; height: 16px; background-color: rgb(0, 120, 0); box-shadow: 4px 4px 0 rgb(0, 0, 0); visibility: visible; }
.group { width: 32px; height: 32px; background-color: rgb(255, 0, 0); opacity: 0.5; visibility: hidden; }
.group-kid { width: 16px; height: 32px; background-color: rgb(0, 0, 255); visibility: visible; }
.ctx { position: relative; z-index: 1; width: 48px; height: 32px; background-color: rgb(255, 0, 0); visibility: hidden; }
.up { position: relative; z-index: 2; left: 24px; top: 8px; width: 40px; height: 16px; background-color: rgb(0, 150, 150); visibility: visible; }
.pair { display: flex; }
.later { width: 48px; height: 32px; background-color: rgb(250, 220, 60); }
.pad { width: 48px; height: 40px; padding: 4px; background-color: rgb(255, 0, 0); visibility: collapse; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="hid-group" class="group"><div data-dragon-id="kid-group" class="group-kid"></div></div>
<div data-dragon-id="hid-deco" class="deco"><div data-dragon-id="kid-deco" class="kid"></div></div>
<div data-dragon-id="pair" class="pair"><div data-dragon-id="hid-ctx" class="ctx"><div data-dragon-id="kid-up" class="up"></div></div><div data-dragon-id="later" class="later"></div></div>
<div data-dragon-id="hid-pad" class="pad"><div data-dragon-id="kid-shadowed" class="shadowed"></div></div>
</div>
</body>
</html>
