<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 4px; }
.btn { width: 60px; height: 20px; padding: 2px 6px; margin-bottom: 4px; background-color: #ddd; color: #333; }
.btn.primary { width: 90px; background-color: #0366d6; color: white; }
.btn.primary.large { height: 32px; padding: 4px 10px; }
.btn.ghost { background-color: transparent; border: 1px solid; }
.card { display: flex; flex-direction: column; width: 160px; padding: 4px; margin-top: 6px; border: 1px solid #ccc; }
.card.active { border-color: #0366d6; padding: 8px; }
.card .title { height: 14px; background-color: #eee; }
.card.active .title { height: 22px; color: #0366d6; }
.card > .body { height: 30px; }
.card.active > .body.expanded { height: 60px; flex-grow: 1; }
div.tag.on { margin-left: 12px; width: 40px; height: 10px; }
.tag { width: 20px; height: 10px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="b1" class="btn"></div>
<div data-dragon-id="b2" class="btn primary"></div>
<div data-dragon-id="b3" class="btn primary large"></div>
<div data-dragon-id="b4" class="btn ghost"></div>
<div data-dragon-id="c1" class="card"><div data-dragon-id="c1t" class="title"></div><div data-dragon-id="c1b" class="body expanded"></div></div>
<div data-dragon-id="c2" class="card active"><div data-dragon-id="c2t" class="title"></div><div data-dragon-id="c2b" class="body expanded"></div><div data-dragon-id="c2c" class="body"></div></div>
<div data-dragon-id="t1" class="tag"></div>
<div data-dragon-id="t2" class="tag on"></div>
</body>
</html>
