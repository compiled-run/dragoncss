<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
/* Overlaps whose paint order needs PNT1 (positioned r over d, t's text over c, ob outside o's clip) share one colour. */
.a { width: 100px; height: 20px; background-color: #c00; }
.b { width: 100px; height: 20px; margin-top: -10px; background-color: #00c; }
.t { width: 40px; height: 10px; line-height: 20px; }
.c { width: 100px; height: 20px; margin-top: -15px; background-color: #000; }
.r { position: relative; width: 50px; height: 20px; background-color: #cc0; }
.d { width: 100px; height: 20px; margin-top: -10px; background-color: #cc0; }
.f { display: flex; width: 200px; height: 30px; }
.f1 { order: 2; width: 60px; height: 30px; background-color: #c00; }
.f2 { order: 1; width: 60px; height: 30px; margin-right: -30px; background-color: #00c; }
.g1 { width: 60px; height: 30px; background-color: #c0c; }
.g2 { width: 60px; height: 30px; margin-left: -30px; background-color: #0cc; }
.o { overflow: hidden; width: 50px; height: 20px; background-color: #fcc; }
.o1 { width: 100px; height: 40px; background-color: #660; }
.ab { position: absolute; left: 120px; top: 120px; width: 40px; height: 20px; background-color: #fff; }
.p { position: relative; overflow: hidden; width: 50px; height: 20px; background-color: #fcf; }
.pa { position: absolute; left: 30px; top: 0; width: 40px; height: 20px; background-color: #333; }
.e { width: 10.5px; height: 10.25px; background-color: #c00; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="a"></div>
<div data-dragon-id="b" class="b"></div>
<div data-dragon-id="t" class="t">XX XX</div>
<div data-dragon-id="c" class="c"></div>
<div data-dragon-id="r" class="r"></div>
<div data-dragon-id="d" class="d"></div>
<div data-dragon-id="f" class="f"><div data-dragon-id="f1" class="f1">XX</div><div data-dragon-id="f2" class="f2">XXXXXXXX</div></div>
<div data-dragon-id="g" class="f"><div data-dragon-id="g1" class="g1">XXXXXXXXX</div><div data-dragon-id="g2" class="g2"></div></div>
<div data-dragon-id="o" class="o"><div data-dragon-id="o1" class="o1"></div><div data-dragon-id="ob" class="ab"></div></div>
<div data-dragon-id="p" class="p"><div data-dragon-id="pa" class="pa"></div></div>
<div data-dragon-id="e" class="e"></div>
</body>
</html>
