<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.g { display: grid; margin-bottom: 3px; background-color: #eee; }
.au { grid-template-columns: auto auto auto; justify-content: start; }
.fx { width: 150px; grid-template-columns: 50px 50px 50px; }
.blk { display: block; }
.inl { display: inline; }
.ib { display: inline-block; }
.if { display: inline-flex; }
.no { display: none; }
.st { position: static; overflow: visible; }
.fl { float: none; clear: none; }
.mna { min-width: auto; min-height: auto; }
.mxn { max-width: none; max-height: none; }
.cb { box-sizing: content-box; width: 20px; height: 6px; padding: 2px 3px; border: 1px solid; }
.bn { border: none; padding: 1px; }
.b0 { border: 0; }
.bs { border-style: none; border-width: 4px; }
.bm { border-style: solid; border-width: medium thin; }
.bk { border-top: thick solid; }
.va1 { vertical-align: middle; }
.va2 { vertical-align: top; }
.va3 { vertical-align: bottom; }
.va4 { vertical-align: baseline; }
.va5 { vertical-align: text-top; }
.va6 { vertical-align: sub; }
.h8 { height: 8px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="g au"><div data-dragon-id="a1" class="blk">XX</div><span data-dragon-id="a2" class="inl">X</span><span data-dragon-id="a3" class="ib">XXX</span></div>
<div data-dragon-id="b" class="g au"><div data-dragon-id="b1" class="if"><div data-dragon-id="b1a">X</div><div data-dragon-id="b1b">XX</div></div><div data-dragon-id="b2" class="no">XXXX</div><div data-dragon-id="b3" class="st">X</div><div data-dragon-id="b4" class="fl">XX</div></div>
<div data-dragon-id="c" class="g au"><div data-dragon-id="c1" class="mna">XX XX</div><div data-dragon-id="c2" class="mxn">XXX</div><div data-dragon-id="c3" class="cb"></div></div>
<div data-dragon-id="d" class="g fx"><div data-dragon-id="d1" class="mna"><div data-dragon-id="d1a" class="h8">XXXXXXXX</div></div><div data-dragon-id="d2" class="cb">X</div><div data-dragon-id="d3" class="mxn h8"></div></div>
<div data-dragon-id="e" class="g au"><div data-dragon-id="e1" class="bn">X</div><div data-dragon-id="e2" class="b0">X</div><div data-dragon-id="e3" class="bs">X</div></div>
<div data-dragon-id="f" class="g au"><div data-dragon-id="f1" class="bm">X</div><div data-dragon-id="f2" class="bk">X</div></div>
<div data-dragon-id="h" class="g fx"><div data-dragon-id="h1" class="va1">X</div><div data-dragon-id="h2" class="va2 h8"></div><div data-dragon-id="h3" class="va3">XX</div><div data-dragon-id="h4" class="va4">X</div><div data-dragon-id="h5" class="va5 h8"></div><div data-dragon-id="h6" class="va6">X</div></div>
</body>
</html>
