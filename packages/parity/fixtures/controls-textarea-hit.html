<!DOCTYPE html>

.form { display: grid; gap: 6px; width: 260px; padding: 10px; background-color: #eee; }

.short { height: 34px; }
.x { display: block; overflow-x: auto; overflow-y: hidden; scrollbar-width: auto; white-space: pre; }
.block { width: 200px; padding: 6px; background-color: #ddd; }
.after { height: 10px; background-color: #9ad; }
</style>
</head>
<body data-dragon-id="body">

<textarea data-dragon-id="t2" readonly="" class="short">XXX XXX XXX XXX XXX XXX XXX XXX XXX XXX XXX</textarea>
</div>
<div data-dragon-id="block" class="block">
<textarea data-dragon-id="t3" readonly="" class="short x">XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX</textarea>
</div>
<div data-dragon-id="after" class="after"></div>
</body>
</html>
