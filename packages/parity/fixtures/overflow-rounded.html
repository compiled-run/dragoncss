<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: flex-start; width: 384px; padding: 8px; column-gap: 14px; row-gap: 14px; background-color: #eef3f7; }
.sc { overflow: auto; width: 80px; height: 60px; border-radius: 16px; }
.fill { width: 120px; height: 100px; background-color: #e67e22; }
.one { border: 1px solid #2c3e50; border-radius: 10px; }
.uneven { border-style: solid; border-color: #16a085; border-width: 2px 6px 10px 4px; }
.ellipse { border: 3px solid #9b59b6; border-radius: 30px / 14px; }
.corners { border: 3px solid #34495e; border-radius: 4px 20px 0 12px; }
.thick { border: 12px solid #2c3e50; border-radius: 8px; }
.yonly { overflow-x: hidden; overflow-y: auto; border: 4px solid #c0392b; border-radius: 50%; }
.pad { padding: 6px; border: 3px solid #27ae60; border-radius: 14px; }
.fits { border: 3px solid #8e44ad; }
.small { width: 40px; height: 30px; background-color: #e67e22; }
.inner { overflow: auto; width: 70px; height: 50px; margin: 4px; border: 3px solid #2980b9; border-radius: 12px; }
.blue { width: 100px; height: 90px; background-color: #3498db; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="s1" class="sc one"><div data-dragon-id="f1" class="fill"></div></div>
<div data-dragon-id="s2" class="sc uneven"><div data-dragon-id="f2" class="fill"></div></div>
<div data-dragon-id="s3" class="sc ellipse"><div data-dragon-id="f3" class="fill"></div></div>
<div data-dragon-id="s4" class="sc corners"><div data-dragon-id="f4" class="fill"></div></div>
<div data-dragon-id="s5" class="sc thick"><div data-dragon-id="f5" class="fill"></div></div>
<div data-dragon-id="s6" class="sc yonly"><div data-dragon-id="f6" class="fill"></div></div>
<div data-dragon-id="s7" class="sc pad"><div data-dragon-id="f7" class="fill"></div></div>
<div data-dragon-id="s8" class="sc fits"><div data-dragon-id="f8" class="small"></div></div>
<div data-dragon-id="s9" class="sc one"><div data-dragon-id="n9" class="inner"><div data-dragon-id="f9" class="blue"></div></div></div>
</div>
</body>
</html>
