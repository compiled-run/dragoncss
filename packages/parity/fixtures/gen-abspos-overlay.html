<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.card { position: relative; width: 100px; height: 40px; margin-bottom: 4px; }
.card::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background-color: rgb(0, 0, 255); }
.tl::before { content: ''; position: absolute; top: 4px; left: 6px; width: 10px; height: 8px; background-color: rgb(255, 0, 0); }
.sz::after { content: 'ab'; position: absolute; top: 2px; right: 3px; width: 30px; height: 12px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="card"><div data-dragon-id="a1">XX</div></div>
<div data-dragon-id="b" class="card tl"><div data-dragon-id="b1">YY</div></div>
<div data-dragon-id="c" class="card sz"><div data-dragon-id="c1">ZZ</div></div>
</body>
</html>
