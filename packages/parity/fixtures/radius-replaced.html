body { margin: 0; }
.row { display: flex; flex-wrap: wrap; align-items: flex-start; width: 380px; padding: 10px; column-gap: 12px; row-gap: 12px; background-color: #fbfaf4; }
img { display: block; }
.avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.ring { width: 64px; height: 64px; border: 4px solid #2a3b8f; border-radius: 50%; object-fit: cover; }
.thick { width: 60px; height: 60px; border: 10px solid #c0392b; border-radius: 50%; object-fit: cover; }
.ellipse { width: 96px; height: 56px; border-radius: 40px / 20px; object-fit: contain; background-color: #ccddff; }
.ellipse-ring { width: 96px; height: 56px; border-style: solid; border-width: 3px 8px; border-color: #27ae60; border-radius: 48px / 28px; object-fit: contain; background-color: #ccddff; }
.corners { width: 80px; height: 60px; border-radius: 4px 24px 0 12px / 8px 16px 0 30px; object-fit: cover; }
.corners-ring { width: 80px; height: 60px; border-style: solid; border-width: 3px 6px 5px 2px; border-color: #8e44ad; border-radius: 4px 28px 0 18px / 10px 20px 0 30px; object-fit: cover; }
.fill { width: 70px; height: 50px; border-radius: 16px; }
.hidden { width: 64px; height: 64px; border: 5px solid #16a085; border-radius: 50%; overflow: hidden; object-fit: cover; }
.tall { width: 80px; height: 44px; border: 2px solid #2a3b8f; border-radius: 22px; object-fit: contain; background-color: #ccddff; }
</style>
