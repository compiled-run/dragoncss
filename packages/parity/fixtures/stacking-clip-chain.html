<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { height: 280px; padding-top: 24px; background-color: rgb(245, 240, 230); }
.app { position: relative; overflow: hidden; height: 220px; background-color: rgb(225, 230, 240); }
.nav { display: flex; height: 40px; background-color: rgb(30, 30, 50); }
.title { width: 100px; }
.lb { position: relative; top: -16px; z-index: 40; width: 60px; height: 60px; background-color: rgb(250, 250, 250); }
.after { position: relative; width: 200px; height: 30px; margin-top: -10px; background-color: rgb(0, 120, 60); }
.row { overflow: hidden; width: 120px; height: 40px; margin-top: 40px; background-color: rgb(200, 200, 120); }
.k { position: relative; z-index: 1; left: 64px; width: 80px; height: 30px; background-color: rgb(200, 40, 40); }
.after2 { position: relative; width: 100px; height: 30px; margin-top: -20px; background-color: rgb(40, 80, 200); }
.card { overflow: hidden; width: 160px; height: 40px; margin-top: 12px; background-color: rgb(120, 200, 220); }
.badge { position: relative; top: 8px; width: 60px; height: 30px; background-color: rgb(250, 120, 0); }
.footer { width: 200px; height: 30px; margin-top: -24px; background-color: rgb(60, 60, 60); }
.ov1 { position: absolute; inset-inline-start: 80px; top: 10px; width: 120px; height: 60px; z-index: 20; background-color: rgb(5, 6, 8); }
.ov2 { position: absolute; inset-inline-start: 90px; top: 20px; width: 60px; height: 100px; z-index: 30; background-color: rgb(150, 30, 150); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="app" class="app">
<div data-dragon-id="nav" class="nav"><div data-dragon-id="title" class="title"></div><div data-dragon-id="c-lb" class="lb"></div></div>
<div data-dragon-id="c-after" class="after"></div>
<div data-dragon-id="row" class="row"><div data-dragon-id="c-k" class="k"></div></div>
<div data-dragon-id="c-after2" class="after2"></div>
<div data-dragon-id="card" class="card"><div data-dragon-id="c-badge" class="badge"></div></div>
<div data-dragon-id="footer" class="footer"></div>
<div data-dragon-id="c-ov1" class="ov1"></div>
<div data-dragon-id="c-ov2" class="ov2"></div>
</div>
</div>
</body>
</html>
