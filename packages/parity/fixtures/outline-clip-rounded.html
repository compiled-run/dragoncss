<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 30px; row-gap: 30px; padding: 18px; background-color: rgb(236, 240, 244); }
.card { width: 120px; overflow: hidden; border-radius: 16px; background-color: rgb(255, 255, 255); }
.row { height: 28px; background-color: rgb(40, 90, 200); }
.a1 { outline: 5px solid rgb(220, 30, 30); }
.a2 { margin: 8px 0; outline: 4px solid rgb(30, 150, 60); outline-offset: 2px; }
.a3 { margin: 0 12px 12px; border-radius: 8px; outline: 3px solid rgb(0, 0, 0); outline-offset: 1px; }
.framed { width: 110px; height: 80px; overflow: clip; border: 8px solid rgb(60, 60, 60); border-radius: 24px 8px; background-color: rgb(250, 230, 120); }
.b1 { height: 34px; background-color: rgb(200, 60, 60); outline: 8px solid rgb(120, 0, 160); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="card" class="card"><div data-dragon-id="a1" class="row a1"></div><div data-dragon-id="a2" class="row a2"></div><div data-dragon-id="a3" class="row a3"></div></div>
<div data-dragon-id="framed" class="framed"><div data-dragon-id="b1" class="b1"></div></div>
</div>
</body>
</html>
