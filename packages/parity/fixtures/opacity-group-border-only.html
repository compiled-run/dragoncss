<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 16px; line-height: 16px; }
.stage { display: flex; flex-direction: column; row-gap: 12px; padding: 8px 16px; background-color: rgb(40, 60, 80); }
.row { display: flex; }
.light { background-color: rgb(245, 240, 225); }
.c { box-sizing: border-box; width: 32px; height: 32px; }
.s16 { width: 16px; }
.s8 { width: 8px; }
.kid { width: 12px; height: 12px; background-color: rgb(20, 120, 60); }
.a { border: 2px solid rgb(0, 0, 0); opacity: 0.5; }
.b { border-style: solid; border-color: rgb(30, 120, 200); border-width: 1px 3px 5px 2px; opacity: 0.6; }
.d { border-left: 6px solid rgb(250, 200, 0); opacity: 0.35; }
.e { border-left: 4px solid rgb(200, 20, 20); border-right: 4px solid rgb(200, 20, 20); opacity: 0.45; }
.f { border: 4px solid rgb(250, 250, 250); opacity: 0.7; }
.g { border: 3px solid rgb(10, 10, 10); color: rgb(60, 90, 230); opacity: 0.8; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="row1" class="row"><div data-dragon-id="ob-a" class="c a"></div><div data-dragon-id="sp1a" class="s16"></div><div data-dragon-id="ob-b" class="c b"></div><div data-dragon-id="sp1b" class="s8"></div><div data-dragon-id="ob-d" class="c d"></div></div>
<div data-dragon-id="row2" class="row light"><div data-dragon-id="ob-e" class="c e"></div><div data-dragon-id="sp2a" class="s16"></div><div data-dragon-id="ob-f" class="c f"><div data-dragon-id="ob-f-kid" class="kid"></div></div><div data-dragon-id="sp2b" class="s8"></div><div data-dragon-id="ob-g" class="c g">X</div></div>
</div>
</body>
</html>
