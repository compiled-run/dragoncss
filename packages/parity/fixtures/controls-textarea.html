.w50 { width: 50px; }
.hidden { overflow: hidden; scrollbar-width: auto; }
.right { text-align: right; }
.dev { appearance: auto; background-color: #fec; }
.ph::placeholder { color: #c00; }
.small::placeholder { font-size: 4px; }
.big { font-size: 16px; }
.pad { padding: 5px 7px; }
