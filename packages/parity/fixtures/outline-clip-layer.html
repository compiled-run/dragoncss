<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { min-height: 300px; margin: 0; background-color: rgb(236, 240, 244); }
.row { display: flex; align-items: flex-start; column-gap: 40px; padding: 24px 24px 0; }
.card { width: 80px; height: 60px; overflow: hidden; border: 1px solid rgb(120, 120, 120); background-color: rgb(250, 250, 250); }
.press { border-radius: 12px; transform: scale(0.97); outline: 3px solid rgb(0, 90, 200); outline-offset: 2px; }
.turn { transform: rotate(8deg); outline: 4px solid rgb(220, 30, 30); outline-offset: 3px; }
.rel { position: relative; border-radius: 6px; outline: 9px double rgb(0, 90, 0); outline-offset: 1px; }
.pic { width: 130px; height: 40px; background-color: rgb(250, 160, 0); }
.tall { height: 90px; background-color: rgb(120, 60, 200); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row1" class="row">
<div data-dragon-id="press" class="card press"><div data-dragon-id="pic1" class="pic"></div></div>
<div data-dragon-id="turn" class="card turn"><div data-dragon-id="tall1" class="tall"></div></div>
<div data-dragon-id="rel" class="card rel"><div data-dragon-id="pic2" class="pic"></div><div data-dragon-id="tall2" class="tall"></div></div>
</div>
</body>
</html>
