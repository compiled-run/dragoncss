.stage { position: relative; width: 300px; padding: 6px; background-color: rgb(245, 240, 230); }
.lay { contain: layout; background-color: rgb(200, 220, 255); }
.gap { margin-top: 12px; height: 8px; margin-bottom: 9px; background-color: rgb(40, 120, 40); }

.ib { display: inline-block; width: 30px; height: 24px; background-color: rgb(250, 190, 60); }
.ibl { contain: layout; }
.ibp { contain: paint; }
.ibs { contain: size layout; width: auto; height: auto; }
.ibi { contain: inline-size layout; width: auto; height: auto; }
.inl { contain: layout inline-size; margin-top: 4px; }
.row { display: flex; align-items: baseline; margin-top: 4px; }
.it { height: 30px; }
.big { font-size: 20px; line-height: 20px; }
.last { display: inline-block; width: 80px; vertical-align: baseline; }
.sh { position: absolute; top: 4px; inset-inline-end: 4px; contain: strict; }
.mix { contain: layout paint; margin-top: 3px; }
.ls { contain: style layout; margin-top: 3px; }
.sp { contain: paint style; margin-top: 3px; }
.ilp { contain: inline-size layout style paint; margin-top: 3px; }
