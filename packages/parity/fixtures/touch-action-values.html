<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; line-height: 10px; --t: pan-y pan-x; }
.box { width: 80px; height: 10px; background-color: rgb(40, 90, 200); }
.au { touch-action: auto; }
.man { touch-action: manipulation; }
.xy { touch-action: pan-x pan-y; }
.yx { touch-action: pan-y pan-x; }
.xyz { touch-action: pan-y pinch-zoom pan-x; }
.up { TOUCH-ACTION: Pan-X PAN-Y; }
.v { touch-action: var(--t); }
.par { touch-action: manipulation; width: 120px; height: 20px; background-color: rgb(200, 60, 40); }
.inh { touch-action: inherit; width: 60px; height: 10px; }
.ini { touch-action: initial; width: 60px; height: 10px; }
.uns { touch-action: unset; width: 60px; height: 10px; }
.f { display: flex; width: 200px; height: 20px; touch-action: pan-x pan-y; }
.fi { width: 60px; height: 20px; touch-action: manipulation; background-color: rgb(20, 160, 80); }
.rel { position: relative; width: 60px; height: 20px; touch-action: manipulation; }
.abs { position: absolute; left: 4px; top: 2px; width: 20px; height: 10px; touch-action: pan-x pan-y pinch-zoom; }
.sp { touch-action: none; }
.gone { display: none; touch-action: pan-y; }
.no { touch-action: none; }
.px { touch-action: pan-x; }
.py { touch-action: pan-y; }
.lu { touch-action: pan-left pan-up; }
.pz { touch-action: pinch-zoom; }
.sc { width: 80px; height: 20px; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; }
.sci { height: 40px; touch-action: pan-y; background-color: rgb(20, 160, 80); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="au" class="box au">X</div>
<div data-dragon-id="man" class="box man">X</div>
<div data-dragon-id="xy" class="box xy">X</div>
<div data-dragon-id="yx" class="box yx">X</div>
<div data-dragon-id="xyz" class="box xyz">X</div>
<div data-dragon-id="up" class="box up">X</div>
<div data-dragon-id="v" class="box v">X</div>
<div data-dragon-id="par" class="par"><div data-dragon-id="inh" class="inh">XX</div><div data-dragon-id="ini" class="ini">X</div></div>
<div data-dragon-id="par2" class="par xy"><div data-dragon-id="inh2" class="inh">X</div><div data-dragon-id="uns" class="uns">X</div></div>
<div data-dragon-id="f" class="f"><div data-dragon-id="f1" class="fi">XXXX</div><div data-dragon-id="f2" class="fi">X</div></div>
<div data-dragon-id="rel" class="rel"><div data-dragon-id="abs" class="abs">X</div></div>
<div data-dragon-id="t">XX <span data-dragon-id="sp" class="sp">XX</span> X</div>
<div data-dragon-id="gone" class="gone"></div>
<div data-dragon-id="no" class="box no">X</div>
<div data-dragon-id="px" class="box px">X</div>
<div data-dragon-id="py" class="box py">X</div>
<div data-dragon-id="lu" class="box lu">X</div>
<div data-dragon-id="pz" class="box pz">X</div>
<div data-dragon-id="par3" class="par no"><div data-dragon-id="noi" class="inh">X</div></div>
<div data-dragon-id="sc" class="sc"><div data-dragon-id="sci" class="sci">X</div></div>
</body>
</html>
