<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 400px; column-gap: 4px; row-gap: 4px; }
.g { width: 44px; height: 28px; }
.down { background: linear-gradient(#2f4f66, #a57c5b); }
.right { background: linear-gradient(to right, #2f4f66, #a57c5b); }
.left { background: linear-gradient(to left, rgb(40, 80, 160), rgb(200, 120, 30) 40%, rgb(20, 200, 90)); }
.up { background: linear-gradient(to top, #123456 5px, #abcdef 20px); }
.deg { background: linear-gradient(110deg, #2f4f66, #a57c5b); }
.deg30 { background: linear-gradient(30deg, #2f4f66, #a57c5b 60%, #102030); }
.turn { background: linear-gradient(0.3turn, #2f4f66, #a57c5b); }
.grad { background: linear-gradient(150grad, #2f4f66, #a57c5b); }
.neg { background: linear-gradient(-30deg, #2f4f66, #a57c5b); }
.over { background: linear-gradient(400deg, #2f4f66, #a57c5b); }
.zero { background: linear-gradient(0, #2f4f66, #a57c5b); }
.hard { background: linear-gradient(90deg, #336699 50%, #996633 50%); }
.multi { background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet); }
.twopos { background: linear-gradient(90deg, #343b47 0 30%, #0b0d12 30% 60%, #405060 60%); }
.rep { background: repeating-linear-gradient(45deg, #222 0 5px, #ddd 5px 10px); }
.rep2 { background: repeating-linear-gradient(to right, #222 10%, #d80 30%); }
.clear { background: linear-gradient(red, transparent) rgb(10, 120, 200); }
.alpha { background: linear-gradient(rgba(255, 0, 0, 0.46), rgba(0, 0, 255, 0.2)) #fff; }
.current { color: #0a8; background: linear-gradient(currentcolor, #fff); }
.shine { background: linear-gradient(110deg, transparent 0 34%, rgba(255, 255, 255, 0.2) 42%, rgba(255, 255, 255, 0.04) 52%, transparent 64%) #203040; }
.track { width: 200px; height: 16px; background: linear-gradient(to right, #2f4f66, #a57c5b); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="down" class="g down"></div>
<div data-dragon-id="right" class="g right"></div>
<div data-dragon-id="left" class="g left"></div>
<div data-dragon-id="up" class="g up"></div>
<div data-dragon-id="deg" class="g deg"></div>
<div data-dragon-id="deg30" class="g deg30"></div>
<div data-dragon-id="turn" class="g turn"></div>
<div data-dragon-id="grad" class="g grad"></div>
<div data-dragon-id="neg" class="g neg"></div>
<div data-dragon-id="over" class="g over"></div>
<div data-dragon-id="zero" class="g zero"></div>
<div data-dragon-id="hard" class="g hard"></div>
<div data-dragon-id="multi" class="g multi"></div>
<div data-dragon-id="twopos" class="g twopos"></div>
<div data-dragon-id="rep" class="g rep"></div>
<div data-dragon-id="rep2" class="g rep2"></div>
<div data-dragon-id="clear" class="g clear"></div>
<div data-dragon-id="alpha" class="g alpha"></div>
<div data-dragon-id="current" class="g current"></div>
<div data-dragon-id="shine" class="g shine"></div>
<div data-dragon-id="track" class="track"></div>
</div>
</body>
</html>
