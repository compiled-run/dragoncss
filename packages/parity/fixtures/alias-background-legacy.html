<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 400px; column-gap: 6px; row-gap: 6px; }
.b { width: 70px; height: 40px; border: 3px solid #123; padding: 4px 6px 2px 8px; background-color: #eee; background-repeat: no-repeat; background-image: linear-gradient(#fa0, #05a); background-position: 0 0; }
.s1 { -webkit-background-size: 20px; }
.s2 { -webkit-background-size: 50%; }
.s3 { -webkit-background-size: 30px 10px; }
.s4 { -webkit-background-size: cover; }
.s5 { -webkit-background-size: auto; }
.s6 { background-size: 10px 30px; -webkit-background-size: 15px; }
.s7 { -webkit-background-size: 20px; background-size: 40px; }
.s8 { -webkit-background-size: 0; }
.o1 { -webkit-background-origin: border; -webkit-background-size: 50% 50%; }
.o2 { -webkit-background-origin: content; -webkit-background-size: 50% 50%; }
.o3 { -webkit-background-origin: padding; background-origin: content-box; -webkit-background-size: 50% 50%; }
.o4 { -webkit-background-origin: CONTENT-box; -webkit-background-size: 50% 50%; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="s1" class="b s1"></div>
<div data-dragon-id="s2" class="b s2"></div>
<div data-dragon-id="s3" class="b s3"></div>
<div data-dragon-id="s4" class="b s4"></div>
<div data-dragon-id="s5" class="b s5"></div>
<div data-dragon-id="s6" class="b s6"></div>
<div data-dragon-id="s7" class="b s7"></div>
<div data-dragon-id="s8" class="b s8"></div>
<div data-dragon-id="o1" class="b o1"></div>
<div data-dragon-id="o2" class="b o2"></div>
<div data-dragon-id="o3" class="b o3"></div>
<div data-dragon-id="o4" class="b o4"></div>
</div>
</body>
</html>
