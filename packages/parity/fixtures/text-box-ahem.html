<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
div { width: 55px; margin-bottom: 7px; }
.lh2 { line-height: 2; }
.both { text-box-trim: trim-both; }
.start { text-box-trim: trim-start; }
.end { text-box-trim: trim-end; }
.alpha { text-box: trim-both text alphabetic; }
.alpha-end { text-box: trim-end text alphabetic; }
.half { line-height: 0.5; }
.lh15 { font-size: 13px; line-height: 1.5; }
.lh23 { line-height: 23px; }
.pad { padding: 5px 3px 4px 6px; border: 2px solid; }
.big { font-size: 20px; line-height: 1; }
.center { text-align: center; }
.shorthand { text-box: text; }
.normal { text-box: normal; }
.under { text-box-edge: text alphabetic; }
</style>
</head>
<body data-dragon-id="body">

</html>
