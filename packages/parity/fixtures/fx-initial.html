<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; color: rgb(20, 40, 160); }
.box { width: 60px; height: 20px; margin: 4px; padding: 2px; background-color: #e8d36a; border: 2px solid #1a1a2e; }
.n { backdrop-filter: none; }
.N { BACKDROP-FILTER: NONE; MIX-BLEND-MODE: NORMAL; }
.m { mix-blend-mode: normal; background-color: #1f6feb; }
.v { --n: none; backdrop-filter: var(--n); mix-blend-mode: initial; }
.i { backdrop-filter: inherit; mix-blend-mode: inherit; width: 30px; height: 8px; background-color: #cf222e; }
.over { position: relative; width: 120px; height: 10px; margin-top: -18px; margin-inline-start: 20px; background-color: #0a3069; mix-blend-mode: normal; }
.row { display: flex; width: 220px; backdrop-filter: none; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="s1" class="box n">XX XX</div>
<div data-dragon-id="s2" class="box N"><div data-dragon-id="s2c" class="i">X</div></div>
<div data-dragon-id="s3" class="box m">XX</div>
<div data-dragon-id="over" class="over"></div>
<div data-dragon-id="s4" class="box v">XXX</div>
<div data-dragon-id="row" class="row"><div data-dragon-id="ra" class="box m">XX</div><div data-dragon-id="rb" class="box n">X</div></div>
</body>
</html>
