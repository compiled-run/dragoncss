<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; color: rgb(20, 40, 160); }
.box { width: 60px; height: 30px; margin: 4px; padding: 3px; background-color: #e8d36a; border: 2px solid #1a1a2e; }
.r { image-rendering: auto; anchor-name: none; anchor-scope: none; position-anchor: none; position-area: none; position-try: none; position-visibility: anchors-visible; }
.R { IMAGE-RENDERING: AUTO; POSITION-TRY: NORMAL NONE; POSITION-TRY-ORDER: Normal; POSITION-TRY-FALLBACKS: None; ANCHOR-NAME: NONE; }
.v { stop-opacity: 1; flood-opacity: 1; mask-type: luminance; text-anchor: start; dominant-baseline: auto; alignment-baseline: auto; baseline-shift: 0; }
.h { shape-rendering: auto; color-interpolation: sRGB; color-interpolation-filters: linearRGB; color-rendering: auto; buffered-rendering: auto; baseline-shift: 0px; }
.k { image-rendering: initial; position-try: unset; anchor-name: revert; stop-opacity: initial; text-anchor: unset; shape-rendering: revert; }
.i { image-rendering: inherit; anchor-scope: inherit; position-anchor: inherit; flood-opacity: inherit; stop-opacity: inherit; text-anchor: inherit; color-interpolation: inherit; color-rendering: inherit; buffered-rendering: inherit; }
.abs { position: absolute; left: 100px; top: 120px; width: 40px; height: 20px; background-color: #4a8a3a; }
.row { display: flex; width: 180px; }
</style>
</head>

<div data-dragon-id="s2" class="box R v"><div data-dragon-id="s2c" class="i">XXX</div></div>

<div data-dragon-id="s4" class="box k">XX</div>

<div data-dragon-id="row" class="row r"><div data-dragon-id="ra" class="box h">XX XX</div><div data-dragon-id="rb" class="box R">XX</div></div>
</body>
</html>
