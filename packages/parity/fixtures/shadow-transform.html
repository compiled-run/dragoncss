<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; width: 296px; padding: 24px; column-gap: 40px; row-gap: 40px; background-color: #fbf8f1; }
.card { box-sizing: border-box; width: 128px; height: 56px; border: 1px solid #e4ddcf; border-radius: 14px; background-color: #ffffff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 4px 14px rgb(0 0 0 / 0.05); }
.slot { isolation: isolate; }
.s98 { transform: scale(0.98); }
.s90 { transform: scale(0.9); box-shadow: 0 6px 6px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3); }
.shift { transform: translate(6px, -4px); }
.aniso { transform: scale(0.9, 0.95); }
.corner { transform: translate(4px, 2px) scale(0.94); transform-origin: 0 0; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="plain-slot" class="slot"><div data-dragon-id="plain" class="card"></div></div>
<div data-dragon-id="s98-slot" class="slot"><div data-dragon-id="s98" class="card s98"></div></div>
<div data-dragon-id="s90-slot" class="slot"><div data-dragon-id="s90" class="card s90"></div></div>
<div data-dragon-id="shift-slot" class="slot"><div data-dragon-id="shift" class="card shift"></div></div>
<div data-dragon-id="aniso-slot" class="slot"><div data-dragon-id="aniso" class="card aniso"></div></div>
<div data-dragon-id="corner-slot" class="slot"><div data-dragon-id="corner" class="card corner"></div></div>
</div>
</body>
</html>
