<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.g { display: grid; width: 180px; margin-bottom: 4px; }
.a { grid-template-columns: 20px 30px 40px; grid-auto-rows: 8px; column-gap: 3px; row-gap: 2px; }
.b { grid-template-columns: repeat(4, 20px); grid-auto-rows: 6px; grid-auto-flow: row dense; }
.c { grid-template-rows: 10px 10px; grid-auto-columns: 12px; grid-auto-flow: column; }
.d { grid-template-columns: 5px 6px; grid-auto-columns: 10px 20px 30px; grid-auto-rows: 7px; }
.e { grid-template-columns: repeat(3, 15px); grid-auto-rows: 9px; grid-auto-flow: column dense; grid-template-rows: repeat(3, 9px); }
.x { height: 4px; }
.s2 { grid-column: span 2; }
.s3 { grid-column: span 3; }
.r2 { grid-row: span 2; }
.p1 { grid-column: 2 / 4; grid-row: 2; }
.p2 { grid-column: -1 / -3; grid-row: 1; }
.p3 { grid-column: span 2 / 3; }
.p4 { grid-row: 3; grid-column: auto; }
.p5 { grid-column: -5 / -4; }
.p6 { grid-column: 5; }
.p7 { grid-column: 1; grid-row: span 2; }
.p8 { grid-area: 2 / 1 / 4 / 3; }
.o1 { order: 2; }
.o2 { order: -1; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="g a"><div data-dragon-id="a1" class="x"></div><div data-dragon-id="a2" class="x p1"></div><div data-dragon-id="a3" class="x p2"></div><div data-dragon-id="a4" class="x s2"></div><div data-dragon-id="a5" class="x o1"></div><div data-dragon-id="a6" class="x o2"></div><div data-dragon-id="a7" class="x p4"></div><div data-dragon-id="a8" class="x p3"></div></div>
<div data-dragon-id="b" class="g b"><div data-dragon-id="b1" class="x s3"></div><div data-dragon-id="b2" class="x s2"></div><div data-dragon-id="b3" class="x"></div><div data-dragon-id="b4" class="x"></div><div data-dragon-id="b5" class="x s3"></div><div data-dragon-id="b6" class="x r2"></div></div>
<div data-dragon-id="c" class="g c"><div data-dragon-id="c1" class="x"></div><div data-dragon-id="c2" class="x r2"></div><div data-dragon-id="c3" class="x"></div><div data-dragon-id="c4" class="x p7"></div><div data-dragon-id="c5" class="x"></div></div>
<div data-dragon-id="d" class="g d"><div data-dragon-id="d1" class="x p5"></div><div data-dragon-id="d2" class="x p6"></div><div data-dragon-id="d3" class="x"></div><div data-dragon-id="d4" class="x p8"></div></div>
<div data-dragon-id="e" class="g e"><div data-dragon-id="e1" class="x r2"></div><div data-dragon-id="e2" class="x r2"></div><div data-dragon-id="e3" class="x"></div><div data-dragon-id="e4" class="x"></div><div data-dragon-id="e5" class="x o2"></div></div>
</body>
</html>
