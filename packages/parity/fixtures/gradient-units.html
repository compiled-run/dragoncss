<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
html { font-size: 20px; }
body { margin: 0; font-size: 10px; }
.row { display: flex; flex-wrap: wrap; width: 400px; column-gap: 4px; row-gap: 4px; }
.g { width: 60px; height: 36px; background-color: #fff; }
.em { background-image: linear-gradient(90deg, #2f4f66 1em, #a57c5b 4em); }
.rem { background-image: radial-gradient(circle 1rem at 1rem 0.5rem, #fa0, #05a); }
.abs { background-image: linear-gradient(#123456 0.1in, #abcdef 12pt); }
.edge { background: linear-gradient(#c33, #33c) right 6px bottom 25% / 20px 10px no-repeat #eee; }
.edgepct { background: linear-gradient(#c33, #33c) right 10% top / 20px 10px no-repeat #eee; }
.centre { background-image: radial-gradient(circle at right 8px bottom 4px, #fa0, #05a); }
.neg { background-image: linear-gradient(90deg, #f00 -10px, #00f 30px); }
.emsize { background: linear-gradient(#0a0, #050) 1em 0.5em / 2em 1rem no-repeat #eee; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="em" class="g em"></div>
<div data-dragon-id="rem" class="g rem"></div>
<div data-dragon-id="abs" class="g abs"></div>
<div data-dragon-id="edge" class="g edge"></div>
<div data-dragon-id="edgepct" class="g edgepct"></div>
<div data-dragon-id="centre" class="g centre"></div>
<div data-dragon-id="neg" class="g neg"></div>
<div data-dragon-id="emsize" class="g emsize"></div>
</div>
</body>
</html>
