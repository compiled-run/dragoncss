<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.a { width: 50svw; height: 10svh; background-color: #c00; }
.b { width: 33.3lvw; height: 7.7dvh; background-color: #0c0; }
.c { width: 25svmin; height: 12.5dvmax; background-color: #00c; }
.d { width: 40dvi; height: 5lvb; background-color: #cc0; }
.e { width: calc(100dvw - 30px); height: calc(3svh + 1px); background-color: #0cc; }
.f { min-height: 20dvh; max-width: 10lvw; width: 100px; height: 2px; background-color: #c0c; }
.g { height: 600px; max-height: 15svh; min-width: 30dvw; width: 10px; background-color: #666; }
.m { margin-left: 5dvw; margin-top: 1lvh; padding-top: 2svh; padding-left: 3svi; width: 10px; height: 3px; background-color: #963; }
.p { position: absolute; top: 2svh; right: 3dvw; width: 4lvmin; height: 5svb; background-color: #369; }
.row { display: flex; width: 380px; height: 60px; align-items: flex-start; column-gap: 2svw; background-color: #eee; }
.row > .x { flex-basis: 10dvw; height: 10svh; background-color: #c60; }
.row > .y { min-height: 15dvh; min-width: 20svw; background-color: #06c; }
.row > .z { max-height: 5lvh; height: 40px; max-width: 10dvw; width: 100px; background-color: #6c6; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="a"></div><div data-dragon-id="b" class="b"></div><div data-dragon-id="c" class="c"></div><div data-dragon-id="d" class="d"></div><div data-dragon-id="e" class="e"></div><div data-dragon-id="f" class="f"></div><div data-dragon-id="g" class="g"></div><div data-dragon-id="m" class="m"></div><div data-dragon-id="p" class="p"></div>
<div data-dragon-id="row" class="row"><div data-dragon-id="x" class="x"></div><div data-dragon-id="y" class="y"></div><div data-dragon-id="z" class="z"></div></div>
</body>
</html>
