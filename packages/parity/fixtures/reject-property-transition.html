<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
@property --x { syntax: "<length>"; inherits: false; initial-value: 10px; }
.a { --x: 20px; height: 4px; width: var(--x); transition: width 1s, --x 1s; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="a"></div>
</body>
</html>
