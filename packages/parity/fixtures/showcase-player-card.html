<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-size: 10px; line-height: 12px; --bg: #0f172a; --card: #1e293b; --edge: #334155; --accent: #f97316; --accent-hi: #fdba74; --accent-lo: #c2410c; --cool: #22d3ee; --muted: #475569; --text: #e2e8f0; --dim: #94a3b8; color: var(--text); }
.stage { display: flex; justify-content: center; align-items: center; height: 300px; background-color: var(--bg); }
.card { display: flex; flex-direction: column; width: 320px; row-gap: 10px; padding-block: 12px 14px; padding-inline: 14px; background-color: var(--card); border-style: solid; border-width: 2px 2px 4px; border-color: var(--edge) var(--edge) var(--accent); }
.head { display: flex; align-items: center; column-gap: 12px; }
.art { width: 64px; height: 64px; flex-shrink: 0; background-color: var(--accent); border: 4px solid; border-color: var(--accent-hi) var(--accent-lo) #9a3412 #fb923c; }
.meta { display: flex; flex-direction: column; row-gap: 6px; flex-grow: 1; }
.title { font-size: 14px; line-height: 16px; color: #ffffff; }
.artist { color: var(--cool); }
.badge { align-self: flex-start; padding-inline: 6px 8px; padding-block: 2px; background-color: var(--edge); border-inline-start: 3px solid var(--cool); color: var(--dim); }
.bar { display: flex; height: 6px; background-color: var(--muted); }
.fill { width: 62%; background-color: var(--accent); border-inline-end: 2px solid #ffffff; }
.times { display: flex; justify-content: space-between; color: var(--dim); }
.controls { display: flex; justify-content: center; align-items: center; column-gap: 12px; }
.btn { width: 24px; height: 24px; background-color: var(--edge); border: 2px solid var(--muted); }
.play { width: 36px; height: 36px; background-color: var(--accent); border: 3px solid; border-color: var(--accent-hi) var(--accent-lo) var(--accent-lo) var(--accent-hi); }
.tabs { display: flex; column-gap: 4px; }
.tab { flex-grow: 1; height: 4px; background-color: var(--edge); }
.tab.on { background-color: var(--cool); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="card" class="card">
<div data-dragon-id="head" class="head">
<div data-dragon-id="art" class="art"></div>
<div data-dragon-id="meta" class="meta">
<div data-dragon-id="title" class="title">XXXXX XXXX</div>
<div data-dragon-id="artist" class="artist">XXX XXXXXXX</div>
<div data-dragon-id="badge" class="badge">XXXX</div>
</div>
</div>
<div data-dragon-id="bar" class="bar"><div data-dragon-id="fill" class="fill"></div></div>
<div data-dragon-id="times" class="times"><div data-dragon-id="now" class="now">X XX</div><div data-dragon-id="total" class="total">X XX</div></div>
<div data-dragon-id="controls" class="controls">
<div data-dragon-id="prev" class="btn"></div>
<div data-dragon-id="play" class="play"></div>
<div data-dragon-id="next" class="btn"></div>
</div>
<div data-dragon-id="tabs" class="tabs"><div data-dragon-id="tab1" class="tab on"></div><div data-dragon-id="tab2" class="tab"></div><div data-dragon-id="tab3" class="tab"></div></div>
</div>
</div>
</body>
</html>
