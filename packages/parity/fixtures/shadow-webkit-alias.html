<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; width: 360px; padding: 20px; column-gap: 30px; row-gap: 30px; background-color: #334455; color: #ffcc66; }
.b { width: 60px; height: 40px; background-color: #ddeeff; }
.alone { -webkit-box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5); }
.list { -webkit-box-shadow: inset 0 0 0 4px #ff6600, 0 6px 10px rgba(0, 0, 0, 0.45); }
.std-last { -webkit-box-shadow: 0 0 0 6px #ff0000; box-shadow: 3px 3px 6px currentcolor; }
.alias-last { box-shadow: 0 0 0 6px #ff0000; -webkit-box-shadow: 3px 3px 6px currentcolor; }
.none { box-shadow: 4px 4px 0 #ff0000; -webkit-box-shadow: none; }
.important { -webkit-box-shadow: -4px 4px 6px 1px rgba(0, 0, 0, 0.5) !important; box-shadow: 0 0 0 6px #ff0000; }
.parent { -webkit-box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4); background-color: #ccddee; padding: 6px; }
.child { width: 24px; height: 16px; background-color: #884422; -webkit-box-shadow: inherit; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="alone" class="b alone"></div>
<div data-dragon-id="list" class="b list"></div>
<div data-dragon-id="std-last" class="b std-last"></div>
<div data-dragon-id="alias-last" class="b alias-last"></div>
<div data-dragon-id="none" class="b none"></div>
<div data-dragon-id="important" class="b important"></div>
<div data-dragon-id="parent" class="parent"><div data-dragon-id="inherit" class="child"></div></div>
</div>
</body>
</html>
