<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.a { width: 50px; height: 10px; background-color: #ccc; }
.a:hover { background-color: #0c0; }
.b { width: 50px; height: 10px; background-color: #ddd; }
.b:active { width: 60px; }
.a:hover ~ .b:active { height: 20px; }
.c { width: 40px; height: 10px; background-color: #999; }
.c:hover:focus { width: 70px; }
.c:focus { background-color: #00c; }
.d { width: 10px; height: 10px; background-color: #c0c; }
.d:focus { width: 10px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="a"></div>
<div data-dragon-id="b" class="b"></div>
<div data-dragon-id="c" class="c">X</div>
<div data-dragon-id="d" class="d"></div>
</body>
</html>
