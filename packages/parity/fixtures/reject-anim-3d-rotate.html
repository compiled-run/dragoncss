<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.a { width: 10px; height: 4px; animation: k 1s infinite; }
@keyframes k { from { transform: rotate(0deg); } to { transform: rotate3d(1, 0, 0, 45deg); } }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="a"></div>
</body>
</html>
