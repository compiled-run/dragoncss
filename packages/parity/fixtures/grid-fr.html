<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.g { display: grid; margin-bottom: 4px; grid-auto-rows: 6px; }
.a { width: 100px; grid-template-columns: 1fr 1fr 1fr; }
.b { width: 100.7px; grid-template-columns: repeat(7, 1fr); }
.c { width: 211px; grid-template-columns: 10px repeat(2, 1fr 2fr) 20px; column-gap: 1.5px; }
.d { width: 100px; grid-template-columns: 0.3fr 0.2fr; }
.e { width: 120px; grid-template-columns: minmax(80px, 1fr) 1fr; }
.f { width: 90px; grid-template-columns: minmax(min-content, 1fr) minmax(min-content, 3fr); }
.h { width: 60px; height: 50px; grid-template-rows: 1fr 2fr; grid-auto-rows: auto; }
.i { width: 60px; grid-template-rows: 1fr 1fr; }
.j { width: 60px; min-height: 30px; grid-template-rows: 1fr 1fr; }
.k { width: 150px; grid-template-columns: 1.3fr 2.7fr auto; column-gap: 7px; }
.x { height: 3px; }
.w { grid-column: 1 / 3; }
</style>
</head>
