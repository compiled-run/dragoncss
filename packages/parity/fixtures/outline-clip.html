<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 30px; row-gap: 30px; padding: 18px; background-color: rgb(236, 240, 244); }
.list { width: 120px; overflow: hidden; border: 4px solid rgb(60, 60, 60); background-color: rgb(255, 255, 255); }
.row { height: 26px; background-color: rgb(40, 90, 200); }
.a1 { margin: 9px; outline: 3px solid rgb(220, 30, 30); outline-offset: 2px; }
.a2 { outline: 6px solid rgb(30, 150, 60); }
.a3 { margin-top: 12px; outline: 4px dashed rgb(0, 0, 0); outline-offset: 1px; }
.cut { width: 110px; height: 70px; padding: 6px; overflow: clip; background-color: rgb(250, 230, 120); outline: 3px solid rgb(120, 0, 160); }
.b1 { height: 30px; background-color: rgb(200, 60, 60); outline: 9px double rgb(20, 20, 120); outline-offset: 1px; }
.deep { width: 100px; height: 60px; overflow: hidden; background-color: rgb(200, 220, 200); }
.wrap { padding: 5px; }
.c1 { height: 30px; overflow: hidden; background-color: rgb(250, 160, 0); outline: 10px solid rgb(0, 120, 120); outline-offset: -3px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="l1" class="list"><div data-dragon-id="a1" class="row a1"></div><div data-dragon-id="a2" class="row a2"></div><div data-dragon-id="a3" class="row a3"></div></div>
<div data-dragon-id="cut" class="cut"><div data-dragon-id="b1" class="b1"></div></div>
<div data-dragon-id="deep" class="deep"><div data-dragon-id="wrap" class="wrap"><div data-dragon-id="c1" class="c1"></div></div></div>
</div>
</body>
</html>
