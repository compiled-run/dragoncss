<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.t { width: 10px; height: 4px; margin-bottom: 1px; background-color: #ccc; }
@media not all and (max-width: 300px) { .a { width: 20px; } }
@media not screen and (min-width: 300px) { .b { width: 30px; } }
@media (max-width: 300px) or (min-width: 350px) { .c { width: 40px; } }
@media (max-width: 300px) or (min-width: 450px) { .d { width: 50px; } }
@media (max-width: 300px), (min-width: 450px) { .e { width: 60px; } }
@media (max-width: 300px), (min-width: 350px) { .f { width: 70px; } }
@media not (min-width: 450px) { .g { width: 80px; } }
@media (min-width: 350px) and (not (max-width: 380px)) { .h { width: 90px; } }
@media (min-width: 350px) and (foo: bar) { .i { width: 100px; } }
@media print { .j { width: 110px; } }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="t a"></div>
<div data-dragon-id="b" class="t b"></div>
<div data-dragon-id="c" class="t c"></div>
<div data-dragon-id="d" class="t d"></div>
<div data-dragon-id="e" class="t e"></div>
<div data-dragon-id="f" class="t f"></div>
<div data-dragon-id="g" class="t g"></div>
<div data-dragon-id="h" class="t h"></div>
<div data-dragon-id="i" class="t i"></div>
<div data-dragon-id="j" class="t j"></div>
</body>
</html>
