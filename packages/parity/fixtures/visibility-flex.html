.g { flex-grow: 1; width: 0; height: 20px; background-color: rgb(200, 60, 60); }
.col { visibility: collapse; }
.hid { visibility: hidden; }
.vis { visibility: visible; }
</style>
</head>

<div data-dragon-id="r3" class="row"><div data-dragon-id="a3" class="i"></div><div data-dragon-id="hid-b3" class="i hid"></div><div data-dragon-id="c3" class="i"></div></div>
<div data-dragon-id="hid-r4" class="row col"><div data-dragon-id="kid-a4" class="i vis">X</div><div data-dragon-id="hid-b4" class="g">XX</div></div>
</div>
</body>
</html>
