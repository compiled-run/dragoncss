<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.row { display: flex; height: 60px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.a { width: 50px; margin-right: env(safe-area-inset-right); }
.b { flex: 1; margin-bottom: env(safe-area-inset-bottom); }
.side { margin-left: calc(env(safe-area-inset-left) + 4px); width: calc(50% - env(safe-area-inset-left)); height: env(safe-area-inset-bottom); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row"><div data-dragon-id="a" class="a"></div><div data-dragon-id="b" class="b"></div></div>
<div data-dragon-id="side" class="side"></div>
</body>
</html>
