<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
/* Every edge, inset and offset is a multiple of 8 CSS px, a whole device px at DPR 2, 3 and 2.625, so no clip edge is antialiased. */
body { margin: 0; font-family: Ahem; font-size: 16px; line-height: 16px; }
.stage { position: relative; height: 280px; padding: 8px; background-color: rgb(236, 240, 244); }
.wrap { position: relative; width: 368px; height: 112px; margin-bottom: 8px; overflow: hidden; background-color: rgb(250, 200, 60); border: 8px solid rgb(120, 40, 20); }
.flow { width: 96px; height: 64px; background-color: rgb(40, 90, 200); clip-path: inset(8px); }
.flow-abs { position: absolute; left: 64px; top: 40px; width: 64px; height: 48px; background-color: rgb(200, 40, 120); }
.k { width: 40px; height: 16px; background-color: rgb(30, 160, 80); }
.over { width: 64px; height: 32px; margin-top: -16px; background-color: rgb(120, 220, 220); }
.oh { position: absolute; left: 128px; top: 8px; width: 80px; height: 48px; border: 8px solid rgb(20, 20, 20); overflow: hidden; background-color: rgb(230, 230, 120); clip-path: inset(8px 0); }
.wide { width: 112px; height: 24px; background-color: rgb(200, 100, 20); }
.zc { position: absolute; left: 248px; top: 8px; width: 96px; height: 64px; background-color: rgb(90, 50, 20); clip-path: inset(0 8px); }
.z1 { position: relative; z-index: 1; left: 16px; width: 48px; height: 96px; background-color: rgb(250, 120, 200); }
.outer { position: absolute; left: 8px; top: 8px; width: 160px; height: 96px; background-color: rgb(30, 120, 60); clip-path: inset(8px); }
.inner { position: absolute; left: 24px; top: 24px; width: 160px; height: 48px; background-color: rgb(200, 40, 40); clip-path: inset(0 0 0 16px); }
.rad { position: absolute; left: 272px; top: 8px; width: 80px; height: 80px; border-radius: 24px; background-color: rgb(120, 40, 160); clip-path: inset(8px); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="w1" class="wrap">
<div data-dragon-id="cut-flow" class="flow"><div data-dragon-id="cut-flow-k" class="k"></div><div data-dragon-id="cut-flow-abs" class="flow-abs"></div></div>
<div data-dragon-id="over" class="over"></div>
<div data-dragon-id="cut-oh" class="oh"><div data-dragon-id="cut-oh-wide" class="wide"></div></div>
<div data-dragon-id="cut-zc" class="zc"><div data-dragon-id="cut-z1" class="z1"></div></div>
</div>
<div data-dragon-id="w2" class="wrap">
<div data-dragon-id="cut-outer" class="outer"><div data-dragon-id="cut-inner" class="inner"></div></div>
<div data-dragon-id="cut-rad" class="rad"></div>
</div>
</div>
</body>
</html>
