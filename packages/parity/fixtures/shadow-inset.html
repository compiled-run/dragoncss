<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; width: 370px; padding: 15px; column-gap: 28px; row-gap: 28px; background-color: #e8eef4; }
.b { width: 96px; height: 60px; background-color: #3a6ea5; }
.soft { box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6); }
.ring { box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.5); }
.offset { box-shadow: inset 10px 8px 6px -2px rgba(0, 0, 0, 0.5); }
.round { border-radius: 18px; box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.45); }
.border { border: 5px solid #d9a441; box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.7); }
.both { border-radius: 12px; box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.4), 0 6px 12px rgba(0, 0, 0, 0.5); }
.full { box-shadow: inset 0 0 0 40px rgba(200, 60, 60, 0.9); }
.circle { width: 70px; height: 70px; border-radius: 50%; box-shadow: inset 0 0 1.25rem rgba(0, 0, 0, 0.45); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="soft" class="b soft"></div>
<div data-dragon-id="ring" class="b ring"></div>
<div data-dragon-id="offset" class="b offset"></div>
<div data-dragon-id="round" class="b round"></div>
<div data-dragon-id="border" class="b border"></div>
<div data-dragon-id="both" class="b both"></div>
<div data-dragon-id="full" class="b full"></div>
<div data-dragon-id="circle" class="b circle"></div>
</div>
</body>
</html>
