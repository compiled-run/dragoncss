<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 400px; column-gap: 3px; row-gap: 2px; }
.sw { width: 30px; height: 12px; }
.named { background: tomato; }
.hex3 { background: #0f0; }
.hex8 { background: #102030e6; }
.rgb { background: rgb(10 20 30 / 50%); }
.rgba { background: rgba(1, 2, 3, 0.3); }
.hsl { background: hsl(120 50% 50%); }
.clear { background: transparent; }
.current { color: coral; background: currentcolor; }
.none { background: none; }
.none-color { background: none red; }
.color-none { background: #abc none; }
.spelled { background: none repeat scroll 0% 0% / auto padding-box border-box olive; }
.keywords { background: left top / auto auto repeat repeat navy; }
.offsets { background: left 0% top 0% teal; }
.boxes { background: maroon padding-box scroll border-box; }
.parent { background: purple; padding: 2px; }
.child { width: 10px; height: 6px; }
.wide { background: inherit; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="named" class="sw named"></div>
<div data-dragon-id="hex3" class="sw hex3"></div>
<div data-dragon-id="hex8" class="sw hex8"></div>
<div data-dragon-id="rgb" class="sw rgb"></div>
<div data-dragon-id="rgba" class="sw rgba"></div>
<div data-dragon-id="hsl" class="sw hsl"></div>
<div data-dragon-id="clear" class="sw clear"></div>
<div data-dragon-id="current" class="sw current"></div>
<div data-dragon-id="none" class="sw none"></div>
<div data-dragon-id="none-color" class="sw none-color"></div>
<div data-dragon-id="color-none" class="sw color-none"></div>
<div data-dragon-id="spelled" class="sw spelled"></div>
<div data-dragon-id="keywords" class="sw keywords"></div>
<div data-dragon-id="offsets" class="sw offsets"></div>
<div data-dragon-id="boxes" class="sw boxes"></div>
<div data-dragon-id="parent" class="parent"><div data-dragon-id="child" class="child"></div><div data-dragon-id="wide" class="child wide"></div></div>
</div>
</body>
</html>
