<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; color: #1f1d1a; }
.form { display: grid; gap: 18px; width: 320px; padding: 20px; border: 1px solid #d8d2c4; border-radius: 14px; background-color: #fffdf8; }
.field { display: grid; gap: 6px; }
.field textarea { box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #d8d2c4; border-radius: 10px; background-color: #f6f1e7; font: inherit; color: #1f1d1a; resize: none; scrollbar-width: none; }
.tall { min-height: 60px; }
.field textarea.thick { border: 4px solid #8a7f6a; border-radius: 16px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="form" class="form">
<div data-dragon-id="l1" class="field"><div data-dragon-id="c1">NOTE</div><textarea data-dragon-id="t1" readonly="" rows="3" class="tall">XXXX XX XXX</textarea></div>
<div data-dragon-id="l3" class="field"><div data-dragon-id="c3">WIDE</div><textarea data-dragon-id="t3" readonly="" rows="2" class="thick">XX XX</textarea></div>
<div data-dragon-id="l2" class="field"><div data-dragon-id="c2">BODY</div><textarea data-dragon-id="t2" readonly="" rows="2">XX XXX</textarea></div>
</div>
</body>
</html>
