<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 390px; padding: 5px; column-gap: 10px; row-gap: 10px; }
.a { width: 80px; height: 40px; background-color: #2d6cdf; }
.over { border-radius: 60px; }
.uneven { border-radius: 70px 10px 70px 10px; }
.vertical { width: 30px; height: 90px; border-radius: 10px / 80px 20px; }
.sum { border-radius: 50px 50px 0 0 / 30px 30px 0 0; }
.big { border: 6px solid #e84393; border-radius: 100px 0; }
.huge { width: 120px; border-radius: 1000px 200px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="over" class="a over"></div>
<div data-dragon-id="uneven" class="a uneven"></div>
<div data-dragon-id="vertical" class="a vertical"></div>
<div data-dragon-id="sum" class="a sum"></div>
<div data-dragon-id="big" class="a big"></div>
<div data-dragon-id="huge" class="a huge"></div>
</div>
</body>
</html>
