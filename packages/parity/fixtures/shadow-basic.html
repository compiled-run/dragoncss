<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; width: 360px; padding: 20px; column-gap: 64px; row-gap: 64px; background-color: #2b3a4a; }
.b { width: 70px; height: 44px; background-color: #f0c850; }
.drop { box-shadow: 4px 6px 10px rgba(0, 0, 0, 0.5); }
.ring { box-shadow: 0 0 0 5px #e04040; }
.glow { box-shadow: 3px 3px 16px 4px rgba(255, 255, 255, 0.3); }
.negative { box-shadow: 0 12px 10px -6px rgba(0, 0, 0, 0.7); }
.stack { box-shadow: 0 0 0 3px #40c0e0, 6px 6px 0 3px #203050, -4px -4px 12px rgba(250, 220, 90, 0.4); }
.clear { background-color: transparent; box-shadow: 5px 5px 8px rgba(0, 0, 0, 0.6); }
.far { box-shadow: -18px 14px 6px rgba(120, 30, 200, 0.8); }
.tiny { box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.5); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="drop" class="b drop"></div>
<div data-dragon-id="ring" class="b ring"></div>
<div data-dragon-id="glow" class="b glow"></div>
<div data-dragon-id="negative" class="b negative"></div>
<div data-dragon-id="stack" class="b stack"></div>
<div data-dragon-id="clear" class="b clear"></div>
<div data-dragon-id="far" class="b far"></div>
<div data-dragon-id="tiny" class="b tiny"></div>
</div>
</body>
</html>
