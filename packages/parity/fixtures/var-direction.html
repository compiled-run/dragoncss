<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.c { width: 200px; border: 1px solid #000; margin-bottom: 2px; }
.b { height: 4px; width: 50px; margin-inline-start: 10px; padding-inline-end: 6px; background-color: #888; }
.defr { --d: rtl; }
.defl { --d: ltr; }
.use { direction: var(--d); }
.local { --d: rtl; direction: var(--d); }
.localbeat { --d: ltr; direction: var(--d); }
.fb { direction: var(--missing, rtl); }
.fbl { direction: var(--missing, ltr); }
.miss { direction: var(--missing); }
.bad { --bad: 10px; direction: var(--bad); }
.imp { direction: var(--d) !important; }
.imp.imp { direction: ltr; }
.inh { --d: inherit; direction: var(--d); }
.ini { --d: initial; direction: var(--d, rtl); }
.late { direction: rtl; direction: var(--d); }
.lit { direction: var(--d); direction: ltr; }
</style>
</head>
