<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 16px; line-height: 16px; }
.stage { display: flex; flex-direction: column; row-gap: 12px; padding: 8px 16px; background-color: rgb(40, 60, 80); }
.row { display: flex; }
.light { background-color: rgb(245, 240, 225); }
.c { box-sizing: border-box; width: 32px; height: 32px; }
.s16 { width: 16px; }
.s8 { width: 8px; }
.a { background-color: rgb(250, 120, 10); border: 1px solid rgb(120, 40, 0); transform: scale(0.97); opacity: 0.85; }
.b { display: flex; align-items: center; justify-content: center; background-color: rgb(250, 245, 230); border: 1px solid rgb(200, 20, 20); border-radius: 999px; color: rgb(20, 40, 160); font-size: 8px; line-height: 8px; transform: scale(0.97); opacity: 0.85; }
.d { background-color: rgb(90, 200, 230); border: 2px solid rgb(0, 60, 90); transform: translate(2px, 1px) scale(0.9); opacity: 0.5; }
.kid { box-sizing: border-box; width: 16px; height: 16px; background-color: rgb(20, 120, 60); border: 2px solid rgb(250, 250, 250); }
.e { background-color: rgb(40, 200, 120); border: 3px solid rgb(10, 20, 30); transform: translate(3px, 2px); opacity: 0.7; }
.f { background-color: rgb(255, 255, 255); border: 4px solid rgb(0, 0, 0); color: rgb(60, 90, 230); transform: scale(0.8); opacity: 0.9; }
.g { background-color: rgb(120, 0, 160); border: 2px solid rgb(250, 200, 0); border-radius: 8px; transform: scale(0.95); opacity: 0.6; }
.under { box-sizing: border-box; width: 48px; height: 32px; margin-inline-end: -40px; background-color: rgb(200, 60, 60); border-radius: 6px; }
.word { width: 24px; margin-inline-end: -24px; color: rgb(250, 250, 250); }
.s48 { width: 48px; }
.plain { background-color: rgb(0, 140, 200); opacity: 0.6; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="row1" class="row"><div data-dragon-id="ot-a" class="c a"></div><div data-dragon-id="sp1a" class="s16"></div><div data-dragon-id="ot-b" class="c b">X</div><div data-dragon-id="sp1b" class="s8"></div><div data-dragon-id="ot-d" class="c d"><div data-dragon-id="ot-d-kid" class="kid"></div></div></div>
<div data-dragon-id="row2" class="row light"><div data-dragon-id="ot-e" class="c e"></div><div data-dragon-id="sp2a" class="s16"></div><div data-dragon-id="ot-f" class="c f">X</div><div data-dragon-id="sp2b" class="s8"></div><div data-dragon-id="ot-under" class="under"></div><div data-dragon-id="ot-g" class="c g"></div></div>
<div data-dragon-id="row3" class="row light"><div data-dragon-id="sp3a" class="s48"></div><div data-dragon-id="ot-word" class="word">XX</div><div data-dragon-id="ot-h" class="c a"></div><div data-dragon-id="sp3b" class="s8"></div><div data-dragon-id="ot-word2" class="word">XX</div><div data-dragon-id="ot-i" class="c plain"></div></div>
</div>
</body>
</html>
