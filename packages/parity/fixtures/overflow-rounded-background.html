<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: flex-start; width: 384px; padding: 8px; column-gap: 14px; row-gap: 14px; background-color: #eef3f7; }
.sc { overflow: auto; width: 80px; height: 60px; border-radius: 16px; background-color: #fdf2e3; }
.fill { width: 120px; height: 100px; background-color: #e67e22; }
.pad { padding: 12px 14px; border: 1px solid #d8d2c4; border-radius: 10px; }
.uneven { border-style: solid; border-color: #16a085; border-width: 2px 6px 10px 4px; }
.none { border-radius: 20px 6px; }
.fits { border: 3px solid #8e44ad; }
.small { width: 40px; height: 30px; background-color: #e67e22; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="s1" class="sc pad"><div data-dragon-id="f1" class="fill"></div></div>
<div data-dragon-id="s2" class="sc uneven"><div data-dragon-id="f2" class="fill"></div></div>
<div data-dragon-id="s3" class="sc none"><div data-dragon-id="f3" class="fill"></div></div>
<div data-dragon-id="s4" class="sc fits"><div data-dragon-id="f4" class="small"></div></div>
</div>
</body>
</html>
