<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.g { display: grid; position: relative; grid-template-columns: 50px 50px; margin: 20px; padding: 5px; }
.c { height: 10px; }
.f { position: fixed; top: 0; left: 0; width: 10%; height: 10px; }
.e { position: fixed; bottom: 4px; right: 6px; width: 12px; height: 8px; }
.a { position: absolute; top: 2px; left: 3px; width: 7px; height: 7px; }
.h { display: grid; position: relative; grid-template-columns: 40px 40px; margin: 20px; padding: 10px; border: 3px solid; justify-items: center; }
.s { position: fixed; width: 10px; height: 10px; }
.t { position: fixed; grid-column: 2; width: 10px; height: 10px; top: 5px; }
.u { position: fixed; grid-column: 2; width: 6px; height: 6px; justify-self: start; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="g" class="g"><div data-dragon-id="c1" class="c"></div><div data-dragon-id="c2" class="c"></div><div data-dragon-id="f" class="f"></div><div data-dragon-id="e" class="e"></div><div data-dragon-id="a" class="a"></div></div>
<div data-dragon-id="h" class="h"><div data-dragon-id="h1" class="c"></div><div data-dragon-id="s" class="s"></div><div data-dragon-id="t" class="t"></div><div data-dragon-id="u" class="u"></div></div>
</body>
</html>
