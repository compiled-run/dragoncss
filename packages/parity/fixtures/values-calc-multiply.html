<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.a { width: calc(2 * 33.3px); height: 5px; }
.b { width: calc((20% + 3px) * 1.5); height: 5px; }
.c { width: calc(3 * min(10%, 20px)); height: 5px; }
.d { width: calc(1.5 * 7vi); height: 5px; }
.e { width: calc(0.5 * (10vw + 2em) + 1px); height: 5px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="a"></div><div data-dragon-id="b" class="b"></div><div data-dragon-id="c" class="c"></div><div data-dragon-id="d" class="d"></div><div data-dragon-id="e" class="e"></div>
</body>
</html>
