<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.w { width: 200px; line-height: 20px; }
.blk { height: 6px; background-color: rgb(0, 0, 0); }
.ib { display: inline-block; width: 20px; height: 8px; background-color: rgb(255, 0, 0); opacity: 0.5; }
.c { width: 300px; line-height: 20px; margin-bottom: 6px; }
.box { display: inline-block; width: 40px; height: 14px; background-color: rgb(200, 0, 0); }
.flex { display: inline-flex; width: 40px; height: 14px; background-color: rgb(0, 0, 200); }
.op { opacity: 0.5; }
.op0 { opacity: 0; }
.sc { transform: scale(0.5); }
.tr { transform: translate(10px, 3px); }
.nl { margin-left: -25px; }
.nr { margin-right: -25px; }
.pe { pointer-events: none; }
.rtl { direction: rtl; }
.kid { display: block; width: 10px; height: 6px; background-color: rgb(0, 0, 0); }
.clip { width: 30px; overflow: hidden; }
.over { width: 50px; }
.inner { display: inline-block; width: 16px; height: 8px; background-color: rgb(0, 160, 0); opacity: 0.5; margin-left: -6px; }
.pos { position: relative; left: 3px; display: block; width: 8px; height: 4px; background-color: rgb(0, 0, 0); }
.notes { padding: 12px 0; text-align: center; font-size: 16px; line-height: 23px; }
.notes .h { margin: 0 0 16px; font-size: 28px; line-height: 34px; }
.button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 18px; border: 1px solid rgb(204, 204, 204); border-radius: 999px; background-color: rgb(255, 255, 255); text-align: start; }
.pressed { transform: scale(0.97); opacity: 0.85; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="l" class="c rtl">aaaa<span data-dragon-id="l1" class="box op nl"></span>bbbb</div>
<div data-dragon-id="m" class="c clip">aa<span data-dragon-id="m1" class="box op over"></span>bb</div>
<div data-dragon-id="n" class="c">aa<span data-dragon-id="n1" class="box op">x<span data-dragon-id="n2" class="inner"></span>x</span>bb</div>
<div data-dragon-id="o" class="c">aa<span data-dragon-id="o1" class="box op"><span data-dragon-id="o2" class="pos"></span></span>bb</div>
</body>
</html>
