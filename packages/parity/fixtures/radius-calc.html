<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
html { font-size: 16px; }
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 392px; padding: 4px; column-gap: 6px; row-gap: 6px; background-color: #203040; }
.sw { width: 60px; height: 40px; background-color: #e0503c; }
.pill { width: 88px; border-radius: calc(infinity * 1px); background-color: #6fbf4a; }
.pill-tall { width: 30px; height: 70px; border-radius: calc(infinity * 1px); background-color: #3c9ee0; }
.pill-border { width: 90px; border: 3px solid #f2c94c; border-radius: calc(infinity * 1px); }
.half { border-radius: calc(50% - 2px); }
.third { width: 57.5px; height: 33.3px; border-radius: calc(100% / 3 - 2px) calc(25% + 3.5px); background-color: #8a5cd6; }
.var { --r: 6px; border-radius: calc(var(--r) * 2); background-color: #d6a15c; }
.slash { border-radius: calc(25% + 4px) / calc(10px + 10%); background-color: #1c8c7a; }
.em { font-size: 10px; border-top-left-radius: calc(1em + 3px) 50%; border-bottom-right-radius: calc(2em - 1rem + 50%); background-color: #c23b7a; }
.cmp { font-size: 10px; border-radius: max(4px, 1.5em) min(20px, 2em) clamp(2px, 1rem, 30px) max(1px, 2px); }
.cmp2 { font-size: 10px; border-radius: min(12px, 3em) clamp(1em, 4px, 9px) max(0.5rem, 3px) min(1in, 7px); background-color: #3a7a5a; }
.cmp3 { font-size: 10px; border-radius: clamp(3px, 2em, 18px) max(11px, 1em) min(2rem, 14px) clamp(1px, 2.5em, 1rem); background-color: #2f6f9f; }
.neg { border-radius: calc(30% - 20px) calc(-5px) calc(10% - 1px) calc(infinity * -1px); background-color: #50607a; }
.nan { border-top-left-radius: calc(infinity * 0px); border-bottom-right-radius: calc(20px - 50% + 50%); background-color: #8a6a3a; }
.logical { border-start-end-radius: calc(20% + 2px) calc(40% - 4px); border-end-start-radius: calc(infinity * 1px) 6px; background-color: #a0305a; }
.clip { width: 60px; height: 40px; border: 4px solid #1a1a2e; border-radius: calc(50% - 4px); overflow: hidden; background-color: #e8d36a; }
.kid { width: 70px; height: 50px; background-color: #2f3f9f; }
.inherit { border-radius: calc(50% - 6px) / calc(infinity * 1px); padding: 4px; width: 52px; height: 32px; background-color: #9fb4c8; }
.in { border-radius: inherit; width: 40px; height: 24px; background-color: #6a2f2f; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="pill" class="sw pill"></div>
<div data-dragon-id="pill-tall" class="sw pill-tall"></div>
<div data-dragon-id="pill-border" class="sw pill-border"></div>
<div data-dragon-id="half" class="sw half"></div>
<div data-dragon-id="third" class="third"></div>
<div data-dragon-id="var" class="sw var"></div>
<div data-dragon-id="slash" class="sw slash"></div>
<div data-dragon-id="em" class="sw em"></div>
<div data-dragon-id="cmp" class="sw cmp"></div>
<div data-dragon-id="cmp2" class="sw cmp2"></div>
<div data-dragon-id="cmp3" class="sw cmp3"></div>
<div data-dragon-id="neg" class="sw neg"></div>
<div data-dragon-id="nan" class="sw nan"></div>
<div data-dragon-id="logical" class="sw logical"></div>
<div data-dragon-id="clip" class="clip"><div data-dragon-id="kid" class="kid"></div></div>
<div data-dragon-id="inherit" class="inherit"><div data-dragon-id="in" class="in"></div></div>
</div>
</body>
</html>
