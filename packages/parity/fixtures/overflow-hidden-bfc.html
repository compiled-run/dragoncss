.through { margin: 9px 0; }

.minh { overflow: hidden; min-height: 20px; }
.minh > div { height: 5px; margin-bottom: 11px; }
.neg { overflow: hidden; margin-top: -4px; }
.neg > div { margin-top: -3px; height: 6px; }
.txt { overflow: hidden; width: 30px; height: 15px; margin-top: 2px; }
.pct { overflow: hidden; height: 20px; }
.pct > div { height: 50%; }
