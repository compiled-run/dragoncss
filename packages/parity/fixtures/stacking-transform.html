<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { height: 240px; padding-top: 8px; background-color: rgb(235, 235, 245); }
.box { width: 80px; height: 40px; }
.t1 { transform: translateX(16px); background-color: rgb(200, 40, 40); }
.after { margin-top: -30px; background-color: rgb(40, 40, 200); }
.r { position: relative; margin-top: 16px; background-color: rgb(40, 160, 40); }
.w { margin-top: -30px; margin-inline-start: 30px; will-change: opacity; background-color: rgb(220, 180, 0); }
.r2 { position: relative; z-index: 1; margin-top: 16px; background-color: rgb(120, 40, 160); }
.t2 { margin-top: -30px; margin-inline-start: 30px; transform: translateY(8px); background-color: rgb(0, 150, 150); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="t-t1" class="box t1"></div>
<div data-dragon-id="t-after" class="box after"></div>
<div data-dragon-id="t-r" class="box r"></div>
<div data-dragon-id="t-w" class="box w"></div>
<div data-dragon-id="t-r2" class="box r2"></div>
<div data-dragon-id="t-t2" class="box t2"></div>
</div>
</body>
</html>
