<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; line-height: 10px; --a: textfield; }
.box { width: 80px; height: 10px; background-color: rgb(40, 90, 200); }
.no { appearance: none; }
.au { appearance: auto; }
.bt { appearance: button; }
.tf { appearance: textfield; }
.mb { appearance: menulist-button; }
.sf { appearance: searchfield; }
.ta { appearance: textarea; }
.cb { appearance: checkbox; }
.ra { appearance: radio; }
.ml { appearance: menulist; }
.lb { appearance: listbox; }
.me { appearance: meter; }
.pb { appearance: progress-bar; }
.up { APPEARANCE: Menulist-Button; }
.wk { -webkit-appearance: none; }
.wkb { -webkit-appearance: button; }
.late { appearance: button; -webkit-appearance: none; }
.early { -webkit-appearance: textfield; appearance: auto; }
.v { appearance: var(--a); }
.par { appearance: checkbox; width: 120px; height: 20px; background-color: rgb(200, 60, 40); }
.inh { appearance: inherit; width: 60px; height: 10px; }
.ini { appearance: initial; width: 60px; height: 10px; }
.uns { appearance: unset; width: 60px; height: 10px; }
.f { display: flex; width: 200px; height: 20px; appearance: button; }
.fi { width: 60px; height: 20px; -webkit-appearance: none; background-color: rgb(20, 160, 80); }
.rel { position: relative; width: 60px; height: 20px; appearance: auto; }
.abs { position: absolute; left: 4px; top: 2px; width: 20px; height: 10px; appearance: radio; }
.sp { appearance: button; }
</style>
</head>
