<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; column-gap: 34px; row-gap: 34px; padding: 22px; background-color: rgb(30, 34, 44); }
.b { width: 48px; height: 36px; background-color: rgb(240, 200, 80); }
.d1 { outline: 6px double rgb(120, 220, 255); }
.d2 { outline: 9px double rgb(255, 120, 120); outline-offset: 2px; }
.d3 { outline: 7.5px double rgb(255, 210, 0); outline-offset: 1px; }
.d4 { outline: 1px double rgb(255, 255, 255); outline-offset: 3px; }
.d5 { outline: 5px double rgb(200, 160, 255); outline-offset: -2px; }
.d6 { outline: 2px double rgb(160, 255, 160); outline-offset: 2px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="d1" class="b d1"></div>
<div data-dragon-id="d2" class="b d2"></div>
<div data-dragon-id="d3" class="b d3"></div>
<div data-dragon-id="d4" class="b d4"></div>
<div data-dragon-id="d5" class="b d5"></div>
<div data-dragon-id="d6" class="b d6"></div>
</div>
</body>
</html>
