<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
html { font-size: 16px; }
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 388px; padding: 6px; column-gap: 8px; row-gap: 8px; background-color: #f4efe6; }
.c { width: 64px; height: 44px; background-color: #2f6f9f; }
.tl { border-top-left-radius: 18px; }
.tr { border-top-right-radius: 24px 10px; background-color: #b5462f; }
.br { border-bottom-right-radius: 40%; background-color: #5f8f2f; }
.bl { border-bottom-left-radius: 1.25em 0.5rem; font-size: 12px; background-color: #7a3fa0; }
.all { border-top-left-radius: 6px; border-top-right-radius: 12px; border-bottom-right-radius: 18px 9px; border-bottom-left-radius: 50% 25%; }
.wk1 { -webkit-border-radius: 14px; background-color: #c08a1e; }
.wk2 { -webkit-border-radius: 28px 10px; background-color: #1e9c8a; }
.wk4 { -webkit-border-radius: 4px 16px 28px 8px; }
.wkslash { -webkit-border-radius: 20px 6px / 8px 18px; background-color: #a0305a; }
.wk3 { -webkit-border-radius: 5px 15px 25px; background-color: #50607a; }
.std-after { -webkit-border-radius: 30px; border-radius: 4px; }
.wk-after { border-radius: 4px; -webkit-border-radius: 22px 8px; background-color: #8a6a3a; }
.wk-corner { -webkit-border-radius: 20px; border-top-left-radius: 0; border-bottom-right-radius: 6px 30px; background-color: #3a7a5a; }
.bordered { -webkit-border-radius: 16px 8px; border: 5px solid #1a1a2e; background-color: #e8d36a; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="tl" class="c tl"></div>
<div data-dragon-id="tr" class="c tr"></div>
<div data-dragon-id="br" class="c br"></div>
<div data-dragon-id="bl" class="c bl"></div>
<div data-dragon-id="all" class="c all"></div>
<div data-dragon-id="wk1" class="c wk1"></div>
<div data-dragon-id="wk2" class="c wk2"></div>
<div data-dragon-id="wk4" class="c wk4"></div>
<div data-dragon-id="wkslash" class="c wkslash"></div>
<div data-dragon-id="wk3" class="c wk3"></div>
<div data-dragon-id="std-after" class="c std-after"></div>
<div data-dragon-id="wk-after" class="c wk-after"></div>
<div data-dragon-id="wk-corner" class="c wk-corner"></div>
<div data-dragon-id="bordered" class="c bordered"></div>
</div>
</body>
</html>
