<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.t { width: 10px; height: 4px; margin-bottom: 1px; background-color: #ccc; }
@media (orientation: landscape) { .a { width: 20px; background-color: #c00; } }
@media (orientation: portrait) { .b { width: 30px; } }
@media (orientation: portrait) and (max-width: 250px) { .c { width: 40px; } }
@media not (orientation: landscape) { .d { width: 50px; } }
@media (orientation: landscape) and (max-height: 200px) { .e { width: 60px; } }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="t a"></div>
<div data-dragon-id="b" class="t b"></div>
<div data-dragon-id="c" class="t c"></div>
<div data-dragon-id="d" class="t d"></div>
<div data-dragon-id="e" class="t e"></div>
</body>
</html>
