<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 16px; line-height: 16px; }
.stage { display: flex; flex-direction: column; row-gap: 12px; padding: 8px 16px; background-color: rgb(40, 60, 80); }
.row { display: flex; }
.light { background-color: rgb(245, 240, 225); }
.c { box-sizing: border-box; width: 32px; height: 32px; }
.s16 { width: 16px; }
.s8 { width: 8px; }
.kid { width: 16px; height: 16px; background-color: rgb(20, 120, 60); }
.d { background-color: rgb(90, 200, 230); border: 4px solid rgb(30, 30, 30); opacity: 0.7; }
.e { border: 3px solid rgb(250, 200, 0); opacity: 0.4; }
.f { background-color: rgb(250, 245, 230); border: 2px solid rgb(200, 20, 20); opacity: 0.5; }
.h { background-color: rgb(255, 255, 255); border: 6px solid rgb(0, 0, 0); color: rgb(60, 90, 230); opacity: 0.9; }
.i { border-top: 4px solid rgb(10, 20, 30); border-bottom: 8px solid rgb(10, 20, 30); opacity: 0.25; }
.j { background-color: rgb(40, 200, 120); border: 1px solid rgb(250, 250, 250); opacity: 0.62549; }
.ring { box-sizing: border-box; width: 20px; height: 20px; background-color: rgb(250, 120, 10); border: 5px solid rgb(0, 0, 255); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="row1" class="row"><div data-dragon-id="og-d" class="c d"></div><div data-dragon-id="sp1a" class="s16"></div><div data-dragon-id="og-e" class="c e"></div><div data-dragon-id="sp1b" class="s8"></div><div data-dragon-id="og-f" class="c f"><div data-dragon-id="og-f-kid" class="kid"></div></div></div>
<div data-dragon-id="row2" class="row light"><div data-dragon-id="og-h" class="c h">X</div><div data-dragon-id="sp2a" class="s16"></div><div data-dragon-id="og-i" class="c i"></div><div data-dragon-id="sp2b" class="s8"></div><div data-dragon-id="og-j" class="c j"><div data-dragon-id="og-j-ring" class="ring"></div></div></div>
</div>
</body>
</html>
