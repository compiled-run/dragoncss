<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; width: 364px; padding: 18px; column-gap: 34px; row-gap: 34px; background-color: #1d2733; }
.b { width: 76px; height: 50px; background-color: #8fd18a; box-shadow: 2px 6px 12px rgba(0, 0, 0, 0.6); }
.simple { border-radius: 12px; }
.pill { border-radius: 999px; }
.circle { width: 56px; height: 56px; border-radius: 50%; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5); }
.mixed { border-radius: 20px 4px 12px 0 / 10px 4px 20px 0; }
.spread { border-radius: 10px; box-shadow: 0 0 10px 6px rgba(255, 200, 120, 0.35); }
.ring { border-radius: 50%; width: 50px; height: 50px; box-shadow: 0 0 0 0.35rem rgba(255, 255, 255, 0.2), 0 0.3rem 1rem rgba(0, 0, 0, 0.5); }
.bordered { border: 4px solid #33415c; border-radius: 16px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.55); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="simple" class="b simple"></div>
<div data-dragon-id="pill" class="b pill"></div>
<div data-dragon-id="circle" class="b circle"></div>
<div data-dragon-id="mixed" class="b mixed"></div>
<div data-dragon-id="spread" class="b spread"></div>
<div data-dragon-id="ring" class="b ring"></div>
<div data-dragon-id="bordered" class="b bordered"></div>
</div>
</body>
</html>
