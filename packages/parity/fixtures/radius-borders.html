<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 380px; padding: 10px; column-gap: 12px; row-gap: 12px; background-color: #fbfaf4; }
.b { width: 70px; height: 50px; background-color: #f2d04c; border: 4px solid #2a3b8f; border-radius: 16px; }
.thin { border-width: 1px; border-radius: 8px; }
.thick { border-width: 14px; border-radius: 10px; }
.sides { border-width: 3px 8px 5px 12px; border-radius: 22px 6px; }
.colors { border-width: 6px; border-color: #c0392b #27ae60 #2980b9 #8e44ad; border-radius: 18px; }
.partial { border-width: 0 6px; border-radius: 20px; }
.hidden { border-top-style: none; border-bottom-style: hidden; border-radius: 50%; }
.circle { width: 50px; height: 50px; border-width: 5px; border-radius: 50%; background-color: #ffffff; }
.alpha { border-color: rgba(20, 40, 160, 0.5); border-width: 8px; border-radius: 24px 24px 0 0; }
.ellipse { border-width: 5px 10px; border-radius: 40px / 20px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="base" class="b"></div>
<div data-dragon-id="thin" class="b thin"></div>
<div data-dragon-id="thick" class="b thick"></div>
<div data-dragon-id="sides" class="b sides"></div>
<div data-dragon-id="colors" class="b colors"></div>
<div data-dragon-id="partial" class="b partial"></div>
<div data-dragon-id="hidden" class="b hidden"></div>
<div data-dragon-id="circle" class="b circle"></div>
<div data-dragon-id="alpha" class="b alpha"></div>
<div data-dragon-id="ellipse" class="b ellipse"></div>
</div>
</body>
</html>
