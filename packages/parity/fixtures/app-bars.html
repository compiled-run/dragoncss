<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
/* An app screen's bars (examples/real-pages): a sticky header, one of them a flex row, over a list, and a fixed tab bar. */
* { box-sizing: border-box; }
body { margin: 0; font-family: Ahem; font-size: 10px; }
.header { position: sticky; top: 0; z-index: 2; padding: 8px 16px 6px; background-color: #fff; border-bottom: 1px solid #ccc; }
.header h1 { margin: 0 0 4px; font-size: 20px; }
.row { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 4px 10px; background-color: #eef; border-bottom: 2px solid #99c; }
.mark { width: 20px; height: 20px; background-color: #36c; }
.item { height: 30px; margin: 4px 16px; background-color: #ddd; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; padding: 6px 0 9px; background-color: #f8f8f8; border-top: 1px solid #aaa; }
.tab { width: 24px; height: 24px; background-color: #888; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="header" class="header"><h1 data-dragon-id="title">Feed</h1></div>
<div data-dragon-id="i1" class="item"></div>
<div data-dragon-id="section">
<div data-dragon-id="row" class="row"><div data-dragon-id="m1" class="mark"></div>Hi<div data-dragon-id="m2" class="mark"></div></div>
<div data-dragon-id="i2" class="item"></div>
<div data-dragon-id="i3" class="item"></div>
</div>
<div data-dragon-id="tabs" class="tabs"><div data-dragon-id="t1" class="tab"></div><div data-dragon-id="t2" class="tab"></div><div data-dragon-id="t3" class="tab"></div></div>
</body>
</html>
