.sq { width: 60px; height: 60px; background-color: #999; }
.a { position: absolute; box-sizing: border-box; background-color: #c00; }

.label { top: 10%; left: 10%; width: 45%; height: 40px; border: 4px solid #0b0d12; overflow: hidden; padding: 2px; }
.label > div { width: 200px; height: 60px; background-color: #0c0; }
.shine { top: 0; left: 0; width: 100%; height: 100%; padding: 0; border: 5px solid #333; }
.m1 { top: 50%; left: 75%; width: 10%; height: 6px; }
.m2 { top: 2px; left: 3px; width: 35%; height: 8px; }
</style>
</head>

<div data-dragon-id="r2" class="rec"><div data-dragon-id="s2" class="sq"></div><div data-dragon-id="h2" class="a shine"></div><div data-dragon-id="m1" class="a m1"></div><div data-dragon-id="m2" class="a m2"></div></div>
</body>
</html>
