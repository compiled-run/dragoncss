<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 300px; column-gap: 16px; row-gap: 16px; padding: 16px; background-color: #f4efe2; }
.box { width: 52px; height: 42px; border: 5px solid #141e28; background-color: #1f6feb; }
.c1 { -webkit-background-clip: padding-box; }
.c2 { -webkit-background-clip: content-box; background-color: #cf222e; }
.c3 { -webkit-background-clip: content-box; background-clip: border-box; background-color: #1a7f37; }
.c4 { background-clip: border-box; -webkit-background-clip: content-box; background-color: #8250df; }
.c5 { background: #bf8700 content-box; -webkit-background-clip: padding-box; }
.c6 { -webkit-background-clip: padding-box !important; background-clip: content-box; background-color: #0a3069; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row"><div data-dragon-id="c1" class="box c1"></div><div data-dragon-id="c2" class="box c2"></div><div data-dragon-id="c3" class="box c3"></div><div data-dragon-id="c4" class="box c4"></div><div data-dragon-id="c5" class="box c5"></div><div data-dragon-id="c6" class="box c6"></div></div>
</body>
</html>
