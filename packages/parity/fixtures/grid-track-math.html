body { margin: 0; font-family: Ahem; font-size: 10px; }
.g { display: grid; grid-auto-rows: 6px; margin-bottom: 2px; }
.g > div { min-height: 6px; }
.fl { display: flex; align-items: flex-start; margin-bottom: 2px; }
.s { width: 10px; height: 6px; }
.a { width: 170px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 50px), 1fr)); }
.b { width: 120px; grid-template-columns: calc(50% - 10px) 1fr; }
.c { width: 150px; grid-template-columns: clamp(30px, 30%, 60px) 1fr clamp(10px, 5vw, 2rem); }
.d { width: 200px; grid-template-columns: repeat(auto-fill, minmax(calc(2rem + 1vw), 1fr)); column-gap: 4px; }
.e { width: 300px; grid-template-columns: 10vw 1fr 2vh; }
.f { width: 200px; grid-template-columns: fit-content(calc(10% + 5px)) fit-content(min(30%, 100px)) 1fr; }
.h { grid-auto-rows: max(10px, 2vh); grid-template-columns: repeat(2, 30px); }
.k { width: 160px; grid-template-columns: minmax(calc(10px + 10%), max(20%, 30px)) 1fr minmax(min(5%, 4px), calc(25% - 1px)); }
.m { width: 140px; height: 60px; grid-template: calc(5px + 10%) 1fr / min(40%, 60px) 1fr; }
.p { width: 100px; grid-template-columns: calc(10px - 20%) max(-5px, 0px) min(-10px, 20%) 1fr; }
.q { width: 130px; font-size: 13px; grid-template-columns: calc(1em + 10%) max(2em, 15%) 1fr; }
.r { width: 110px; grid-template-columns: repeat(2, calc(25% - 5px)) 1fr; column-gap: 10px; }
.s { width: 120px; grid-template-columns: minmax(calc(10% + 5px), calc(10% + 5px)) minmax(calc(10% + 5px), calc(5px + 10%)) 1fr; }
.t { width: 100px; grid-template-columns: 1fr 1fr; grid-template-rows: calc(10px + 50%) min(20%, 8px) auto; }
.u { width: 100px; height: 80px; grid-template-columns: 1fr; grid-template-rows: calc(10px + 25%) min(20%, 30px) clamp(5px, 10%, 1rem) 1fr; }
.v { width: 150px; grid-auto-columns: calc(20% + 3px); grid-auto-flow: column; grid-auto-rows: 6px; }
.n { grid-template-columns: calc(20px + 10%) min(50%, 30px) max(10%, 12px); }
.w { grid-template-columns: repeat(auto-fill, minmax(min(100%, 20px), 1fr)); min-width: 50px; }
.t { grid-auto-rows: auto; }
.f { grid-auto-rows: auto; }
