<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.wrap { width: 300px; background-color: #eee; }
input { appearance: none; display: block; margin: 0 0 4px; background-color: #ddd; }
input::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; background-color: #c00; }
input::-webkit-slider-runnable-track { background-color: #036; }
.w200 { width: 200px; }
.pad { padding: 2px 5px; border: 2px solid #000; }
.bb { box-sizing: border-box; width: 180px; padding: 2px 5px; border: 4px solid #000; }
.tall::-webkit-slider-thumb { width: 6px; height: 24px; }
.wide::-webkit-slider-thumb { width: 30px; height: 6px; }
.t4::-webkit-slider-runnable-track { height: 4px; }
.t20::-webkit-slider-runnable-track { height: 20px; padding: 0 5px; }
.tb::-webkit-slider-runnable-track { height: 4px; border: 2px solid #0a0; padding: 0 3px; }
.ml { margin-left: auto; }
.bare::-webkit-slider-thumb { width: auto; height: auto; }
.bare::-webkit-slider-runnable-track { height: 6px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="wrap" class="wrap">
<input data-dragon-id="r1" type="range">
<input data-dragon-id="r2" type="range" class="w200" value="0">
<input data-dragon-id="r3" type="range" class="w200" value="100">
<input data-dragon-id="r4" type="range" class="w200 pad" value="37">
<input data-dragon-id="r5" type="range" class="bb tall t4" min="10" max="20" value="13">
<input data-dragon-id="r6" type="range" class="w200 wide t20" min="50" max="10">
<input data-dragon-id="r7" type="range" class="w200 tb" step="7" value="50">
<input data-dragon-id="r8" type="range" class="w200" step="any" value="33.3">
<input data-dragon-id="r9" type="range" class="w200" value="abc">
<input data-dragon-id="r10" type="range" class="w200" min="-5" max="5" value="1">
<input data-dragon-id="r11" type="range" class="w200 tall" min="0" max="1" step="0.1" value="0.15">
<input data-dragon-id="r12" type="range" class="w200" min="0" max="0" value="0">
<input data-dragon-id="r13" type="range" class="ml pad" value="75">
<input data-dragon-id="r14" type="RANGE" class="w200 bare" value="20">
</div>
</body>
</html>
