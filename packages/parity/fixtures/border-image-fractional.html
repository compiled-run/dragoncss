<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 400px; column-gap: 6px; row-gap: 6px; padding: 4px; }
.b { width: 44px; height: 30px; border: 8px solid #102030; background: #f0e8d8; }
.zero { border-image: linear-gradient(red, blue) 0.4; }
.zerofill { border-image: linear-gradient(red, blue) 0.4 fill; }
.auto { border-image: linear-gradient(to right, #2f4f66, #a57c5b) 2.6 / auto; }
.half { border-image: linear-gradient(110deg, #336699, #996633) 2.5 fill / auto; }
.mixed { border-image: linear-gradient(to bottom, rgb(40, 80, 160), rgb(200, 120, 30) 40%, rgb(20, 200, 90)) 3.4 12.6 7.5 1.49 fill; }
.near { border-image: linear-gradient(-30deg, #343b47, #0b0d12 30% 60%, #405060) 9.5 / 1; }
.pct { border-image: linear-gradient(to left, #123456, #abcdef) 10.5% 20.4% fill; }
.ring { border-image: linear-gradient(0.3turn, #2f4f66, #a57c5b) 6.6 / 4px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="zero" class="b zero"></div>
<div data-dragon-id="zerofill" class="b zerofill"></div>
<div data-dragon-id="auto" class="b auto"></div>
<div data-dragon-id="half" class="b half"></div>
<div data-dragon-id="mixed" class="b mixed"></div>
<div data-dragon-id="near" class="b near"></div>
<div data-dragon-id="pct" class="b pct"></div>
<div data-dragon-id="ring" class="b ring"></div>
</div>
</body>
</html>
