<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 16px; line-height: 16px; }
.stage { display: flex; flex-direction: column; row-gap: 12px; padding: 8px 16px; background-color: rgb(40, 60, 80); }
.row { display: flex; }
.light { background-color: rgb(245, 240, 225); }
.c { width: 32px; height: 32px; }
.s16 { width: 16px; }
.s8 { width: 8px; }
.a { background-color: rgb(240, 240, 240); color: rgb(200, 30, 90); filter: grayscale(1); }
.b { color: rgb(250, 250, 250); filter: sepia(0.6); }
.d { background-color: rgb(90, 200, 230); color: rgb(20, 20, 20); filter: invert(0.3); }
.e { background-color: rgb(30, 30, 30); color: rgb(250, 220, 60); filter: brightness(1.4); }
.f { color: rgb(0, 0, 0); filter: contrast(45%); }
.g { background-color: rgb(200, 30, 90); color: rgb(255, 255, 255); filter: saturate(2.5); }
.h { background-color: rgb(250, 250, 250); color: rgb(60, 90, 230); filter: opacity(0.6); }
.i { background-color: rgb(10, 10, 10); color: rgb(250, 250, 250); filter: grayscale(50%) brightness(1.2); opacity: 0.7; }
.j { background-color: rgb(120, 0, 200); color: rgb(0, 255, 120); -webkit-filter: invert() contrast(1.5) sepia(0.2); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="row1" class="row"><div data-dragon-id="fm-a" class="c a">X</div><div data-dragon-id="sp1a" class="s16"></div><div data-dragon-id="fm-b" class="c b">X</div><div data-dragon-id="sp1b" class="s8"></div><div data-dragon-id="fm-d" class="c d">XX</div></div>
<div data-dragon-id="row2" class="row light"><div data-dragon-id="fm-e" class="c e">X</div><div data-dragon-id="sp2a" class="s16"></div><div data-dragon-id="fm-f" class="c f">XX X</div><div data-dragon-id="sp2b" class="s8"></div><div data-dragon-id="fm-g" class="c g">X</div></div>
<div data-dragon-id="row3" class="row"><div data-dragon-id="fm-h" class="c h">X</div><div data-dragon-id="sp3a" class="s16"></div><div data-dragon-id="fm-i" class="c i">X</div><div data-dragon-id="sp3b" class="s8"></div><div data-dragon-id="fm-j" class="c j">X X</div></div>
</div>
</body>
</html>
