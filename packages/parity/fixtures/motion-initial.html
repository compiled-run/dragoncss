<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; color: rgb(20, 40, 160); }
.box { width: 60px; height: 30px; margin: 4px; padding: 3px; background-color: #e8d36a; border: 2px solid #1a1a2e; }
.s { offset: none; }
.S { OFFSET: NONE; }
.l { offset-path: none; offset-distance: 0; offset-position: normal; offset-anchor: auto; offset-rotate: auto; }
.u { OFFSET-PATH: None; OFFSET-DISTANCE: 0PX; OFFSET-POSITION: NORMAL; OFFSET-ANCHOR: Auto; OFFSET-ROTATE: AUTO; }
.o { offset-distance: 0px; offset: none; offset-rotate: auto; }
.v { --p: none; --d: 0px; offset-path: var(--p); offset-distance: var(--d); }
.k { offset: initial; offset-anchor: unset; offset-rotate: revert; offset-distance: initial; }
.i { offset-path: inherit; offset-distance: inherit; offset-position: inherit; offset-anchor: inherit; offset-rotate: inherit; color: rgb(20, 120, 40); }
.abs { position: absolute; top: 3px; inset-inline-end: 4px; width: 20px; height: 12px; background-color: rgb(200, 0, 90); offset: none; }
.row { display: flex; width: 200px; position: relative; offset-path: none; offset-anchor: auto; }
</style>
</head>
