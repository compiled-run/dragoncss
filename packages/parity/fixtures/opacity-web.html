<!DOCTYPE html>

<head>

body { margin: 0; font-family: Ahem; font-size: 16px; line-height: 16px; }

.s8 { width: 8px; }

.parent { background-color: rgb(250, 245, 230); opacity: 0.5; }

.text { background-color: rgb(240, 240, 240); color: rgb(200, 30, 90); opacity: 0.5; }
.border { box-sizing: border-box; background-color: rgb(90, 200, 230); border: 4px solid rgb(30, 30, 30); opacity: 0.7; }

</head>

</div>
