<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 16px; line-height: 16px; }
.stage { display: flex; flex-direction: column; row-gap: 12px; padding: 8px 16px; background-color: rgb(40, 60, 80); }
.row { display: flex; }
.light { background-color: rgb(245, 240, 225); }
.c { box-sizing: border-box; width: 32px; height: 32px; }
.s16 { width: 16px; }
.s8 { width: 8px; }
.a { background-color: rgb(90, 200, 230); border-radius: 10px; opacity: 0.6; }
.b { display: flex; align-items: center; justify-content: center; background-color: rgb(250, 245, 230); border: 1px solid rgb(200, 20, 20); border-radius: 999px; color: rgb(20, 40, 160); font-size: 8px; line-height: 8px; opacity: 0.85; }
.d { background-color: rgb(250, 120, 10); opacity: 0.5; }
.kid { box-sizing: border-box; width: 24px; height: 24px; background-color: rgb(20, 120, 60); border: 3px solid rgb(250, 250, 250); border-radius: 8px; }
.e { border: 3px solid rgb(10, 20, 200); border-radius: 9px; opacity: 0.4; }
.f { background-color: rgb(255, 255, 255); border: 4px solid rgb(0, 0, 0); border-radius: 12px / 6px; color: rgb(60, 90, 230); opacity: 0.9; }
.g { background-color: rgb(40, 200, 120); border-radius: 50%; opacity: 0.7; }
.pill { box-sizing: border-box; width: 20px; height: 12px; background-color: rgb(120, 0, 160); border-radius: 6px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="row1" class="row"><div data-dragon-id="or-a" class="c a"></div><div data-dragon-id="sp1a" class="s16"></div><div data-dragon-id="or-b" class="c b">X</div><div data-dragon-id="sp1b" class="s8"></div><div data-dragon-id="or-d" class="c d"><div data-dragon-id="or-d-kid" class="kid"></div></div></div>
<div data-dragon-id="row2" class="row light"><div data-dragon-id="or-e" class="c e"></div><div data-dragon-id="sp2a" class="s16"></div><div data-dragon-id="or-f" class="c f">X</div><div data-dragon-id="sp2b" class="s8"></div><div data-dragon-id="or-g" class="c g"><div data-dragon-id="or-g-pill" class="pill"></div></div></div>
</div>
</body>
</html>
