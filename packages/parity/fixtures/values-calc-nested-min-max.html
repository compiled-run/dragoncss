<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.a { width: min(max(10%, 30px), calc(50% - 1em)); height: 5px; }
.b { width: max(min(20vw, 30%), 1in); height: 5px; }
.c { width: calc(min(10%, 50px) + max(5vw, 3em)); height: 5px; }
.d { width: min(calc(10px + 5%), max(2cm, 10%)); height: 5px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="a" class="a"></div><div data-dragon-id="b" class="b"></div><div data-dragon-id="c" class="c"></div><div data-dragon-id="d" class="d"></div>
</body>
</html>
