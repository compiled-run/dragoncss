<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
html { font-size: 16px; }
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 392px; padding: 4px; column-gap: 6px; row-gap: 6px; background-color: #203040; }
.sw { width: 60px; height: 40px; background-color: #e0503c; }
.px { border-radius: 10px; }
.pct { border-radius: 50%; }
.circle { width: 44px; height: 44px; border-radius: 50%; background-color: #3c9ee0; }
.pill { border-radius: 999px; background-color: #6fbf4a; }
.ellipse { border-radius: 30px / 12px; }
.corners { border-radius: 4px 12px 20px 0; }
.eight { border-radius: 10px 20px 5px 18px / 6px 14px 19px 3px; background-color: #8a5cd6; }
.rem { border-radius: 0.35rem; }
.em { font-size: 20px; border-radius: 0.5em 1em; }
.mixed { border-radius: 25% 10px / 10px 30%; background-color: #d6a15c; }
.one { border-top-left-radius: 20px 8px; border-bottom-right-radius: 1rem 24px; background-color: #1c8c7a; }
.frac { width: 57.5px; height: 33.3px; border-radius: 7.75px; }
.tall { width: 24px; height: 60px; border-radius: 12px / 30%; background-color: #c23b7a; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="px" class="sw px"></div>
<div data-dragon-id="pct" class="sw pct"></div>
<div data-dragon-id="circle" class="circle"></div>
<div data-dragon-id="pill" class="sw pill"></div>
<div data-dragon-id="ellipse" class="sw ellipse"></div>
<div data-dragon-id="corners" class="sw corners"></div>
<div data-dragon-id="eight" class="sw eight"></div>
<div data-dragon-id="rem" class="sw rem"></div>
<div data-dragon-id="em" class="sw em"></div>
<div data-dragon-id="mixed" class="sw mixed"></div>
<div data-dragon-id="one" class="sw one"></div>
<div data-dragon-id="frac" class="sw frac"></div>
<div data-dragon-id="tall" class="tall"></div>
</div>
</body>
</html>
