<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.cb { position: relative; width: 300px; height: 200px; padding: 7px; border: 3px solid #000; }
.a { position: absolute; top: calc(10% + 5px); left: calc(25% - 3px); width: 40px; height: 30px; }
.b { position: absolute; right: calc(10px + 5%); bottom: calc(1em + 2%); width: calc(20% + 1px); height: calc(15% - 2px); }
.c { position: absolute; top: calc(50% - 1em); left: calc(33.3% + 0.5px); right: calc(10% - 3px); bottom: calc(5% + 4px); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="cb" class="cb"><div data-dragon-id="a" class="a"></div><div data-dragon-id="b" class="b"></div><div data-dragon-id="c" class="c"></div></div>
</body>
</html>
