<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; width: 276px; padding: 20px; column-gap: 6px; row-gap: 6px; background-color: #e9e4da; }
.t { width: 88px; height: 56px; background-color: #3f7fbf; }
.round { border-radius: 16px; background-color: #c0504d; }
.half { background-color: rgba(30, 140, 60, 0.5); }
.nest { background-color: #f2c14e; padding: 8px; }
.inner { height: 28px; background-color: #6b4c9a; border-radius: 8px; }
.s { width: 88px; height: 56px; background-color: #ffffff; box-shadow: 0 0 24px 6px rgba(0, 0, 0, 0.5), 6px 8px 10px rgba(20, 40, 160, 0.35); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="t1" class="t"></div>
<div data-dragon-id="t2" class="t round"></div>
<div data-dragon-id="t3" class="t half"></div>
<div data-dragon-id="t4" class="t nest"><div data-dragon-id="inner" class="inner"></div></div>
<div data-dragon-id="s" class="s"></div>
</div>
</body>
</html>
