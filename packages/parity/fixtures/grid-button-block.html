.two { grid-template-columns: 1fr 1fr; grid-template-rows: auto; column-gap: 8px; }
.filler { height: 70px; background-color: #fc8; }
.js { justify-self: stretch; }
.as { align-self: stretch; }
.st { justify-self: start; }
.ce { justify-self: center; align-self: center; }
.en { justify-self: end; align-self: end; }
.w120 { width: 120px; }
.h30 { height: 30px; }
.pad { padding: 5px 7px; border-width: 3px; }
.inner { width: 20px; height: 8px; background-color: #f80; }
.left { text-align: left; }
.mauto { margin: auto; }
</style>
</head>
