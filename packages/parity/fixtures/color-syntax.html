<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; color: rebeccapurple; }
.row { display: flex; flex-wrap: wrap; width: 400px; column-gap: 3px; row-gap: 2px; }
.sw { width: 30px; height: 12px; }
.named { color: DarkOliveGreen; background-color: tomato; }
.hex3 { color: #abc; background-color: #f0a; }
.hex4 { color: #abcd; background-color: #0f08; }
.hex6 { color: #a1b2c3; background-color: #0b1c2d; }
.hex8 { color: #a1b2c37f; background-color: #102030e6; }
.rgb-legacy { color: rgb(10.4, 20.6, 30.5); background-color: rgb(30%, 50.5%, 99.9%); }
.rgb-modern { color: rgb(300 -5 20); background-color: rgb(none 2 3 / 12.5%); }
.rgba-legacy { color: rgba(1, 2, 3, 0.3); background-color: rgba(10%, 20%, 30%, 0.998); }
.rgba-modern { color: rgba(10.5 20.49 255.9 / 0.333); background-color: rgba(0 0 0 / 0.001); }
.hsl-deg { color: hsl(2 100% 50%); background-color: hsl(10deg 100% 50%); }
.hsl-legacy { color: hsl(6, 50%, 50%); background-color: hsl(14, 50%, 50%); }
.hsl-turn { color: hsl(0.5turn 100% 50%); background-color: hsl(1rad 40% 60%); }
.hsl-grad { color: hsl(100grad 30% 70%); background-color: hsl(-30 100% 50% / 40%); }
.hsla-legacy { color: hsla(300, 100%, 25%, 0.5); background-color: hsla(210, 20%, 97.3%, 1); }
.hsla-modern { color: hsla(17deg 83.3% 41.7%); background-color: hsla(none 50 50 / 0.25); }
.clear { background-color: transparent; }
.current { background-color: currentcolor; color: coral; }
.inherit-parent { color: #123456; }
.reset { color: inherit; background-color: initial; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="named" class="sw named"></div>
<div data-dragon-id="hex3" class="sw hex3"></div>
<div data-dragon-id="hex4" class="sw hex4"></div>
<div data-dragon-id="hex6" class="sw hex6"></div>
<div data-dragon-id="hex8" class="sw hex8"></div>
<div data-dragon-id="rgb-legacy" class="sw rgb-legacy"></div>
<div data-dragon-id="rgb-modern" class="sw rgb-modern"></div>
<div data-dragon-id="rgba-legacy" class="sw rgba-legacy"></div>
<div data-dragon-id="rgba-modern" class="sw rgba-modern"></div>
<div data-dragon-id="hsl-deg" class="sw hsl-deg"></div>
<div data-dragon-id="hsl-legacy" class="sw hsl-legacy"></div>
<div data-dragon-id="hsl-turn" class="sw hsl-turn"></div>
<div data-dragon-id="hsl-grad" class="sw hsl-grad"></div>
<div data-dragon-id="hsla-legacy" class="sw hsla-legacy"></div>
<div data-dragon-id="hsla-modern" class="sw hsla-modern"></div>
<div data-dragon-id="clear" class="sw clear"></div>
<div data-dragon-id="current" class="sw current"></div>
<div data-dragon-id="inherit-parent" class="sw inherit-parent"><div data-dragon-id="reset" class="sw reset"></div></div>
</div>
</body>
</html>
