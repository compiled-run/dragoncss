<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { height: 220px; padding-top: 8px; background-color: rgb(245, 240, 230); }
.row { position: relative; display: flex; height: 64px; padding: 0 16px; }
.g { position: relative; width: 32px; height: 32px; will-change: opacity; background-color: rgb(0, 150, 200); }
.z { position: absolute; inset-inline-start: 4px; top: 4px; width: 24px; height: 24px; z-index: 10; background-color: rgb(200, 0, 90); }
.w { position: absolute; inset-inline-start: 26px; top: 14px; width: 64px; height: 36px; z-index: 1; background-color: rgb(250, 190, 60); }
.p0 { position: relative; z-index: 0; width: 80px; height: 40px; background-color: rgb(150, 150, 150); }
.fl { width: 40px; height: 40px; background-color: rgb(0, 128, 128); }
.neg { position: absolute; inset-inline-start: 10px; top: 10px; width: 40px; height: 20px; z-index: -1; background-color: rgb(255, 140, 0); }
.q { position: relative; width: 120px; height: 50px; background-color: rgb(200, 200, 255); }
.k { width: 60px; height: 20px; background-color: rgb(60, 60, 120); }
.m { position: relative; top: 16px; width: 40px; height: 20px; background-color: rgb(250, 250, 120); }
.after { width: 60px; height: 30px; background-color: rgb(0, 90, 0); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="row1" class="row"><div data-dragon-id="x-g" class="g"><div data-dragon-id="x-z" class="z"></div></div><div data-dragon-id="x-w" class="w"></div></div>
<div data-dragon-id="row2" class="row"><div data-dragon-id="x-p0" class="p0"><div data-dragon-id="x-fl" class="fl"></div><div data-dragon-id="x-neg" class="neg"></div></div></div>
<div data-dragon-id="row3" class="row"><div data-dragon-id="x-q" class="q"><div data-dragon-id="x-k" class="k"><div data-dragon-id="x-m" class="m"></div></div><div data-dragon-id="x-after" class="after"></div></div></div>
</div>
</body>
</html>
