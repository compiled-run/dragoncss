<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
@layer base, theme, theme.dark, top;
.box { height: 4px; width: 20px; background-color: #0000aa; }
@layer top {
  .r1 { margin-left: revert-layer; }
  .r2 { margin-left: revert-layer; }
  .r5 { margin-left: revert-layer; }
  .r6 { display: revert-layer; }
  .r8 { margin-left: 30px; }
  @media (min-width: 100px) { .r8 { margin-left: revert-layer; } }
  .r9 { margin-left: revert-layer; }
  .r10 { margin-left: 2px; }
  .r12 { margin: revert-layer; }
}
@layer base {
  .r1 { margin-left: 5px; }
  .r2 { margin-left: 6px; }
  .r3 { margin-top: revert-layer; }
  .r4.r4.r4 { margin-left: 3px; }
  .r6 { display: flex; }
  .r12 { margin: 1px 2px 3px 4px; }
}
@layer theme {
  .r1 { margin-left: 15px; }
  .r4 { margin-left: 12px; }
  .r5.r5 { margin-left: 9px; }
  .r5 { margin-left: 4px; }
  .r8 { margin-left: 7px; }
  .r11 { margin-left: revert-layer; }
}
@layer theme.dark {
  .r2 { margin-left: revert-layer; }
  .r11 { margin-left: 16px; }
}
@media (min-width: 100px) { @layer base { .r9 { margin-left: 11px; } } }
.r4 { margin-left: revert-layer; }
@layer { .r10 { margin-left: revert-layer; } }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="r1" class="box r1"></div>
<div data-dragon-id="r2" class="box r2"></div>
<p data-dragon-id="r3" class="box r3"></p>
<div data-dragon-id="r4" class="box r4"></div>
<div data-dragon-id="r5" class="box r5"></div>
<div data-dragon-id="r6" class="box r6"></div>
<div data-dragon-id="r8" class="box r8"></div>
<div data-dragon-id="r9" class="box r9"></div>
<div data-dragon-id="r10" class="box r10"></div>
<div data-dragon-id="r11" class="box r11"></div>
<div data-dragon-id="r12" class="box r12"></div>
</body>
</html>
