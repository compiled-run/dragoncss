<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Ahem; font-size: 16px; }
input { display: block; font: inherit; color: #000; margin: 0 0 4px; }
.wrap { width: 300px; background-color: #eee; }
.pill { width: 100%; padding: 12px 16px; border: 1px solid #c9c2ad; border-radius: 999px; background-color: #fffdf7; }
.plain { appearance: none; border: 2px solid #036; padding: 1px 2px; background-color: #fff; }
.f10 { font-size: 10px; }
.f12 { font-size: 12.4px; }
.f13 { font-size: 13.333px; }
.f17 { font-size: 17.5px; }
.f40 { font-size: 40px; }
.f5 { font-size: 5px; }
.z { zoom: 1.5; }
.tf { appearance: textfield; }
.sf { appearance: searchfield; }
.end { text-align: start; }
.ph::placeholder { color: #c00; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="wrap" class="wrap">
<input data-dragon-id="s1" readonly="" type="search" class="pill ph" placeholder="PP PP">
<input data-dragon-id="s2" readonly="" type="search" class="pill" value="XX XX">
<input data-dragon-id="s3" readonly="" type="search" class="pill" value="XXXXXXXXXXXXXXXXXX">
<input data-dragon-id="t3" readonly="" type="text" class="pill" value="XXXXXXXXXXXXXXXXXX">
<input data-dragon-id="s4" readonly="" type="search" class="plain" value="XX">
<input data-dragon-id="t4" readonly="" type="text" class="plain" value="XX">
<input data-dragon-id="s5" readonly="" type="search" class="plain f10" placeholder="PP">
<input data-dragon-id="s6" readonly="" type="search" class="plain f12" value="XX">
<input data-dragon-id="s7" readonly="" type="search" class="plain f13 tf" value="XX">
<input data-dragon-id="s8" readonly="" type="search" class="plain f17 sf end" value="XX">
<input data-dragon-id="s9" readonly="" type="search" class="plain f40" value="XX">
<input data-dragon-id="s10" readonly="" type="search" class="plain f5" value="XX">
<input data-dragon-id="s12" readonly="" type="search" class="plain z" value="XX">
<input data-dragon-id="s11" readonly="" type="search" class="plain" size="4" value="XXXXXX">
</div>
</body>
</html>
