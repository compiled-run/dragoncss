<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.box { width: 120px; height: 36px; margin: 6px; background: rgb(200, 40, 60); }
.lin { mask-image: linear-gradient(black, transparent); }
.rad { -webkit-mask-image: radial-gradient(circle at 30% 40%, black 10px, rgba(0, 0, 0, 0.4) 30px, transparent); background: #3a7; border: 3px solid #123; padding: 4px; }
.ang { mask: repeating-linear-gradient(35deg, black 0 6px, transparent 9px 12px); background: #246; }
.kid { width: 50px; height: 14px; margin: 4px; background: #08f; }
.side { width: 120.5px; margin-left: 6.3px; height: 30.4px; mask-image: linear-gradient(to left, black 20%, rgba(0, 0, 0, 0.5) 50%, transparent); background: #fc3; }
.txt { mask-image: linear-gradient(to top, black, transparent); background: none; color: #000; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="lin" class="box lin"></div>
<div data-dragon-id="rad" class="box rad"></div>
<div data-dragon-id="ang" class="box ang"><div data-dragon-id="kid" class="kid"></div></div>
<div data-dragon-id="side" class="box side"></div>
<div data-dragon-id="txt" class="box txt">XX XXX XX</div>
</body>
</html>
