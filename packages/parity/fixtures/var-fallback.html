<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; --set: 7px; --empty:; --reset: initial; --layer: revert-layer; }
.row { display: flex; flex-wrap: wrap; width: 300px; column-gap: var(--missing-gap, 2px); row-gap: var(--set, 9px); }
.sw { width: 20px; height: 10px; }
.a { width: var(--none, 24px); background-color: var(--c, rgba(0, 0, 255, 0.5)); }
.b { height: var(--h, var(--none2, 12px)); background-color: var(--none3, var(--none4, #abc)); }
.c { margin-left: 3px var(--empty); background-color: var(--empty, red); color: var(--empty, red); }
.d { background-color: var(--reset, green); width: var(--reset, 16px); }
.e { width: var(--set,); background-color: var(--layer, pink); }
.f { --outer: var(--inner, 14px); width: var(--outer); background-color: var(--inner, var(--outer-color, #102030)); }
.g { --inner: 5px; width: var(--inner, 30px); }
.h { color: #445566; }
.h .i { border: 2px solid var(--missing-color, currentcolor); height: 6px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="a" class="sw a"></div>
<div data-dragon-id="b" class="sw b"></div>
<div data-dragon-id="c" class="sw c"></div>
<div data-dragon-id="d" class="sw d"></div>
<div data-dragon-id="e" class="sw e"></div>
<div data-dragon-id="f" class="sw f"></div>
<div data-dragon-id="g" class="sw g"></div>
<div data-dragon-id="h" class="sw h"><div data-dragon-id="i" class="i"></div></div>
</div>
</body>
</html>
