<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; color: rgb(20, 40, 160); }
.sc { overflow: auto; width: 80px; height: 40px; padding: 4px; border: 2px solid #1a1a2e; margin-bottom: 4px; }
.tall { width: 50px; height: 90px; background-color: #e8d36a; }
.p { scroll-padding: 10px; scroll-padding-top: 64px; scroll-padding-inline: 2em 5%; scroll-margin: 0 20px; }
.P { SCROLL-PADDING: 1px 2px 3px; scroll-padding-block: auto 1.5rem; scroll-padding-inline-end: calc(10% + 1em); scroll-margin-top: 80px; scroll-margin-inline-start: -4px; }
.m { scroll-margin: 1em -2px 3px; scroll-margin-block: 2rem; scroll-margin-left: calc(1em + 2px); scroll-padding-right: 12%; scroll-snap-stop: always; }
.a { scroll-snap-align: start; scroll-snap-stop: always; }
.e { scroll-snap-align: end center; }
.c { scroll-snap-align: none center; scroll-margin: 6px; }
.t { scroll-snap-type: x mandatory; }
.u { scroll-snap-type: y; scroll-padding: 8px; }
.v { scroll-snap-type: both mandatory; }
.n { scroll-snap-align: none; scroll-snap-stop: normal; }
</style>
</head>
<body data-dragon-id="body">

<div data-dragon-id="b3" class="t m"><div data-dragon-id="t3" class="a">XX XX</div></div>
<div data-dragon-id="s4" class="sc v"><div data-dragon-id="t4" class="tall n P"><div data-dragon-id="t4c" class="u">XXX</div></div></div>
<div data-dragon-id="s5" class="sc u"><div data-dragon-id="t5" class="tall m">XX</div></div>

</body>
</html>
