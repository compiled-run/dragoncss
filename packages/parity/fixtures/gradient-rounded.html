<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-size: 16px; }
.row { display: flex; flex-wrap: wrap; width: 400px; column-gap: 8px; row-gap: 8px; padding: 8px; }
.record { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at center, #343b47 0 8%, #0b0d12 8.5% 12%, transparent 12.5%), repeating-radial-gradient(circle at center, #141820 0 7px, #080a0e 8px 12px); }
.track { width: 200px; height: 1rem; border-radius: 1rem; overflow: hidden; background: linear-gradient(to right, #2f4f66, #a57c5b); }
.round { width: 80px; height: 40px; border-radius: 10px 20px 4px 14px; border: 3px solid #123; background: linear-gradient(110deg, #e0a040, #204080) #fff; }
.pill { width: 90px; height: 24px; border-radius: 12px; background: radial-gradient(ellipse at 30% 40%, #fa0, #05a); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="record" class="record"></div>
<div data-dragon-id="track" class="track"></div>
<div data-dragon-id="round" class="round"></div>
<div data-dragon-id="pill" class="pill"></div>
</div>
</body>
</html>
