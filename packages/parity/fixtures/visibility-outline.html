<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 48px; row-gap: 40px; padding: 24px; background-color: rgb(255, 255, 255); }
.ring { width: 80px; height: 56px; padding: 12px; background-color: rgb(255, 0, 0); outline: 8px solid rgb(200, 0, 0); box-shadow: 0 0 0 14px rgb(255, 0, 255); visibility: hidden; }
.dbl { width: 64px; height: 48px; padding: 12px; background-color: rgb(255, 0, 0); outline: 9px double rgb(0, 0, 0); outline-offset: 4px; box-shadow: 0 0 0 6px rgb(0, 200, 200); visibility: collapse; }
.wrap { width: 112px; height: 80px; padding: 20px; background-color: rgb(255, 0, 0); visibility: hidden; }
.inh { width: 80px; height: 56px; padding: 12px; background-color: rgb(255, 0, 0); outline: 6px solid rgb(200, 0, 0); box-shadow: 0 0 0 8px rgb(255, 0, 255); }
.kid { width: 28px; height: 16px; background-color: rgb(0, 0, 255); outline: 4px solid rgb(0, 150, 0); outline-offset: 2px; visibility: visible; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="hid-ring" class="ring"><div data-dragon-id="kid-ring" class="kid"></div></div>
<div data-dragon-id="hid-dbl" class="dbl"><div data-dragon-id="kid-dbl" class="kid"></div></div>
<div data-dragon-id="hid-wrap" class="wrap"><div data-dragon-id="hid-inh" class="inh"><div data-dragon-id="kid-inh" class="kid"></div></div></div>
</div>
</body>
</html>
