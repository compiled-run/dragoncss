<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; column-gap: 28px; row-gap: 28px; padding: 16px; background-color: rgb(236, 240, 244); }
.b { width: 44px; height: 32px; background-color: rgb(40, 90, 200); }
.o1 { outline: 3px solid rgb(220, 30, 30); }
.o2 { outline: 4px solid rgb(30, 150, 60); outline-offset: 3px; }
.o4 { outline: 1px solid rgb(0, 0, 0); outline-offset: 1px; }
.o5 { outline: 3px solid rgb(250, 160, 0); outline-offset: -6px; }
.o6 { border: 2px solid rgb(0, 0, 0); outline: 2.5px solid rgb(0, 120, 120); outline-offset: 1.4px; }
.col { width: 60px; }
.p { height: 24px; background-color: rgb(250, 230, 120); outline: 4px solid rgb(120, 0, 160); outline-offset: 2px; }
.q { height: 24px; background-color: rgb(60, 60, 60); }
.wrap { width: 60px; padding: 6px; background-color: rgb(200, 220, 200); outline: 3px solid rgb(0, 90, 0); }
.inner { height: 20px; background-color: rgb(200, 60, 60); outline: 8px solid rgb(20, 20, 120); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="o1" class="b o1"></div>
<div data-dragon-id="o2" class="b o2"></div>
<div data-dragon-id="o4" class="b o4"></div>
<div data-dragon-id="o5" class="b o5"></div>
<div data-dragon-id="o6" class="b o6"></div>
<div data-dragon-id="col" class="col"><div data-dragon-id="p" class="p"></div><div data-dragon-id="q" class="q"></div></div>
<div data-dragon-id="wrap" class="wrap"><div data-dragon-id="inner" class="inner"></div></div>
</div>
</body>
</html>
