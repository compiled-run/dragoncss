<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; width: 380px; padding: 10px; column-gap: 26px; row-gap: 26px; background-color: #ffffff; }
.b { width: 50px; height: 34px; background-color: #000000; }
.b1 { box-shadow: 0 0 1px #000000; }
.b2 { box-shadow: 0 0 2px #000000; }
.b4 { box-shadow: 0 0 4px #000000; }
.b8 { box-shadow: 0 0 8px #000000; }
.b12 { box-shadow: 0 0 12px #000000; }
.b16 { box-shadow: 0 0 16px #000000; }
.r4 { border-radius: 8px; box-shadow: 0 0 4px #000000; }
.r12 { border-radius: 8px; box-shadow: 0 0 12px #000000; }
.o12 { border-radius: 50%; box-shadow: 0 0 12px #000000; }
.i8 { background-color: #ffffff; box-shadow: inset 0 0 8px #000000; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="b1" class="b b1"></div>
<div data-dragon-id="b2" class="b b2"></div>
<div data-dragon-id="b4" class="b b4"></div>
<div data-dragon-id="b8" class="b b8"></div>
<div data-dragon-id="b12" class="b b12"></div>
<div data-dragon-id="b16" class="b b16"></div>
<div data-dragon-id="r4" class="b r4"></div>
<div data-dragon-id="r12" class="b r12"></div>
<div data-dragon-id="o12" class="b o12"></div>
<div data-dragon-id="i8" class="b i8"></div>
</div>
</body>
</html>
