<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 16px; line-height: 16px; }
.stage { display: flex; flex-direction: column; row-gap: 12px; padding: 8px 16px; background-color: rgb(40, 60, 80); }
.row { display: flex; }
.light { background-color: rgb(245, 240, 225); }
.c { width: 32px; height: 32px; }
.s16 { width: 16px; }
.s8 { width: 8px; }
.a { background-color: rgb(230, 80, 40); opacity: 0.3; }
.b { background-color: rgb(40, 200, 120); opacity: 45%; }
.d { background-color: rgb(250, 220, 60); opacity: calc(1 / 3); }
.e { background-color: rgb(20, 30, 200); opacity: 0.5; }
.f { background-color: rgb(0, 0, 0); opacity: 0.00196; }
.g { background-color: rgb(200, 30, 90); opacity: 0.999; }
.h { background-color: rgb(255, 255, 255); opacity: 0.7; }
.i { opacity: 0.4; }
.j { background-color: rgb(90, 200, 230); border: 0 solid rgb(0, 0, 0); opacity: 0.62549; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="row1" class="row"><div data-dragon-id="of-a" class="c a"></div><div data-dragon-id="sp1a" class="s16"></div><div data-dragon-id="of-b" class="c b"></div><div data-dragon-id="sp1b" class="s8"></div><div data-dragon-id="of-d" class="c d"></div></div>
<div data-dragon-id="row2" class="row light"><div data-dragon-id="of-e" class="c e"></div><div data-dragon-id="sp2a" class="s16"></div><div data-dragon-id="of-f" class="c f"></div><div data-dragon-id="sp2b" class="s8"></div><div data-dragon-id="of-g" class="c g"></div></div>
<div data-dragon-id="row3" class="row"><div data-dragon-id="of-h" class="c h"></div><div data-dragon-id="sp3a" class="s16"></div><div data-dragon-id="of-i" class="c i"></div><div data-dragon-id="sp3b" class="s8"></div><div data-dragon-id="of-j" class="c j"></div></div>
</div>
</body>
</html>
