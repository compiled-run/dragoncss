<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; height: 60px; background-color: rgb(233, 236, 239); }
.grid { display: grid; grid-template-columns: 100px 100px; height: 60px; margin-top: 40px; background-color: rgb(233, 236, 239); }
.f { position: fixed; left: 0; top: 0; width: 80px; height: 40px; order: 5; background-color: rgb(38, 70, 83); }
.gf { position: fixed; left: 0; top: 100px; width: 80px; height: 40px; order: 5; background-color: rgb(38, 70, 83); }
.r { position: relative; width: 120px; height: 60px; background-color: rgb(42, 157, 143); }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row"><div data-dragon-id="f" class="f"></div><div data-dragon-id="r" class="r"></div></div>
<div data-dragon-id="grid" class="grid"><div data-dragon-id="gf" class="gf"></div><div data-dragon-id="gr" class="r"></div></div>
</body>
</html>
