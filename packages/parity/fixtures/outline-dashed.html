<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.stage { display: flex; flex-wrap: wrap; column-gap: 30px; row-gap: 26px; padding: 16px; background-color: rgb(236, 240, 244); }
.b { width: 64px; height: 36px; background-color: rgb(40, 90, 200); }
.a1 { outline: 3px dashed rgb(220, 30, 30); }
.a2 { width: 75px; height: 43px; outline: 4px dashed rgb(30, 150, 60); outline-offset: 3px; }
.a3 { outline: 5px dashed rgb(0, 0, 0); outline-offset: -8px; }
.a4 { outline: 2.5px dashed rgb(120, 0, 160); outline-offset: 1.4px; }
.t1 { outline: 6px dotted rgb(250, 160, 0); }
.t2 { width: 71px; height: 41px; outline: 5px dotted rgb(0, 120, 120); outline-offset: 2px; }
.t3 { border: 3px solid rgb(0, 0, 0); outline: 4px dotted rgb(200, 30, 120); outline-offset: 1px; }
.t4 { outline: 1px dotted rgb(0, 0, 0); outline-offset: 2px; }
.t5 { border: 2px solid rgb(250, 250, 250); outline: 3px dashed rgb(30, 30, 30); outline-offset: 2px; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="stage" class="stage">
<div data-dragon-id="a1" class="b a1"></div>
<div data-dragon-id="a2" class="b a2"></div>
<div data-dragon-id="a3" class="b a3"></div>
<div data-dragon-id="a4" class="b a4"></div>
<div data-dragon-id="t1" class="b t1"></div>
<div data-dragon-id="t2" class="b t2"></div>
<div data-dragon-id="t3" class="b t3"></div>
<div data-dragon-id="t4" class="b t4"></div>
<div data-dragon-id="t5" class="b t5"></div>
</div>
</body>
</html>
