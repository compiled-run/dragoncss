<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; font-family: Ahem; font-size: 10px; }
.row { display: flex; }
.cell { width: 80px; height: 90px; }
.box { margin: 25px; width: 40px; height: 30px; background-color: #1f6feb; }
.r30 { transform: rotate(30deg); background-color: #cf222e; }
.r45 { transform: rotate(45deg); background-color: #1a7f37; }
.r90 { transform: rotate(90deg); background-color: #8250df; }
.rm15 { transform: rotate(-15deg); background-color: #bf8700; }
.r180 { transform: rotate(180deg); border-left: 6px solid #111111; width: 34px; }
.rrad { transform: rotate(0.5rad); background-color: #0a3069; }
.rturn { transform: rotate(0.375turn); background-color: #953800; }
.rgrad { transform: rotate(-50grad); background-color: #6639ba; }
.r360 { transform: rotate(360deg); background-color: #116329; }
.r0 { transform: rotate(0); background-color: #a40e26; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row0" class="row"><div data-dragon-id="a0c" class="cell"><div data-dragon-id="a0" class="box r30"></div></div><div data-dragon-id="a1c" class="cell"><div data-dragon-id="a1" class="box r45"></div></div><div data-dragon-id="a2c" class="cell"><div data-dragon-id="a2" class="box r90"></div></div><div data-dragon-id="a3c" class="cell"><div data-dragon-id="a3" class="box rm15"></div></div><div data-dragon-id="a4c" class="cell"><div data-dragon-id="a4" class="box r180"></div></div></div>
<div data-dragon-id="row1" class="row"><div data-dragon-id="b0c" class="cell"><div data-dragon-id="b0" class="box rrad"></div></div><div data-dragon-id="b1c" class="cell"><div data-dragon-id="b1" class="box rturn"></div></div><div data-dragon-id="b2c" class="cell"><div data-dragon-id="b2" class="box rgrad"></div></div><div data-dragon-id="b3c" class="cell"><div data-dragon-id="b3" class="box r360"></div></div><div data-dragon-id="b4c" class="cell"><div data-dragon-id="b4" class="box r0"></div></div></div>
</body>
</html>
