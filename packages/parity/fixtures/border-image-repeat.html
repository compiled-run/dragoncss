<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; flex-wrap: wrap; width: 400px; column-gap: 6px; row-gap: 6px; padding: 4px; }
.b { width: 48px; height: 32px; border: 8px solid #102030; background: #f0e8d8; }
.rep { border-image: linear-gradient(to right, red, blue) 8 repeat; }
.phase { border-image: linear-gradient(to right, #2f4f66, #a57c5b) 16 / 8px repeat stretch; }
.round { border-image: linear-gradient(90deg, #336699, #996633) 16 fill / 8px round; }
.space { border-image: linear-gradient(to bottom, rgb(40, 80, 160), rgb(200, 120, 30) 40%, rgb(20, 200, 90)) 16 / 8px space; }
.nospace { border-image: linear-gradient(to right, #123456, #abcdef) 2 fill / 8px space; }
.big { border-image: linear-gradient(-30deg, #343b47, #0b0d12 30% 60%, #405060) 4 / 8px repeat; }
.mixed { border-image: linear-gradient(to left, #2f4f66, #a57c5b) 8 fill / 1 repeat space; }
.numround { border-image: linear-gradient(150grad, #2f4f66, #a57c5b) 16 / 1 round; }
.num { border-image: linear-gradient(to top, #0a8, #fff) 8 / 2 repeat; }
.angle { border-image: linear-gradient(30deg, #2f4f66, #a57c5b 60%, #102030) 16 fill / 8px repeat round; }
.longhands { border-image-source: linear-gradient(to bottom, #336699, #996633); border-image-slice: 16 fill; border-image-width: 8px; border-image-repeat: round space; }
.bb { box-sizing: border-box; width: 64px; height: 48px; border-image: linear-gradient(to right, #2f4f66, #a57c5b) 8 fill round; }
.styleless { border-style: none; border-image: linear-gradient(red, blue) 8 fill / 8px repeat; }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row">
<div data-dragon-id="rep" class="b rep"></div>
<div data-dragon-id="phase" class="b phase"></div>
<div data-dragon-id="round" class="b round"></div>
<div data-dragon-id="space" class="b space"></div>
<div data-dragon-id="nospace" class="b nospace"></div>
<div data-dragon-id="big" class="b big"></div>
<div data-dragon-id="mixed" class="b mixed"></div>
<div data-dragon-id="numround" class="b numround"></div>
<div data-dragon-id="num" class="b num"></div>
<div data-dragon-id="angle" class="b angle"></div>
<div data-dragon-id="longhands" class="b longhands"></div>
<div data-dragon-id="bb" class="b bb"></div>
<div data-dragon-id="styleless" class="b styleless"></div>
</div>
</body>
</html>
