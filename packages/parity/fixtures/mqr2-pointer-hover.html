<!DOCTYPE html>
<html data-dragon-id="html">
<head>
<style>
body { margin: 0; }
.row { display: flex; height: 24px; }
.a { width: 40px; height: 12px; background-color: #ccc; }
.b { flex-grow: 1; height: 12px; background-color: #888; }
.c { width: 25%; height: 6px; background-color: #444; }
@media (hover: hover) { .a { width: 64px; background-color: #36c; } }
@media (pointer: coarse) { .row { height: 48px; } .b { height: 40px; background-color: #c63; } }
@media (any-pointer: fine) and (max-width: 360px) { .c { width: 50%; } }
@media (any-hover: none) { .c { height: 14px; background-color: #a3c; } }
</style>
</head>
<body data-dragon-id="body">
<div data-dragon-id="row" class="row"><div data-dragon-id="a" class="a"></div><div data-dragon-id="b" class="b"></div></div>
<div data-dragon-id="c" class="c"></div>
</body>
</html>
