# The landing driver (scripts/land.ts, AGENTS.md step 7) on a GitHub runner instead of the Mac (cloud migration items 8 and 9).
# Dispatch with the queue: gh workflow run land.yml --ref master -f queue='<branch>:<pr>:<clean-head> ...'
# Every heavy step runs on CI (LAND_CI=only). One batch per job, for the 6-hour job limit: when the batch ends normally and no
# stop is set, the job dispatches land.yml again with the rest of the queue. State lives on GitHub: the review comment
# (pnpm land:post-review), the land-stop label on issue vars.LAND_STOP_ISSUE, and master's land/proof status. A new run
# reconciles from it (skips merged PRs, proves an unproved master first), so a cancelled run is safe to follow.
# LAND_TOKEN (a fine-grained PAT or App token with contents, pull-requests, actions and statuses write) drives git and gh:
# pushes and merges made with GITHUB_TOKEN start no workflow, so the driver would wait forever for CI.
name: land
run-name: ${{ inputs.queue == '' && 'land (empty queue)' || 'land' }}
on:
  workflow_dispatch:
    inputs:
      queue:
        description: 'Queue entries <branch>:<pr>:<clean-head>, separated by newlines or spaces'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: read
  actions: read
concurrency:
  group: land
  cancel-in-progress: false
jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.LAND_TOKEN || github.token }}
      LAND_CI: only
      LAND_MAX_BATCHES: '1'
      LAND_PIPELINE: '0'
      LAND_QUEUE_EMPTY_OK: '1'
      LAND_REVIEW_SOURCE: comment
      # The PM posts reviews as the owner; compiled-run is an organization, so its login (the script's default) posts nothing.
      LAND_REVIEWERS: ${{ vars.LAND_REVIEWERS || 'thejackshelton' }}
      LAND_STOP_ISSUE: ${{ vars.LAND_STOP_ISSUE }}
    steps:
      # Fail fast: a queue needs LAND_TOKEN and lands only from master; an empty queue only proves the start-up.
      - name: Check the token and the ref
        env:
          QUEUE: ${{ inputs.queue }}
          HAS_LAND_TOKEN: ${{ secrets.LAND_TOKEN != '' }}
        run: |
          if [ -z "$(printf '%s' "$QUEUE" | tr -d '[:space:]')" ]; then
            [ "$HAS_LAND_TOKEN" = true ] || echo "::warning::LAND_TOKEN is not set; the queue is empty, so this run only proves the start-up. A queue would fail here."
            exit 0
          fi
          if [ "$HAS_LAND_TOKEN" != true ]; then
            echo "::error::The repository secret LAND_TOKEN is not set. Add a fine-grained PAT or App token with contents, pull-requests, actions and statuses write: pushes and merges made with GITHUB_TOKEN start no CI, so the driver would wait forever."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != master ]; then
            echo "::error::land.yml lands a queue only from master (dispatched on $GITHUB_REF_NAME); dispatch it with --ref master."
            exit 1
          fi
      - name: Free disk space
        run: |
          {
            echo "LAND_LOG_DIR=$RUNNER_TEMP/land-logs"
            echo "LAND_HANDOFF=$RUNNER_TEMP/land-logs/handoff.json"
            echo "LAND_QUEUE_FILE=$RUNNER_TEMP/land-queue.txt"
          } >> "$GITHUB_ENV"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.LAND_TOKEN || github.token }}
      - name: Set up pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Set up Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up git
        run: |
          pnpm setup:git
          git config --global user.name 'dragon landing driver'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # Parallel position worktrees take 1.5 to 4 GB each; they stay on only when the disk keeps the driver's floor (40 GB).
      - name: Choose parallel builds by free disk
        run: |
          free=$(df -BG --output=avail /tmp | tail -1 | tr -dc '0-9')
          if [ "$free" -ge 40 ]; then parallel=1; else parallel=0; fi
          echo "free disk ${free} GB: LAND_PARALLEL=$parallel"
          echo "LAND_PARALLEL=$parallel" >> "$GITHUB_ENV"
      - name: Build the queue file
        id: queue
        env:
          LAND_QUEUE_INPUT: ${{ inputs.queue }}
        run: |
          mkdir -p "$LAND_LOG_DIR"
          node scripts/land-actions.ts queue "$LAND_QUEUE_FILE"
      - name: Land one batch
        id: land
        run: pnpm land "$LAND_QUEUE_FILE"
      - name: Re-dispatch the rest of the queue
        if: ${{ !cancelled() && steps.queue.outputs.count != '0' && steps.queue.outcome == 'success' }}
        run: node scripts/land-actions.ts redispatch "$LAND_HANDOFF"
      - name: Upload the driver's logs and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: land-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/land-logs
          if-no-files-found: warn
          retention-days: 30
