# CI-OFFLOAD step 2: `pnpm regen` for a branch on GitHub-hosted runners, pushed back to the branch as its own commit.
# Trigger: workflow_dispatch with a branch, or the `regen` label on a pull request from this repository.
# Branch mode (pnpm ci:regen): workflow_dispatch with a branch, the `head` it must still be at and a caller `nonce`; the run-name
# "regen of branch <branch> at <head> (<nonce>)" lets the caller find its run again, and resolve refuses a branch not at `head`.
# Patch mode (the landing driver, LAND_REGEN=ci): workflow_dispatch with a commit `sha` instead of a branch. Nothing is pushed:
# the final combined outputs.patch (against that commit, the last round's) is the artifact regen-patch, and no cache is saved
# (the regen and WPT caches are restored only, the pnpm store is not cached), since a dispatched run regenerates an unreviewed
# tree at master's cache scope.
# The chain is split by machine (regen-on-ci-round.yml): the Chrome steps on macos-26, whose captures are byte-identical to the
# local Mac's (capture-proof.yml), and lanes-host on xcode-27, the image with the local Mac's Xcode 27.0. Rounds alternate until
# one changes nothing (at most 5), and the last round's tree is committed. tw-sweep, which no other step reads, runs in the
# Chrome rounds with the rest: its Chrome memo made it a few minutes, so a round of its own after them only added a runner's
# setup. Never pushes master, a protected branch, the default branch or a fork; never force-pushes (a branch that moved
# meanwhile makes the push fail).
# resume (either dispatch mode; a label run or a branch dispatch finds one by itself on its branch): an earlier run's id. When its chrome-1 tree, applied to this commit, leaves every Chrome step
# skipped (a fix that touched only host code, say), the chain starts at host-1; otherwise chrome-1 runs seeded with its store.
# Either way the outputs equal a run from scratch, since cache entries are keyed by content. A run given resume saves no cache.
# A push made with GITHUB_TOKEN starts no workflow, so the push job dispatches ci.yml on the branch for the new commit's checks.
# Every push to master runs the same chain without pushing ("warm"): Actions caches made in a pull request are visible only to
# that pull request, while master's are visible to every branch, so master's run keeps the regen cache warm for all of them.
name: regen-on-ci
run-name: ${{ inputs.sha && format('regen of {0}', inputs.sha) || inputs.branch && format('regen of branch {0} at {1} ({2})', inputs.branch, inputs.head || 'its head', inputs.nonce || 'no nonce') || (github.event_name == 'pull_request' && github.event.pull_request.title) || (github.event_name == 'push' && github.event.head_commit.message) || 'regen-on-ci' }}
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate and push to (never master); leave empty to give a sha
        required: false
        type: string
      sha:
        description: Commit to regenerate without pushing (patch mode, the landing driver); the artifact regen-patch is the result
        required: false
        type: string
      head:
        description: With a branch, the full commit sha the branch must be at; the run refuses a branch that is anywhere else
        required: false
        type: string
      nonce:
        description: With a branch, the caller's token for finding this run by its run-name (pnpm ci:regen)
        required: false
        type: string
      resume:
        description: Id of an earlier regen-on-ci run to take chrome-1 from when this commit changes no Chrome-step input; saves no cache
        required: false
        type: string
  pull_request:
    types: [labeled]
  push:
    branches: [master]
permissions:
  contents: read
  # A round given seed_run (resume) downloads another run's artifact; a called workflow gets no more than this.
  actions: read
# Master's cache runs share one group and cancel each other: only the newest master matters. A branch's runs have their own
# group, per branch and per label, so a label event that is not `regen` never takes a queued regen's place.
concurrency:
  group: ${{ github.event_name == 'push' && 'regen-on-ci-master-warm' || format('regen-on-ci-{0}-{1}', inputs.sha || inputs.branch || github.head_ref, github.event.label.name || 'dispatch') }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  resolve:
    if: github.event_name != 'pull_request' || github.event.label.name == 'regen'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      branch: ${{ steps.r.outputs.branch }}
      sha: ${{ steps.r.outputs.sha }}
      mode: ${{ steps.r.outputs.mode }}
      resume: ${{ steps.resume.outputs.resume }}
      save: ${{ steps.resume.outputs.save }}
    # Waiting for a slot (below) can take hours while device lanes or older branch regens run.
    timeout-minutes: 360
    steps:
      # A worker's branch regen waits on this free Linux job, oldest first, while REGEN_BRANCH_SLOTS older ones are queued or
      # running: each holds a macOS runner (5 at once). The landing no longer waits on device lanes, so its regen rounds run one
      # at a time and hold one runner, which the fifth leaves free: a label run or a patch-mode regen holds no branch regen back.
      # It still waits while a device lanes run is queued or running (its four iOS jobs take four of the five), for at most
      # DEVICE_YIELD_SECONDS, so that run never queues for a runner a worker took meanwhile. The landing's own runs never wait.
      - name: Wait for a branch regen slot
        if: github.event_name == 'workflow_dispatch' && inputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REGEN_BRANCH_SLOTS: '3'
          DEVICE_YIELD_SECONDS: '5400'
          # 9 calls a poll: two waiting runs stay well under the token's 1000 requests an hour.
          POLL_SECONDS: '120'
          DISPATCH_BRANCH: ${{ inputs.branch }}
          DISPATCH_HEAD: ${{ inputs.head }}
        run: |
          set -euo pipefail
          mine=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" -q .created_at)
          [[ "$mine" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || { echo "::error::run $GITHUB_RUN_ID has no creation time: $mine"; exit 1; }
          filter="[.workflow_runs[] | select(.event == \"workflow_dispatch\" and .id != $GITHUB_RUN_ID and ((.display_title // \"\") | startswith(\"regen of branch \")) and (.created_at < \"$mine\" or (.created_at == \"$mine\" and .id < $GITHUB_RUN_ID)))] | length"
          waited=0
          told_devices=0
          told_slots=0
          while :; do
            # A branch that moved off the dispatched head is refused below anyway: stop now, so the slot goes to the next run and
            # this branch's newer dispatch (same concurrency group) is not held behind a run that can only fail.
            if [ -n "${DISPATCH_HEAD:-}" ]; then
              now=$(gh api "repos/$REPO/branches/$DISPATCH_BRANCH" -q .commit.sha 2>/dev/null || true)
              # gh prints an error body on a failed lookup (5xx, rate limit): only a commit sha counts, anything else waits on.
              if [[ "$now" =~ ^[0-9a-f]{40}$ ]] && [ "$now" != "$DISPATCH_HEAD" ]; then
                echo "::error::$DISPATCH_BRANCH moved from the dispatched head $DISPATCH_HEAD to $now while waiting for a slot; dispatch again"
                exit 1
              fi
            fi
            ahead=0
            devices=0
            failed=0
            # A failed list (5xx, the token's hourly rate limit, which every waiting run shares) counts nothing: it waits a poll.
            for st in queued in_progress waiting pending; do
              runs=$(gh api "repos/$REPO/actions/workflows/regen-on-ci.yml/runs?status=$st&per_page=100" 2>/dev/null) && n=$(jq -r "$filter" <<<"$runs") && [[ "$n" =~ ^[0-9]+$ ]] || { failed=1; break; }
              ahead=$((ahead + n))
              n=$(gh api "repos/$REPO/actions/workflows/device-lanes.yml/runs?status=$st&per_page=100" -q '.workflow_runs | length' 2>/dev/null) && [[ "$n" =~ ^[0-9]+$ ]] || { failed=1; break; }
              devices=$((devices + n))
            done
            if [ "$failed" = 1 ]; then
              echo "regen-on-ci: listing the queued and running runs failed; trying again in $POLL_SECONDS s"
            elif [ "$devices" -gt 0 ] && [ "$waited" -lt "$DEVICE_YIELD_SECONDS" ]; then
              [ "$told_devices" = 1 ] || echo "regen-on-ci: $devices device lanes run(s) are queued or running; waiting until they end (at most $DEVICE_YIELD_SECONDS s)"
              told_devices=1
            elif [ "$ahead" -ge "$REGEN_BRANCH_SLOTS" ]; then
              [ "$told_slots" = 1 ] || echo "regen-on-ci: $ahead older branch regens are queued or running; waiting for one of $REGEN_BRANCH_SLOTS slots"
              told_slots=1
            else
              break
            fi
            sleep "$POLL_SECONDS"
            waited=$((waited + POLL_SECONDS))
          done
          echo "regen-on-ci: started after waiting $waited s for a branch regen slot" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resolve and refuse unsafe branches
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISPATCH_BRANCH: ${{ inputs.branch }}
          DISPATCH_SHA: ${{ inputs.sha }}
          DISPATCH_HEAD: ${{ inputs.head }}
          DISPATCH_NONCE: ${{ inputs.nonce }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Branch regens come first: the macOS runners are few (5 at once), so a master cache run yields to any branch regen
            # queued or running ("regen of branch ...", a label run), and the next master push warms the cache instead. Patch-mode
            # runs (exactly "regen of <sha>", the landing driver's) never make it yield: they are nearly always in flight during a
            # landing, save no cache themselves, and restore master's, so master's run must keep saving it.
            busy=0
            for st in queued in_progress waiting pending; do
              n=$(gh api "repos/$REPO/actions/workflows/regen-on-ci.yml/runs?status=$st&per_page=100" -q '[.workflow_runs[] | select(.event != "push" and (.event != "workflow_dispatch" or ((.display_title // "") | test("^regen of [0-9a-f]{40}$") | not)))] | length')
              busy=$((busy + n))
            done
            if [ "$busy" -gt 0 ]; then
              { echo "branch=master"; echo "sha=$GITHUB_SHA"; echo "mode=skip"; } >> "$GITHUB_OUTPUT"
              echo "regen-on-ci: $busy branch regen run(s) queued or running; master's cache run yields to them" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            { echo "branch=master"; echo "sha=$GITHUB_SHA"; echo "mode=warm"; } >> "$GITHUB_OUTPUT"
            echo "regen-on-ci: warming the regen cache on master at $GITHUB_SHA (nothing is pushed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$DISPATCH_SHA" ]; then
            [ -z "$DISPATCH_BRANCH" ] || { echo "::error::give a branch or a sha, not both"; exit 1; }
            [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit sha: $DISPATCH_SHA"; exit 1; }
            { echo "branch="; echo "sha=$DISPATCH_SHA"; echo "mode=patch"; } >> "$GITHUB_OUTPUT"
            echo "regen-on-ci: regen of $DISPATCH_SHA (patch mode: nothing is pushed, caches are restored only)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then branch=$DISPATCH_BRANCH
            [ -z "$DISPATCH_HEAD" ] || [[ "$DISPATCH_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head is not a full commit sha: $DISPATCH_HEAD"; exit 1; }
            [[ "$DISPATCH_NONCE" =~ ^[0-9A-Za-z_-]*$ ]] || { echo "::error::nonce may hold only letters, digits, _ and -: $DISPATCH_NONCE"; exit 1; }
          else branch=$PR_BRANCH
            [ "$PR_REPO" = "$REPO" ] || { echo "::error::the pull request comes from $PR_REPO, not $REPO; regen-on-ci pushes only to this repository"; exit 1; }
          fi
          git check-ref-format --branch "$branch" >/dev/null || { echo "::error::not a branch name: $branch"; exit 1; }
          default=$(gh api "repos/$REPO" -q .default_branch)
          [ "$branch" != master ] && [ "$branch" != "$default" ] || { echo "::error::refusing to push to $branch"; exit 1; }
          info=$(gh api "repos/$REPO/branches/$branch")
          [ "$(jq -r .protected <<<"$info")" = false ] || { echo "::error::refusing to push to the protected branch $branch"; exit 1; }
          sha=$(jq -r .commit.sha <<<"$info")
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$sha" != "$PR_SHA" ]; then echo "::error::$branch moved from the labelled head $PR_SHA to $sha; label again"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$DISPATCH_HEAD" ] && [ "$sha" != "$DISPATCH_HEAD" ]; then echo "::error::$branch is at $sha, not the dispatched head $DISPATCH_HEAD; dispatch again"; exit 1; fi
          { echo "branch=$branch"; echo "sha=$sha"; echo "mode=push"; } >> "$GITHUB_OUTPUT"
          echo "regen-on-ci: $branch at $sha" >> "$GITHUB_STEP_SUMMARY"
      # resume names an earlier run whose chrome-1 tree and regen store this run starts from (resume-chrome-1 below). It must be a
      # regen-on-ci run of this repository, made from this repository (a fork's pull request runs its own copy of this workflow,
      # so its artifacts are its own), by a label on a branch of this repository, a dispatch from master or a push to master, of
      # the branch this run regenerates when it names one, whose chrome-1 artifact is live and was not left by a failed or
      # cancelled chrome-1 (the round uploads even then). A given run that does not qualify only warns: the run regenerates from
      # scratch, as without it. A regen label run, or a branch dispatch without resume, takes the newest earlier run of the same
      # branch that qualifies, so the landing's fix rounds resume by themselves. A store from another run never goes into the
      # shared cache: a run that resumes saves none.
      - name: Check the run to resume from
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESUME: ${{ inputs.resume }}
          MODE: ${{ steps.r.outputs.mode }}
          BRANCH: ${{ steps.r.outputs.branch }}
          RUNS_TRIED: '5'
        run: |
          set -euo pipefail
          # Why run $1 cannot be resumed from, in why (empty when it can); regen is 1 once it is known to be a regen run that
          # uploaded a chrome-1 (a label run with another label uploads nothing, and does not use up a try).
          why_not() {
            local run src arts bad
            why=""; regen=0
            run=$(gh api "repos/$REPO/actions/runs/$1" 2>/dev/null) || { why="run $1 was not found"; return; }
            [ "$(jq -r '.path // ""' <<<"$run")" = .github/workflows/regen-on-ci.yml ] || { why="run $1 is not a regen-on-ci run"; return; }
            src=$(jq -r --arg repo "$REPO" --arg b "$BRANCH" '
              if (.repository.full_name // "") != $repo or (.head_repository.full_name // "") != $repo then "was not made from \($repo)"
              elif .event == "pull_request" then (if $b == "" or .head_branch == $b then "" else "regenerated another branch" end)
              elif .event == "workflow_dispatch" then (if .head_branch != "master" then "was not dispatched from master"
                elif $b == "" or ((.display_title // "") | startswith("regen of branch \($b) at ")) then "" else "regenerated another branch" end)
              elif .event == "push" then (if .head_branch == "master" and ($b == "" or $b == "master") then "" else "regenerated another branch" end)
              else "came from a \(.event // "unknown") event" end' <<<"$run" 2>/dev/null) || src="could not be read"
            [ -z "$src" ] || { why="run $1 $src"; return; }
            arts=$(gh api "repos/$REPO/actions/runs/$1/artifacts?name=chrome-1&per_page=100" -q '[.artifacts[] | select(.expired == false)] | length' 2>/dev/null) || arts=error
            [ "$arts" != 0 ] && [ "$arts" != error ] || { why="run $1 has no live chrome-1 artifact"; return; }
            regen=1
            bad=$(gh api "repos/$REPO/actions/runs/$1/jobs?filter=latest&per_page=100" -q '[.jobs[] | select((.name == "chrome-1" or (.name | startswith("chrome-1 /"))) and .conclusion != "success" and .conclusion != "skipped")] | length' 2>/dev/null) || bad=error
            [ "$bad" = 0 ] || why="run $1's chrome-1 did not succeed"
          }
          resume=""
          if [ -n "${RESUME:-}" ] && [ "$MODE" != skip ]; then
            [[ "$RESUME" =~ ^[0-9]+$ ]] || { echo "::error::resume is not a run id: $RESUME"; exit 1; }
            why_not "$RESUME"
            if [ -n "$why" ]; then echo "::warning::$why; chrome-1 runs from scratch"; else resume=$RESUME; fi
          elif [ "$MODE" = push ]; then
            # The branch's label runs (head_branch) and its branch dispatches (run-name; dispatched from master) made from this
            # repository before this one, newest first. At most RUNS_TRIED regen runs are tried and 30 runs looked at (each costs
            # up to three API calls). A failed list only means no resume.
            labelled=$(gh api "repos/$REPO/actions/workflows/regen-on-ci.yml/runs?event=pull_request&branch=$(jq -rn --arg b "$BRANCH" '$b | @uri')&per_page=30" 2>/dev/null) || labelled='{}'
            dispatched=$(gh api "repos/$REPO/actions/workflows/regen-on-ci.yml/runs?event=workflow_dispatch&per_page=50" 2>/dev/null) || dispatched='{}'
            ids=$(jq -rs --arg b "$BRANCH" --arg repo "$REPO" --argjson me "$GITHUB_RUN_ID" '[((.[0].workflow_runs // [])[] | select(.head_branch == $b)), ((.[1].workflow_runs // [])[] | select(.head_branch == "master" and ((.display_title // "") | startswith("regen of branch \($b) at "))))] | map(select((.head_repository.full_name // "") == $repo) | .id | select(type == "number" and . < $me)) | unique | reverse | .[:30] | .[]' <<<"$labelled$dispatched" 2>/dev/null) || ids=""
            tried=0
            for id in $ids; do
              [[ "$id" =~ ^[0-9]+$ ]] || continue
              why_not "$id"
              if [ -z "$why" ]; then resume=$id; break; fi
              echo "regen-on-ci: not resuming from run $id: $why"
              tried=$((tried + regen))
              [ "$tried" -lt "$RUNS_TRIED" ] || break
            done
          fi
          save=false
          if [ "$MODE" != patch ] && [ -z "${RESUME:-}" ] && [ -z "$resume" ]; then save=true; fi
          { echo "resume=$resume"; echo "save=$save"; } >> "$GITHUB_OUTPUT"
          [ -z "$resume" ] || echo "regen-on-ci: resuming from run $resume's chrome-1 where it still covers this commit; no cache is saved" >> "$GITHUB_STEP_SUMMARY"
  # With resume: when the earlier run's chrome-1 tree, applied to this commit, leaves every Chrome step skipped under its regen
  # store (regen --explain, keyed as the macOS runner, as the push job judges a moved branch), that tree is what chrome-1 would
  # make here, so this Linux job uploads it as chrome-1 and the chain starts at host-1. Anything else (the patch does not apply,
  # a step would run or restore, any error) leaves resumed unset and chrome-1 runs, seeded with that run's store.
  resume-chrome-1:
    needs: resolve
    if: needs.resolve.outputs.mode != 'skip' && needs.resolve.outputs.resume != ''
    runs-on: ubuntu-latest
    # A job-level failure (a lost runner, the timeout) leaves resumed unset, so chrome-1 runs; no later job tests this one's result.
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      resumed: ${{ steps.done.outputs.resumed }}
      changed: ${{ steps.done.outputs.changed }}
      next: ${{ steps.done.outputs.next }}
    env:
      # The machine and environment the rounds key with (regen-on-ci-round.yml), so the keys match theirs.
      DRAGON_REGEN_MACHINE: '{"platform":"darwin","arch":"arm64","node":"v24.15.0"}'
      DRAGON_WPT_DIR: /Users/runner/wpt
      JAVA_HOME: /opt/homebrew/opt/openjdk@17
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out the commit
        id: co
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Set up pnpm 10.33.2
        id: pnpm
        continue-on-error: true
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Set up Node 24.15.0
        id: node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Download the earlier run's chrome-1
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: chrome-1
          path: ${{ runner.temp }}/prev
          run-id: ${{ needs.resolve.outputs.resume }}
          github-token: ${{ github.token }}
      - name: Would chrome-1 change anything on this commit
        id: judge
        if: steps.co.outcome == 'success' && steps.pnpm.outcome == 'success' && steps.node.outcome == 'success' && steps.install.outcome == 'success' && steps.dl.outcome == 'success'
        continue-on-error: true
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          RESUME: ${{ needs.resolve.outputs.resume }}
        run: |
          set -euo pipefail
          prev="$RUNNER_TEMP/prev"
          test -f "$prev/store.tar.zst" || { echo "run $RESUME's chrome-1 has no store; chrome-1 runs"; exit 0; }
          if [ -s "$prev/outputs.patch" ]; then
            git apply --binary --check "$prev/outputs.patch" || { echo "run $RESUME's chrome-1 outputs do not apply to $SHA; chrome-1 runs"; exit 0; }
            git apply --binary "$prev/outputs.patch"
          fi
          # Only regen outputs come from the earlier run: a path no step claims is never judged by --explain below, so it is not
          # taken. The steps' outputs are this commit's .gitattributes merge=dragon-generated lines (read at $SHA, so the patch
          # cannot claim its own paths) and MERGE_BY_HAND's files (scripts/regen.ts); regen.test keeps the two equal to them.
          git add -A
          names=$(git diff --cached --name-only --no-renames "$SHA")
          by_hand='packages/parity/out/lanes.json packages/wpt/expectations/web.json'
          unclaimed=""
          [ -z "$names" ] || unclaimed=$(git check-attr --source "$SHA" --stdin merge <<<"$names" | { grep -v ': merge: dragon-generated$' || true; } | sed 's/: merge: [^:]*$//' | { grep -vxF -f <(tr ' ' '\n' <<<"$by_hand") || true; } | head -n 5 | paste -sd ' ' -)
          [ -z "$unclaimed" ] || { echo "run $RESUME's chrome-1 changes files no regen step claims ($unclaimed); chrome-1 runs"; exit 0; }
          mkdir -p .git/dragon-regen
          zstd -dcq "$prev/store.tar.zst" | tar -xf - -C .git/dragon-regen
          log=node_modules/.cache/dragon-regen/last-run.json
          node scripts/regen.ts --explain --skip lanes-host || { echo "regen --explain failed; chrome-1 runs"; exit 0; }
          total=$(jq length "$log")
          stale=$(jq -r '[.[] | select(.action != "skipped") | "\(.step) (\(.action): \(.why))"] | join("; ")' "$log")
          [ "$total" -gt 0 ] || { echo "regen --explain judged no step; chrome-1 runs"; exit 0; }
          [ -z "$stale" ] || { echo "this commit changes Chrome-step inputs: $stale; chrome-1 runs"; exit 0; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$log" "$RUNNER_TEMP/out/chrome-explain.json"
          # The round's own outputs: the cumulative patch against this commit (made again here, so it is against $SHA), the store.
          git add -A
          git diff --cached --binary "$SHA" > "$RUNNER_TEMP/out/outputs.patch"
          changed=false; [ -s "$RUNNER_TEMP/out/outputs.patch" ] && changed=true
          mv "$prev/store.tar.zst" "$RUNNER_TEMP/out/store.tar.zst"
          # As the round's own "Would the other side's round run anything": anything but a clean "all skipped" says host-1 runs.
          next=true
          if node scripts/regen.ts --explain --only lanes-host; then
            n=$(jq '[.[] | select(.action != "skipped")] | length' "$log" 2>/dev/null || echo error)
            [ "$n" != 0 ] || next=false
          fi
          echo "chrome-1 (resumed from run $RESUME): all $total Chrome steps covered on $SHA, changed files: $changed; host-1 $([ "$next" = true ] && echo runs || echo would change nothing)" | tee "$RUNNER_TEMP/out/timing.txt" >> "$GITHUB_STEP_SUMMARY"
          { echo "ok=true"; echo "changed=$changed"; echo "next=$next"; } >> "$GITHUB_OUTPUT"
      - name: Upload as chrome-1
        id: up
        if: steps.judge.outcome == 'success' && steps.judge.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chrome-1
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Resumed or not
        id: done
        env:
          UP: ${{ steps.up.outcome }}
          CHANGED: ${{ steps.judge.outputs.changed }}
          NEXT: ${{ steps.judge.outputs.next }}
        run: |
          if [ "$UP" = success ]; then
            { echo "resumed=true"; echo "changed=$CHANGED"; echo "next=$NEXT"; } >> "$GITHUB_OUTPUT"
          else
            echo "resumed=false" >> "$GITHUB_OUTPUT"
            echo "regen-on-ci: chrome-1 could not be taken from the earlier run; it runs, seeded with that run's store" >> "$GITHUB_STEP_SUMMARY"
          fi
  chrome-1:
    needs: [resolve, resume-chrome-1]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.mode != 'skip' && needs.resume-chrome-1.outputs.resumed != 'true' }}
    uses: ./.github/workflows/regen-on-ci-round.yml
    with: { runner: macos-26, side: chrome, args: '--skip lanes-host', sha: '${{ needs.resolve.outputs.sha }}', seed_run: '${{ needs.resolve.outputs.resume }}', name: chrome-1, save_cache: "${{ needs.resolve.outputs.save == 'true' }}" }
  # Beside host-1, on Linux: parity:lanes --run-host on chrome-1's tree with kotlinc only (iOS reads as blocked), so a lane
  # configuration, manifest or verdict break shows in this job long before the macOS host round ends. It only reports: host-1
  # still decides the run, and nothing here is kept. continue-on-error keeps the run's conclusion whatever this job does (a
  # download flake, its timeout), and land-devices-ci.ts failedJobs skips it (REPORT_ONLY_JOBS), so it never fails a regen.
  host-precheck:
    needs: [resolve, resume-chrome-1, chrome-1]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.chrome-1.result == 'success' || needs.resume-chrome-1.outputs.resumed == 'true') && (needs.resume-chrome-1.outputs.resumed == 'true' && needs.resume-chrome-1.outputs.next || needs.chrome-1.outputs.next) != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Set up pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Set up Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: kotlinc 2.4.20 (the release lanes.json records)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.4.20/kotlin-compiler-2.4.20.zip
          echo "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7  $RUNNER_TEMP/kotlin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kotlinc/bin/kotlinc" -version 2>&1 | grep -q 'kotlinc-jvm 2.4.20' || { echo "::error::not kotlinc 2.4.20"; exit 1; }
      - name: Download chrome-1
        uses: actions/download-artifact@v4
        with:
          name: chrome-1
          path: ${{ runner.temp }}/c1
      - name: Apply chrome-1's outputs
        run: if [ -s "$RUNNER_TEMP/c1/outputs.patch" ]; then git apply --binary "$RUNNER_TEMP/c1/outputs.patch"; fi
      - name: parity:lanes --run-host (android)
        run: |
          set +e
          pnpm -s run parity:lanes --run-host > "$RUNNER_TEMP/lanes.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/lanes.code"
          tail -200 "$RUNNER_TEMP/lanes.log"
      - name: Judge the android host lanes
        run: |
          set -euo pipefail
          code=$(cat "$RUNNER_TEMP/lanes.code")
          log="$RUNNER_TEMP/lanes.log"
          # parity:lanes exits 0 or 1 (a failing lane, a device lane carried as failed); anything else is a crash.
          if [ "$code" != 0 ] && [ "$code" != 1 ]; then echo "::error::parity:lanes --run-host exited $code on Linux; host-1 will fail the same way"; exit 1; fi
          if ! grep -qx 'parity:lanes: lanes, case lists, tolerances, sample rules, dump faults and the projection agree on ios and android' "$log"; then
            grep -A40 '^parity:lanes: parity FAILS:' "$log" || true
            echo "::error::lane parity fails on chrome-1's tree; host-1 will fail the same way"
            exit 1
          fi
          # As lanes-host's verdict (scripts/regen.ts lanesVerdict) judges, on android alone: every lane but the device lanes, which
          # are carried from the device runs, must pass.
          lanes=$(awk '/^android \(device DPRs /{a=1; next} /^[a-z]+ \(device DPRs /{a=0} a && /^  [a-z0-9-]+: /{print}' "$log")
          [ -n "$lanes" ] || { echo "::error::parity:lanes printed no android lanes"; exit 1; }
          bad=$(grep -vE '^  (device-[a-z0-9-]+|[a-z0-9-]+-device): ' <<<"$lanes" | grep -vE '^  [a-z0-9-]+: pass(;|$)' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "::error::an android host lane does not pass on chrome-1's tree; host-1 will fail the same way"; exit 1; fi
          echo "host-precheck: lane parity agrees and every android host lane passes on chrome-1's tree" | tee -a "$GITHUB_STEP_SUMMARY"
  # chrome-1 is skipped when resume-chrome-1 supplied it, so host-1 and every later round test the round before them themselves
  # (!cancelled, its result): the default success() skips a job below any skipped one.
  host-1:
    needs: [resolve, resume-chrome-1, chrome-1]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.chrome-1.result == 'success' || needs.resume-chrome-1.outputs.resumed == 'true') && (needs.resume-chrome-1.outputs.resumed == 'true' && needs.resume-chrome-1.outputs.next || needs.chrome-1.outputs.next) != 'false' }}
    uses: ./.github/workflows/regen-on-ci-round.yml
    with: { runner: xcode-27, side: host, args: '--only lanes-host', sha: '${{ needs.resolve.outputs.sha }}', prev: chrome-1, name: host-1, save_cache: "${{ needs.resolve.outputs.save == 'true' }}" }
  chrome-2:
    needs: [resolve, host-1]
    if: ${{ !cancelled() && needs.host-1.result == 'success' && needs.host-1.outputs.changed == 'true' && needs.host-1.outputs.next != 'false' }}
    uses: ./.github/workflows/regen-on-ci-round.yml
    with: { runner: macos-26, side: chrome, args: '--skip lanes-host', sha: '${{ needs.resolve.outputs.sha }}', prev: host-1, name: chrome-2, save_cache: "${{ needs.resolve.outputs.save == 'true' }}" }
  host-2:
    needs: [resolve, chrome-2]
    if: ${{ !cancelled() && needs.chrome-2.result == 'success' && needs.chrome-2.outputs.changed == 'true' && needs.chrome-2.outputs.next != 'false' }}
    uses: ./.github/workflows/regen-on-ci-round.yml
    with: { runner: xcode-27, side: host, args: '--only lanes-host', sha: '${{ needs.resolve.outputs.sha }}', prev: chrome-2, name: host-2, save_cache: "${{ needs.resolve.outputs.save == 'true' }}" }
  chrome-3:
    needs: [resolve, host-2]
    if: ${{ !cancelled() && needs.host-2.result == 'success' && needs.host-2.outputs.changed == 'true' && needs.host-2.outputs.next != 'false' }}
    uses: ./.github/workflows/regen-on-ci-round.yml
    with: { runner: macos-26, side: chrome, args: '--skip lanes-host', sha: '${{ needs.resolve.outputs.sha }}', prev: host-2, name: chrome-3, save_cache: "${{ needs.resolve.outputs.save == 'true' }}" }
  converge:
    needs: [resolve, resume-chrome-1, chrome-1, host-1, chrome-2, host-2, chrome-3]
    # The rounds' results only: resume-chrome-1 failing at job level means chrome-1 ran instead.
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode != 'skip' && !contains(format('{0} {1} {2} {3} {4}', needs.chrome-1.result, needs.host-1.result, needs.chrome-2.result, needs.host-2.result, needs.chrome-3.result), 'failure') && !contains(format('{0} {1} {2} {3} {4}', needs.chrome-1.result, needs.host-1.result, needs.chrome-2.result, needs.host-2.result, needs.chrome-3.result), 'cancelled')
    runs-on: ubuntu-latest
    outputs:
      last: ${{ steps.last.outputs.name }}
    steps:
      - name: Pick the last round
        id: last
        env:
          C1: ${{ needs.resume-chrome-1.outputs.resumed == 'true' && needs.resume-chrome-1.outputs.changed || needs.chrome-1.outputs.changed }}
          N1: ${{ needs.resume-chrome-1.outputs.resumed == 'true' && needs.resume-chrome-1.outputs.next || needs.chrome-1.outputs.next }}
          H1: ${{ needs.host-1.outputs.changed }}
          C2: ${{ needs.chrome-2.outputs.changed }}
          H2: ${{ needs.host-2.outputs.changed }}
          C3: ${{ needs.chrome-3.outputs.changed }}
        run: |
          set -euo pipefail
          # A round runs only when the one before it changed files and the other side would then run a step (the round's next
          # output, regen --explain); the chain is done when the last round changed nothing or left the other side nothing to do.
          if [ "$C3" = true ]; then echo "::error::no fixed point after 5 rounds: chrome-3 still changed files"; exit 1; fi
          [ -n "$C1" ] || { echo "::error::chrome-1 reported nothing"; exit 1; }
          if [ -n "$C3" ]; then last=chrome-3; elif [ -n "$H2" ]; then last=host-2; elif [ -n "$C2" ]; then last=chrome-2; elif [ -n "$H1" ]; then last=host-1; else last=chrome-1; fi
          [ -n "$H1" ] || [ "$N1" = false ] || { echo "::error::host-1 reported nothing"; exit 1; }
          echo "rounds: chrome-1=$C1 host-1=$H1 chrome-2=${C2:-not run} host-2=${H2:-not run} chrome-3=${C3:-not run}; final tree from $last" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "name=$last" >> "$GITHUB_OUTPUT"
  warm-check:
    needs: [resolve, converge]
    if: always() && needs.converge.result == 'success' && needs.resolve.outputs.mode == 'warm'
    runs-on: ubuntu-latest
    steps:
      - name: Download the last round
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.converge.outputs.last }}
          path: ${{ runner.temp }}/last
      - name: Master must already be at a fixed point
        run: |
          if [ -s "$RUNNER_TEMP/last/outputs.patch" ]; then
            echo "::error::master at ${{ needs.resolve.outputs.sha }} is not at a fixed point: regen on CI changed files (artifact ${{ needs.converge.outputs.last }})"
            exit 1
          fi
          echo "regen-on-ci: master at ${{ needs.resolve.outputs.sha }} is at a fixed point; the regen cache is warm" >> "$GITHUB_STEP_SUMMARY"
  # Patch mode: the final combined patch alone (the round's artifact also holds the regen cache and logs), for the landing driver to
  # apply with git apply --binary --index. Empty when the commit is already at its fixed point.
  patch:
    needs: [resolve, converge]
    if: always() && needs.converge.result == 'success' && needs.resolve.outputs.mode == 'patch'
    runs-on: ubuntu-latest
    steps:
      - name: Download the last round (the converged tree)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.converge.outputs.last }}
          path: ${{ runner.temp }}/last
      - name: The combined outputs.patch
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/last/outputs.patch" || { echo "::error::the last round has no outputs.patch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/patch"
          cp "$RUNNER_TEMP/last/outputs.patch" "$RUNNER_TEMP/patch/outputs.patch"
          if [ -s "$RUNNER_TEMP/patch/outputs.patch" ]; then
            echo "regen-on-ci: regen of $SHA changes files: $(git apply --stat "$RUNNER_TEMP/patch/outputs.patch" | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "regen-on-ci: $SHA is at a fixed point; the patch is empty" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the patch
        uses: actions/upload-artifact@v4
        with:
          name: regen-patch
          path: ${{ runner.temp }}/patch/outputs.patch
          if-no-files-found: error
  push:
    needs: [resolve, converge]
    if: always() && needs.converge.result == 'success' && needs.resolve.outputs.mode == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Check out the branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Download the last round (the converged tree)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.converge.outputs.last }}
          path: ${{ runner.temp }}/last
      # A commit pushed to the branch during the run (a test fix, say) no longer throws the run away: the outputs go on top of the
      # new head when the patch applies there and --explain finds every step's cache entry still covering the result, which
      # holds when the new commits changed no file any step reads. Anything else fails as before and asks for a new regen.
      - name: Where the branch is now
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$BRANCH" != master ] || exit 1
          now=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          [ -n "$now" ] || { echo "::error::$BRANCH no longer exists; nothing pushed"; exit 1; }
          # Nothing to commit (already at a fixed point) needs no judging: the next step says so whatever the branch did.
          if [ "$now" = "$SHA" ] || [ ! -s "$RUNNER_TEMP/last/outputs.patch" ]; then echo "moved=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Only a branch that moved forward from the regenerated commit qualifies; one moved back or sideways fails.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$now" -q .status)
          [ "$status" = ahead ] || { echo "::error::$BRANCH moved from $SHA to $now ($status, not ahead) during the run; nothing pushed, regen again"; exit 1; }
          git fetch -q --no-tags --depth=1 origin "$now"
          git checkout -q --detach "$now"
          git apply --binary --index "$RUNNER_TEMP/last/outputs.patch" || { echo "::error::$BRANCH moved from $SHA to $now during the run and the outputs do not apply there; nothing pushed, regen again"; exit 1; }
          echo "regen-on-ci: $BRANCH moved from $SHA to $now during the run; judging the outputs on $now" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "moved=true"; echo "now=$now"; } >> "$GITHUB_OUTPUT"
      - name: Moved - set up pnpm 10.33.2
        if: steps.head.outputs.moved == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Moved - set up Node 24.15.0
        if: steps.head.outputs.moved == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Moved - every step's cache entry must still cover the tree
        if: steps.head.outputs.moved == 'true'
        env:
          # The machine and environment the rounds keyed with (regen-on-ci-round.yml), so the keys match theirs.
          DRAGON_REGEN_MACHINE: '{"platform":"darwin","arch":"arm64","node":"v24.15.0"}'
          DRAGON_WPT_DIR: /Users/runner/wpt
          JAVA_HOME: /opt/homebrew/opt/openjdk@17
          ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NOW: ${{ steps.head.outputs.now }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          mkdir -p .git/dragon-regen
          zstd -dcq "$RUNNER_TEMP/last/store.tar.zst" | tar -xf - -C .git/dragon-regen
          node scripts/regen.ts --explain
          stale=$(jq -r '[.[] | select(.action != "skipped") | "\(.step) (\(.action): \(.why))"] | join("; ")' node_modules/.cache/dragon-regen/last-run.json)
          total=$(jq length node_modules/.cache/dragon-regen/last-run.json)
          [ "$total" -gt 0 ] || { echo "::error::regen --explain judged no step"; exit 1; }
          [ -z "$stale" ] || { echo "::error::the commits pushed during the run change regen inputs: $stale; nothing pushed, regen again"; exit 1; }
          echo "regen-on-ci: all $total steps are still covered on $NOW" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit and push the outputs, then start CI on the new commit
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          SHA: ${{ needs.resolve.outputs.sha }}
          NOW: ${{ steps.head.outputs.now }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ "$BRANCH" != master ] || exit 1
          if [ ! -s "$RUNNER_TEMP/last/outputs.patch" ]; then
            echo "regen-on-ci: $BRANCH at $SHA is already at a fixed point; no commit" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pushed=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$NOW" ]; then
            git apply --binary --index "$RUNNER_TEMP/last/outputs.patch"
            onto=""
          else
            onto=$'\n'"Onto: $NOW (pushed during the run; regen --explain found every step's cache entry still covering it)"
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -F - <<EOF
          Regenerate on CI: pnpm regen (regen-on-ci)

          Commands: pnpm regen --skip lanes-host (macos-26) and pnpm regen --only lanes-host (xcode-27), alternated to a fixed
          point.
          Base: $SHA$onto
          Run: $RUN_URL
          EOF
          git diff --stat HEAD~1 | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          # The lease refuses a branch that moved again since it was judged, back to an ancestor included.
          git push --force-with-lease="refs/heads/$BRANCH:${NOW:-$SHA}" origin "HEAD:refs/heads/$BRANCH"
          new=$(git rev-parse HEAD)
          echo "regen-on-ci: pushed $new to $BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pushed=$new" >> "$GITHUB_OUTPUT"
          gh workflow run ci.yml --ref "$BRANCH" -R "$GITHUB_REPOSITORY"
      # pnpm ci:regen reads this step's conclusion over REST: success means no commit, skipped means the step above pushed one.
      - name: Already at a fixed point (no commit)
        if: steps.push.outputs.pushed == 'none'
        run: echo "nothing to push"
      - name: Remove the regen label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --remove-label regen || true
