# Pull request checks. Macroscope's correctness review waits for this job (.macroscope/correctness/correctness.md).
# Every branch push runs it too, so a stacked PR based on its parent branch gets a CI run on its head; pr:review and the
# landing driver read the "checks" runs of the head commit, whichever event made them. A push made with GITHUB_TOKEN starts no
# workflow, so regen-on-ci.yml dispatches this one on the branch after pushing its regen commit.
name: ci
on:
  pull_request:
    branches: [master, 'review/**']
  push:
    branches-ignore: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Platform-free suites (packages/layout, packages/dragon)
        run: pnpm exec vitest run packages/layout packages/dragon
